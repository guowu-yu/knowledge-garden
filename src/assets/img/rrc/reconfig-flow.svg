<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Reconfiguration message flow">
  <rect width="1000" height="420" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">RRCReconfiguration message flow</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Network pushes delta/full config; UE applies then acknowledges</text>

  <text x="120" y="120" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a5561">UE</text>
  <text x="820" y="120" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a5a14">gNB</text>
  <line x1="140" y1="130" x2="140" y2="380" stroke="#d0dde3" stroke-width="2"/>
  <line x1="840" y1="130" x2="840" y2="380" stroke="#d0dde3" stroke-width="2"/>

  <path d="M820 180 H160" stroke="#c9852c" stroke-width="3" marker-end="url(#b)"/>
  <text x="500" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#8a5a14">DL-DCCH: RRCReconfiguration (rrc-TransactionIdentifier + IEs)</text>

  <rect x="300" y="210" width="400" height="60" rx="10" fill="#1f3a4d"/>
  <text x="500" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fff">UE applies config (or fails / reestablishes)</text>

  <path d="M160 320 H820" stroke="#0f7a8a" stroke-width="3" marker-end="url(#a)"/>
  <text x="500" y="308" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#0a5561">UL-DCCH: RRCReconfigurationComplete (same transaction id)</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f7a8a"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9852c"/></marker>
  </defs>
</svg>
