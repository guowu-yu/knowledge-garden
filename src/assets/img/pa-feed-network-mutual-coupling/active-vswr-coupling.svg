<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">互耦与有源驻波：扫描时才暴露的"隐形敌人"</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#556">阵中单元的输入阻抗随扫描角变化；匹配到 50 Ω 只是正扫的特权</text>

  <!-- VSWR vs scan -->
  <rect x="30" y="80" width="440" height="240" rx="10" fill="#ffffff" stroke="#c96a1f" stroke-width="1.5"/>
  <text x="48" y="106" font-size="13" font-weight="bold" fill="#c96a1f">有源 VSWR 随扫描角上升</text>
  <line x1="70" y1="290" x2="450" y2="290" stroke="#8899a6" stroke-width="1.3"/>
  <line x1="70" y1="126" x2="70" y2="290" stroke="#8899a6" stroke-width="1.3"/>
  <text x="452" y="304" font-size="10.5" fill="#667">θ0</text>
  <text x="26" y="140" font-size="10.5" fill="#667">VSWR</text>
  <text x="66" y="292" font-size="10" fill="#667">0°</text>
  <text x="190" y="292" font-size="10" fill="#667">30°</text>
  <text x="300" y="292" font-size="10" fill="#667">45°</text>
  <text x="420" y="292" font-size="10" fill="#667">60°</text>
  <text x="30" y="200" font-size="10" fill="#667">2:1</text>
  <text x="30" y="258" font-size="10" fill="#667">3:1</text>
  <path d="M70 268 C 160 266, 240 258, 300 246 C 350 236, 400 220, 445 208" fill="none" stroke="#c96a1f" stroke-width="2.4"/>
  <text x="300" y="200" font-size="10.5" fill="#c96a1f">正扫匹配良好，45° 后急升</text>
  <circle cx="445" cy="208" r="4" fill="#8a3a6a"/>
  <text x="352" y="196" font-size="10" fill="#8a3a6a">潜在的盲区</text>

  <!-- mechanism -->
  <rect x="490" y="80" width="440" height="240" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.5"/>
  <text x="508" y="106" font-size="13" font-weight="bold" fill="#0f7a8a">互耦怎么"改"了阻抗</text>
  <g font-size="11" fill="#333">
    <text x="508" y="132">单元 A 辐射的能量不只走了空间，</text>
    <text x="508" y="152">还通过邻近单元与基板<tspan fill="#c96a1f">表面波</tspan>耦合回来。</text>
    <text x="508" y="178">扫描时各单元的相位不同，耦合电压的</text>
    <text x="508" y="198">矢量叠加随之改变 → 端口看到的阻抗</text>
    <text x="508" y="218">变化 → 反射变化 → 增益损失。</text>
    <text x="508" y="248" fill="#8a3a6a">极端情况：扫描盲区（表面波与某阶</text>
    <text x="508" y="268" fill="#8a3a6a">Floquet 模同步）→ 100% 反射、增益塌陷。</text>
    <text x="508" y="296" fill="#667">这类效应公式算不出，只能全波仿真（AEP）</text>
    <text x="508" y="314" fill="#667">或整机实测。</text>
  </g>

  <!-- decoupling techniques -->
  <rect x="30" y="336" width="900" height="184" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  <text x="48" y="362" font-size="13" font-weight="bold" fill="#4a7a3a">降耦与改善有源匹配的常用手段</text>
  <g font-size="11" fill="#333">
    <text x="48" y="388">① 缩小单元间距 / 减薄基板：降低表面波激励，但可能引入互耦型盲区（d≈0.5λ 附近）；</text>
    <text x="48" y="410">② 电磁带隙（EBG）/ 缺陷地结构（DGS）：在单元间加隔离栅，抑制表面波；</text>
    <text x="48" y="432">③ 宽带阻抗匹配层（WAIM / 超表面罩）：把"陡峭的有源阻抗"拉平到宽角范围；</text>
    <text x="48" y="454">④ 单元内加寄生结构 / 介质覆层：调 AEP，把增益滚降压平；</text>
    <text x="48" y="476">⑤ 阵列级去耦网络：在馈网里加隔离元件，代价是插入损耗与复杂度。</text>
    <text x="48" y="502" fill="#8a3a6a">算法视角：AEP 的滚降等价于"每个角度的有效权值"发生变化——这就是为什么强扫描阵必须按角度做增益/相位补偿表，而不是用一套权值走天下。</text>
  </g>
</svg>
