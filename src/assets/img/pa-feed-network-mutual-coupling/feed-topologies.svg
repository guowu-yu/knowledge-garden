<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">四种馈电方式：把功率送到阵元的四条路</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#556">越靠近"数字"，灵活性越高、代价越大；越靠近"强制"，损耗越大、越不灵活</text>

  <!-- A corporate -->
  <rect x="30" y="80" width="213" height="330" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
  <text x="136" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f7a8a">① 强制（并联）馈电</text>
  <text x="136" y="126" text-anchor="middle" font-size="10.5" fill="#667">corporate / parallel</text>
  <!-- tree -->
  <circle cx="136" cy="152" r="4" fill="#0f7a8a"/>
  <line x1="136" y1="152" x2="80" y2="196" stroke="#0f7a8a" stroke-width="1.5"/>
  <line x1="136" y1="152" x2="192" y2="196" stroke="#0f7a8a" stroke-width="1.5"/>
  <line x1="80" y1="196" x2="52" y2="240" stroke="#0f7a8a" stroke-width="1.5"/>
  <line x1="80" y1="196" x2="108" y2="240" stroke="#0f7a8a" stroke-width="1.5"/>
  <line x1="192" y1="196" x2="164" y2="240" stroke="#0f7a8a" stroke-width="1.5"/>
  <line x1="192" y1="196" x2="220" y2="240" stroke="#0f7a8a" stroke-width="1.5"/>
  <g fill="#0f7a8a"><circle cx="52" cy="240" r="3"/><circle cx="108" cy="240" r="3"/><circle cx="164" cy="240" r="3"/><circle cx="220" cy="240" r="3"/></g>
  <g fill="#556" font-size="10.5">
    <text x="48" y="270" text-anchor="middle">E1</text><text x="108" y="270" text-anchor="middle">E2</text>
    <text x="164" y="270" text-anchor="middle">E3</text><text x="220" y="270" text-anchor="middle">E4</text>
  </g>
  <text x="46" y="300" font-size="11" fill="#333">· 等路径长，宽带</text>
  <text x="46" y="320" font-size="11" fill="#333">· 占 PCB 面积大</text>
  <text x="46" y="340" font-size="11" fill="#c96a1f">· log2(N) 级功分，损耗累加</text>
  <text x="46" y="360" font-size="11" fill="#333">· Wilkinson 功分可带隔离</text>
  <text x="46" y="386" font-size="10.5" fill="#667">X 波段微带 1~3 dB；</text>
  <text x="46" y="402" font-size="10.5" fill="#667">Ka 波段可超 6~8 dB</text>

  <!-- B series -->
  <rect x="253" y="80" width="213" height="330" rx="10" fill="#ffffff" stroke="#c96a1f" stroke-width="1.6"/>
  <text x="359" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#c96a1f">② 串联馈电</text>
  <text x="359" y="126" text-anchor="middle" font-size="10.5" fill="#667">series feed</text>
  <line x1="292" y1="160" x2="428" y2="160" stroke="#c96a1f" stroke-width="1.8"/>
  <g fill="#c96a1f">
    <circle cx="308" cy="160" r="3.5"/><circle cx="348" cy="160" r="3.5"/><circle cx="388" cy="160" r="3.5"/><circle cx="424" cy="160" r="3.5"/>
  </g>
  <g stroke="#c96a1f" stroke-width="1.5">
    <line x1="308" y1="160" x2="308" y2="196"/><line x1="348" y1="160" x2="348" y2="196"/>
    <line x1="388" y1="160" x2="388" y2="196"/><line x1="424" y1="160" x2="424" y2="196"/>
  </g>
  <g fill="#556" font-size="10.5" text-anchor="middle">
    <text x="308" y="216">E1</text><text x="348" y="216">E2</text><text x="388" y="216">E3</text><text x="424" y="216">E4</text>
  </g>
  <text x="292" y="160" font-size="10" fill="#0f7a8a" text-anchor="end" dx="-6" dy="-6">in</text>
  <text x="269" y="300" font-size="11" fill="#333">· 结构紧凑、走线短</text>
  <text x="269" y="320" font-size="11" fill="#8a3a6a">· 窄带：频率变化→波束偏</text>
  <text x="269" y="340" font-size="11" fill="#333">· 沿线衰减带来幅相不均</text>
  <text x="269" y="360" font-size="11" fill="#333">· 适合驻波/行波阵</text>

  <!-- C space -->
  <rect x="476" y="80" width="213" height="330" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  <text x="582" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">③ 空间馈电</text>
  <text x="582" y="126" text-anchor="middle" font-size="10.5" fill="#667">space feed / lens</text>
  <!-- feed horn -->
  <polygon points="500,150 528,138 528,166 500,154" fill="#4a7a3a"/>
  <g stroke="#4a7a3a" stroke-width="1.2" fill="none">
    <line x1="530" y1="146" x2="640" y2="120"/><line x1="532" y1="152" x2="642" y2="152"/>
    <line x1="530" y1="158" x2="640" y2="184"/>
  </g>
  <!-- array plane -->
  <rect x="642" y="112" width="18" height="120" rx="3" fill="#e8f2f4" stroke="#4a7a3a" stroke-width="1.4"/>
  <g fill="#4a7a3a">
    <circle cx="651" cy="124" r="2"/><circle cx="651" cy="146" r="2"/><circle cx="651" cy="168" r="2"/><circle cx="651" cy="190" r="2"/><circle cx="651" cy="212" r="2"/>
  </g>
  <text x="500" y="248" font-size="11" fill="#333">· 无强制馈网损耗</text>
  <text x="500" y="268" font-size="11" fill="#333">· 需要馈源 + 准直透镜</text>
  <text x="500" y="288" font-size="11" fill="#333">· 体积/效率权衡</text>
  <text x="500" y="308" font-size="11" fill="#4a7a3a">· 常配 Rotman 透镜做</text>
  <text x="500" y="324" font-size="11" fill="#4a7a3a">　 多波束（准无源）</text>
  <text x="500" y="352" font-size="10.5" fill="#667">· 阵面需在每个扫描角</text>
  <text x="500" y="368" font-size="10.5" fill="#667">　 接受不同入射相位</text>

  <!-- D digital -->
  <rect x="699" y="80" width="231" height="330" rx="10" fill="#ffffff" stroke="#8a3a6a" stroke-width="1.6"/>
  <text x="814" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a6a">④ 数字馈电</text>
  <text x="814" y="126" text-anchor="middle" font-size="10.5" fill="#667">digital beamforming</text>
  <g fill="#8a3a6a">
    <rect x="726" y="146" width="52" height="30" rx="5"/><rect x="790" y="146" width="52" height="30" rx="5"/>
    <rect x="854" y="146" width="52" height="30" rx="5"/>
  </g>
  <g fill="#ffffff" font-size="9.5" text-anchor="middle">
    <text x="752" y="165">ADC/DAC</text><text x="816" y="165">ADC/DAC</text><text x="880" y="165">ADC/DAC</text>
  </g>
  <g stroke="#8a3a6a" stroke-width="1.5">
    <line x1="752" y1="176" x2="752" y2="202"/><line x1="816" y1="176" x2="816" y2="202"/><line x1="880" y1="176" x2="880" y2="202"/>
  </g>
  <g fill="#556" font-size="10.5" text-anchor="middle">
    <text x="752" y="218">E1</text><text x="816" y="218">E2</text><text x="880" y="218">E3</text>
  </g>
  <text x="716" y="250" font-size="11" fill="#333">· 每阵元独立 ADC/DAC</text>
  <text x="716" y="270" font-size="11" fill="#8a3a6a">· 权值全在软件里</text>
  <text x="716" y="290" font-size="11" fill="#333">· 多波束、自适应零陷</text>
  <text x="716" y="310" font-size="11" fill="#333">· 数据率/功耗/成本最高</text>
  <text x="716" y="336" font-size="10.5" fill="#667">馈网损耗最小（仅数字域</text>
  <text x="716" y="352" font-size="10.5" fill="#667">加权），但 ADC 是瓶颈</text>

  <text x="480" y="436" text-anchor="middle" font-size="12" fill="#333">选择顺序（成本敏感时）：<tspan fill="#4a7a3a">空间馈电</tspan> → <tspan fill="#0f7a8a">强制馈电</tspan> → <tspan fill="#8a3a6a">混合</tspan> → <tspan fill="#8a3a6a">全数字</tspan></text>
  <text x="480" y="462" text-anchor="middle" font-size="11.5" fill="#667">馈电方式不是"天线的事"：它决定了你能不能做数字零陷、能做几个波束、以及功率该在哪一级算。</text>
  <text x="480" y="486" text-anchor="middle" font-size="11.5" fill="#8a3a6a">算法视角：强制/串联馈电下，你的"权值"只是给移相器的配相码；数字馈电下，权值才是真正的复乘。</text>
  <text x="480" y="512" text-anchor="middle" font-size="11.5" fill="#556">混合架构（子阵级数字）介于两者之间——这是 5G 毫米波与卫星载荷最常落地的形态（见专题 16）。</text>
</svg>
