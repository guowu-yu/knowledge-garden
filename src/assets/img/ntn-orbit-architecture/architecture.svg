<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="620" fill="#eef5f8"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">透明 vs 再生：gNB 在天上还是在地上</text>

  <!-- Transparent -->
  <rect x="30" y="70" width="440" height="330" rx="12" fill="#ffffff" stroke="#0f7a8a" stroke-width="2"/>
  <rect x="30" y="70" width="440" height="42" rx="12" fill="#0f7a8a"/>
  <text x="250" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">透明载荷（弯管）· Rel-17 主线</text>

  <g transform="translate(250,150)">
    <rect x="-24" y="-16" width="48" height="32" rx="6" fill="#0f7a8a"/>
    <rect x="-54" y="-9" width="26" height="18" rx="2" fill="#0f7a8a" opacity="0.7"/>
    <rect x="28" y="-9" width="26" height="18" rx="2" fill="#0f7a8a" opacity="0.7"/>
    <text x="0" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f7a8a">卫星 = 射频中继</text>
    <text x="0" y="54" text-anchor="middle" font-size="11.5" fill="#555">滤波/变频/放大，波形原样转接</text>
  </g>

  <!-- service link -->
  <line x1="130" y1="330" x2="228" y2="170" stroke="#c96a1f" stroke-width="2.5"/>
  <text x="128" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#c96a1f" transform="rotate(-58 128 270)">服务链路 f1</text>
  <g transform="translate(110,350)">
    <rect x="-16" y="-14" width="32" height="28" rx="7" fill="#c96a1f"/>
    <text x="0" y="6" text-anchor="middle" font-size="12" fill="#fff">UE</text>
    <text x="0" y="34" text-anchor="middle" font-size="11.5" fill="#555">手机/VSAT</text>
  </g>

  <!-- feeder link -->
  <line x1="272" y1="170" x2="370" y2="330" stroke="#4a7a3a" stroke-width="2.5"/>
  <text x="382" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" transform="rotate(58 382 270)">馈电链路 f2</text>
  <g transform="translate(390,350)">
    <rect x="-34" y="-14" width="68" height="28" rx="7" fill="#4a7a3a"/>
    <text x="0" y="6" text-anchor="middle" font-size="12" fill="#fff">信关站</text>
    <text x="0" y="34" text-anchor="middle" font-size="11.5" fill="#555">gNB 整机在此</text>
  </g>
  <line x1="424" y1="336" x2="460" y2="336" stroke="#0f7a8a" stroke-width="2" marker-end="url(#arrT)"/>
  <defs><marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#0f7a8a"/></marker></defs>
  <text x="462" y="341" font-size="11.5" fill="#0f7a8a">5GC</text>

  <g font-size="12.5" fill="#333">
    <text x="48" y="416" font-weight="bold" fill="#0f7a8a">关键数字：两跳链路 → RTT 翻倍（GEO 最坏 541 ms）</text>
    <text x="48" y="436">星上无解码 → 噪声被一并放大；无星间链路；波形无关（升级不改星）</text>
  </g>

  <!-- Regenerative -->
  <rect x="490" y="70" width="440" height="330" rx="12" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
  <rect x="490" y="70" width="440" height="42" rx="12" fill="#8a4f9e"/>
  <text x="710" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">再生载荷（gNB 上星）· Rel-19 主线</text>

  <g transform="translate(710,160)">
    <rect x="-34" y="-22" width="68" height="44" rx="6" fill="#8a4f9e"/>
    <rect x="-66" y="-13" width="28" height="26" rx="2" fill="#8a4f9e" opacity="0.7"/>
    <rect x="38" y="-13" width="28" height="26" rx="2" fill="#8a4f9e" opacity="0.7"/>
    <text x="0" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4f9e">星上跑完整 gNB 协议栈</text>
    <text x="0" y="60" text-anchor="middle" font-size="11.5" fill="#555">调制解调/编码/调度/路由</text>
  </g>

  <!-- service link only -->
  <line x1="590" y1="345" x2="688" y2="185" stroke="#c96a1f" stroke-width="2.5"/>
  <text x="588" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#c96a1f" transform="rotate(-58 588 260)">服务链路（NR）</text>
  <g transform="translate(570,365)">
    <rect x="-16" y="-14" width="32" height="28" rx="7" fill="#c96a1f"/>
    <text x="0" y="6" text-anchor="middle" font-size="12" fill="#fff">UE</text>
  </g>

  <!-- TNL -->
  <g transform="translate(850,365)">
    <rect x="-38" y="-14" width="76" height="28" rx="7" fill="#4a7a3a"/>
    <text x="0" y="6" text-anchor="middle" font-size="12" fill="#fff">馈电站</text>
    <text x="0" y="34" text-anchor="middle" font-size="11.5" fill="#555">退化为传输网节点</text>
  </g>
  <line x1="744" y1="182" x2="836" y2="348" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="866" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" transform="rotate(60 866 260)">馈电=TNL</text>
  <text x="710" y="255" font-size="13" fill="#8a4f9e" font-weight="bold">← NR 空口到星为止</text>

  <g font-size="12.5" fill="#333">
    <text x="508" y="416" font-weight="bold" fill="#8a4f9e">关键数字：RTT 减半（GEO 281 ms / LEO 12.9 ms）</text>
    <text x="508" y="436">星上解码再生 → 可加 ISL 星间路由 / 存储转发；信关站只需视距即可，全球布站自由度大增</text>
  </g>

  <!-- scenarios strip -->
  <rect x="30" y="480" width="900" height="115" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.5"/>
  <text x="50" y="508" font-size="15" font-weight="bold" fill="#0f7a8a">TR 38.821 五个参考场景 = 轨道 × 载荷 × 波束 三轴组合</text>
  <g font-size="13.5" fill="#333" font-family="Consolas,monospace">
    <text x="50" y="536">A  GEO 透明 地球固定波束　│ B  GEO 再生 地球固定波束　│ C  LEO 透明 地球移动波束</text>
    <text x="50" y="562">D1 LEO 再生 地球固定波束　│ D2 LEO 再生 地球移动波束</text>
  </g>
  <text x="50" y="586" font-size="12.5" fill="#666">三轴即三道选择题：轨道选延迟与覆盖节奏；载荷选 gNB 归属与 RTT；波束选复杂度放星上还是放协议。</text>
</svg>
