<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="560" fill="#eef5f8"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">馈电链路切换：非 GEO 卫星"轮流进站"</text>

  <!-- earth arc -->
  <path d="M 60 470 Q 480 330 900 470" fill="#cfe7ee" stroke="#0f7a8a" stroke-width="2"/>
  <!-- gateways -->
  <g transform="translate(240,436)">
    <rect x="-34" y="-13" width="68" height="26" rx="6" fill="#4a7a3a"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#fff">GW-1</text>
    <text x="0" y="32" text-anchor="middle" font-size="11.5" fill="#555">信关站 A</text>
  </g>
  <g transform="translate(720,436)">
    <rect x="-34" y="-13" width="68" height="26" rx="6" fill="#4a7a3a"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#fff">GW-2</text>
    <text x="0" y="32" text-anchor="middle" font-size="11.5" fill="#555">信关站 B</text>
  </g>

  <!-- satellite positions along track -->
  <g font-size="12" fill="#0f7a8a" font-weight="bold">
    <g transform="translate(140,150)"><rect x="-16" y="-11" width="32" height="22" rx="5" fill="#0f7a8a" opacity="0.5"/><text x="0" y="-20" text-anchor="middle">t₁ 只见 GW-2</text></g>
    <g transform="translate(300,110)"><rect x="-16" y="-11" width="32" height="22" rx="5" fill="#0f7a8a" opacity="0.75"/><text x="0" y="-20" text-anchor="middle">t₂ 见 GW-1+2</text></g>
    <g transform="translate(480,92)"><rect x="-16" y="-11" width="32" height="22" rx="5" fill="#0f7a8a"/><text x="0" y="-20" text-anchor="middle">t₃ 双站可视</text></g>
    <g transform="translate(660,110)"><rect x="-16" y="-11" width="32" height="22" rx="5" fill="#0f7a8a" opacity="0.75"/><text x="0" y="-20" text-anchor="middle">t₄ 见 GW-1+2</text></g>
    <g transform="translate(820,150)"><rect x="-16" y="-11" width="32" height="22" rx="5" fill="#0f7a8a" opacity="0.5"/><text x="0" y="-20" text-anchor="middle">t₅ 只见 GW-1</text></g>
  </g>
  <path d="M 140 150 Q 480 40 820 150" fill="none" stroke="#0f7a8a" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- feeder link switch illustration -->
  <line x1="300" y1="122" x2="712" y2="424" stroke="#c96a1f" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="660" y1="122" x2="248" y2="424" stroke="#8a4f9e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="470" y="250" text-anchor="middle" font-size="13" fill="#8a4f9e" font-weight="bold">切换点：馈电链路从 GW-1 → GW-2</text>
  <text x="470" y="272" text-anchor="middle" font-size="12.5" fill="#555">在双站同时可视的窗口内完成，服务链路与 UE 侧无感</text>

  <!-- rules box -->
  <rect x="60" y="480" width="840" height="66" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.5"/>
  <g font-size="13" fill="#333">
    <text x="80" y="505">▸ TR 38.821 规则：GEO 可由多个信关站分区喂；<tspan font-weight="bold">非 GEO 卫星同一时刻只被一个信关站服务</tspan>，依次换站。</text>
    <text x="80" y="528">▸ 系统须保证服务/馈电连续性窗口足够长，完成移动性锚定与切换——Rel-19 的馈电切换标准化即把这条"默契"写成规范。</text>
  </g>

  <!-- timeline -->
  <line x1="80" y1="330" x2="880" y2="330" stroke="#999" stroke-width="2"/>
  <g font-size="11.5" fill="#555" font-family="Consolas,monospace">
    <text x="140" y="352" text-anchor="middle">GW-2 服务</text>
    <text x="480" y="352" text-anchor="middle">过渡窗口（双可视）</text>
    <text x="820" y="352" text-anchor="middle">GW-1 服务</text>
  </g>
  <rect x="140" y="322" width="290" height="16" rx="4" fill="#4a7a3a" opacity="0.5"/>
  <rect x="430" y="322" width="100" height="16" rx="4" fill="#c96a1f" opacity="0.6"/>
  <rect x="530" y="322" width="290" height="16" rx="4" fill="#8a4f9e" opacity="0.5"/>
</svg>
