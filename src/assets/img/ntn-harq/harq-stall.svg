<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="HARQ 进程停转：各轨道需要的进程数与可用进程数对比">
  <rect width="900" height="470" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">HARQ 停转（Stalling）：进程数是管道深度，RTT 决定需要多深的管道</text>

  <g>
    <rect x="50" y="56" width="820" height="330" rx="12" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="70" y="84" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#7a8b99">连续传输所需 HARQ 进程数 ≈ RTT / TTI（15 kHz SCS，1 slot = 1 ms）——超过可用进程数即「管道断流」</text>

    <!-- axes -->
    <line x1="90" y1="100" x2="90" y2="330" stroke="#c7d6e0" stroke-width="1.4"/>
    <line x1="90" y1="330" x2="850" y2="330" stroke="#c7d6e0" stroke-width="1.4"/>

    <!-- reference lines: 16 and 32 -->
    <line x1="90" y1="167.2" x2="850" y2="167.2" stroke="#9db6c4" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="846" y="160" text-anchor="end" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#7a8b99">16 进程（Rel-16 上限）</text>
    <line x1="90" y1="84" x2="850" y2="84" stroke="#c9852c" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="846" y="100" text-anchor="end" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#a9681f">32 进程（Rel-17 NTN 扩展上限）</text>

    <!-- bars: value -> y = 330 - value*8.9 (clamp) -->
    <!-- 地面 7 -->
    <rect x="120" y="267.7" width="70" height="62.3" fill="#9db6c4"/>
    <text x="155" y="352" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">地面</text>
    <text x="155" y="258" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0b1c28">7</text>
    <text x="155" y="368" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7a8b99">RTT ≈ 7 ms</text>

    <!-- LEO600 min 15 -->
    <rect x="250" y="196.5" width="70" height="133.5" fill="#4a8fa0"/>
    <text x="285" y="352" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">LEO-600 min</text>
    <text x="285" y="187" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0b1c28">15</text>
    <text x="285" y="368" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7a8b99">≈20 ms</text>

    <!-- LEO600 typ 25 -->
    <rect x="380" y="107.5" width="70" height="222.5" fill="#0f7a8a"/>
    <text x="415" y="352" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">LEO-600 typ</text>
    <text x="415" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">25</text>
    <text x="415" y="368" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7a8b99">≈25–26 ms</text>

    <!-- LEO600 max 33 / LEO1200 37 -->
    <rect x="510" y="36.3" width="70" height="293.7" fill="#0a5561"/>
    <text x="545" y="352" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">LEO-600 max</text>
    <text x="545" y="28" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">33</text>
    <text x="545" y="368" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7a8b99">≈33 ms</text>

    <!-- LEO1200 typ 37 (clamped to top) -->
    <rect x="640" y="30" width="70" height="300" fill="#0a5561" opacity="0.85"/>
    <text x="675" y="352" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">LEO-1200 typ</text>
    <text x="675" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#a9681f">37</text>
    <text x="675" y="368" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7a8b99">≈37 ms</text>

    <!-- GEO 547 (arrow pointing up, off scale) -->
    <rect x="770" y="30" width="50" height="300" fill="#c9852c" opacity="0.9"/>
    <text x="795" y="352" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">GEO</text>
    <text x="795" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#a9681f">547 ↑</text>
    <text x="795" y="368" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7a8b99">≈547 ms</text>

    <text x="90" y="420" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">32 进程对 LEO-600 绰绰有余（25/32=100% 利用率、最大时延也仅 33 略溢出 3%）；对 GEO 是徒劳（547/32 = 2.9%）——后者唯一的出路是关反馈</text>
  </g>
</svg>
