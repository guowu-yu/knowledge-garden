<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="HARQ 反馈禁用模式：盲重传与 RLC 兜底">
  <rect width="900" height="500" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">关掉反馈，让 RLC 接管：feedback-disabled 模式全流程（GEO 的唯一解）</text>

  <!-- left: flow -->
  <g>
    <rect x="50" y="56" width="430" height="420" rx="12" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="70" y="84" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a5561">运行时流程</text>

    <rect x="80" y="100" width="370" height="44" rx="8" fill="#e2eef4"/>
    <text x="265" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0a5561">RRC 按 HARQ 进程 ID 逐进程配置</text>
    <text x="265" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#0b1c28">downlinkHARQ-FeedbackDisabled（per-process 开关）</text>

    <rect x="80" y="156" width="370" height="44" rx="8" fill="#fdf3e3" stroke="#c9852c" stroke-width="1.2"/>
    <text x="265" y="174" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#a9681f">gNB 盲重传：不等 ACK/NACK 直接调度下一次</text>
    <text x="265" y="191" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#7a8b99">同进程新 PDSCH ≥ Tproc,1 之后（38.214 §5.1 约束）</text>

    <rect x="80" y="212" width="370" height="44" rx="8" fill="#e2eef4"/>
    <text x="265" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0a5561">UE 解码失败也不发反馈，进程立即释放</text>
    <text x="265" y="247" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">软缓存不留驻 → 无停转、无缓冲占用</text>

    <rect x="80" y="268" width="370" height="44" rx="8" fill="#e2eef4"/>
    <text x="265" y="286" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0a5561">缺口的 PDU 由 RLC AM 的 STATUS 报告补齐</text>
    <text x="265" y="303" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">UE 检测 SN 缺失 → NACK_SN → gNB 重传 AMD PDU</text>

    <rect x="80" y="324" width="370" height="44" rx="8" fill="#e2eef4"/>
    <text x="265" y="342" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0a5561">首次传输就得打准：更保守的 MCS</text>
    <text x="265" y="359" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">目标 1% BLER + 无软合并 → 损失约 2–3 dB 增益</text>

    <text x="80" y="396" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">代价：RLC 重传要跑完整 RTT（GEO ≈ 540 ms 量级），</text>
    <text x="80" y="414" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">时延敏感业务只剩「首传就成」这一条路；</text>
    <text x="80" y="432" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">换星/广播类业务（PDCP/SDU 丢弃定时器同步放大）。</text>
    <text x="80" y="458" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#0a5561">38.300 §16.14：GSO 关反馈 + RLC ARQ 是推荐组合</text>
  </g>

  <!-- right: codebook semantics -->
  <g>
    <rect x="500" y="56" width="370" height="420" rx="12" fill="#fdf3e3" stroke="#c9852c" stroke-width="1.6"/>
    <text x="520" y="84" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#a9681f">码本语义：禁反馈进程怎么进 codebook</text>

    <text x="520" y="112" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#0b1c28">Type-1（半静态）</text>
    <text x="520" y="130" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">禁反馈进程的 PDSCH → 按位上报 NACK</text>
    <text x="520" y="148" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">（占位但内容恒为 NACK，接收端可忽略）</text>

    <text x="520" y="184" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#0b1c28">Type-2（动态 DAI）</text>
    <text x="520" y="202" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">禁反馈进程的 PDSCH → 不进入 codebook</text>
    <text x="520" y="220" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">（其 DCI 不携带 DAI，不参与计数）</text>

    <text x="520" y="256" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#a9681f">TypeX（NTN 专属，38.213）</text>
    <text x="520" y="274" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">码本尺寸只由「反馈开启」的调度 DCI 决定</text>
    <text x="520" y="292" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">禁反馈传输对码本完全透明</text>
    <text x="520" y="310" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">（UE 能力：typeX-HARQ-Codebook-r17，挂 BandNR）</text>

    <line x1="520" y1="330" x2="850" y2="330" stroke="#e8d5b4" stroke-width="1.4"/>
    <text x="520" y="356" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#a9681f">混合部署技巧</text>
    <text x="520" y="378" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">开关是 per-process 的：同一小区可以一部分进程</text>
    <text x="520" y="396" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">开反馈跑信令/低时延，一部分关反馈跑大流量</text>
    <text x="520" y="420" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">（对应 UE 能力专题里的 HARQ 进程号/码本能力矩阵）</text>
    <text x="520" y="452" font-family="Consolas, monospace" font-size="10.5" fill="#7a8b99">RAN2 决议：enable/disable by RRC per HARQ process ID</text>
  </g>
</svg>
