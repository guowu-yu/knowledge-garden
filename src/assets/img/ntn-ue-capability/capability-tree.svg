<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="NTN UE 能力字段挂载结构">
  <rect width="900" height="470" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">NTN UE 能力：两个层级、三个挂载点（UE-NR-Capability 内）</text>
  <defs>
    <marker id="arC1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a4b5c"/>
    </marker>
  </defs>

  <!-- 顶层 -->
  <g>
    <rect x="330" y="52" width="240" height="48" rx="10" fill="#0f7a8a"/>
    <text x="450" y="82" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#f4fafc">UE-NR-Capability</text>
  </g>
  <line x1="450" y1="100" x2="230" y2="140" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arC1)"/>
  <line x1="450" y1="100" x2="670" y2="140" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arC1)"/>

  <!-- 左：v1700 顶层容器 -->
  <g>
    <rect x="60" y="142" width="340" height="160" rx="12" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="230" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0a5561">UE-NR-Capability-v1700</text>
    <text x="230" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">Rel-17 扩展容器（顶层）</text>
    <line x1="80" y1="196" x2="380" y2="196" stroke="#e2eef4" stroke-width="1.4"/>
    <text x="78" y="218" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">nonTerrestrialNetwork-r17</text>
    <text x="78" y="240" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">ntn-ScenarioSupport-r17</text>
    <text x="78" y="262" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">ntn-Parameters-r17</text>
    <text x="78" y="286" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a9681f">NTN 总开关 / GSO-NGSO / 差分容器入口</text>
  </g>

  <!-- 右：BandNR 每频段 -->
  <g>
    <rect x="470" y="142" width="390" height="160" rx="12" fill="#ffffff" stroke="#c9852c" stroke-width="1.6"/>
    <text x="665" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#a9681f">rf-Parameters → supportedBandListNR → BandNR</text>
    <text x="665" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">每频段上报（n255 / n256 / HAPS 频段）</text>
    <line x1="490" y1="196" x2="840" y2="196" stroke="#fdf3e3" stroke-width="1.4"/>
    <text x="488" y="218" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">uplinkPreCompensation-r17</text>
    <text x="488" y="240" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">uplink-TA-Reporting-r17</text>
    <text x="488" y="262" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">max-HARQ-ProcessNumber-r17 / typeX-HARQ-Codebook-r17</text>
    <text x="488" y="284" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">ue-specific-K-Offset-r17</text>
  </g>

  <!-- 底：NTN-Parameters 容器展开 -->
  <line x1="230" y1="302" x2="230" y2="326" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arC1)"/>
  <g>
    <rect x="60" y="328" width="780" height="120" rx="12" fill="#e2eef4"/>
    <text x="78" y="354" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0a5561">NTN-Parameters-r17（差分容器：只报与地面不同的部分，缺席则沿用地面能力）</text>
    <text x="78" y="382" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">inactiveStateNTN-r17   ra-SDT-NTN-r17   srb-SDT-NTN-r17</text>
    <text x="78" y="406" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">measAndMobParametersNTN   mac-ParametersNTN   phy-ParametersNTN</text>
    <text x="78" y="430" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">fdd-Add-UE-NR-CapabilitiesNTN   fr1-Add-UE-NR-CapabilitiesNTN   son-ParametersNTN</text>
  </g>
</svg>
