<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="NTN 能力信令在接入流程中的位置">
  <rect width="900" height="430" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">能力信令在 NTN 接入流程中的位置（时序示意）</text>
  <defs>
    <marker id="arS3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0a5561"/>
    </marker>
    <marker id="arS4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9852c"/>
    </marker>
  </defs>

  <!-- 两条生命线 -->
  <line x1="200" y1="60" x2="200" y2="400" stroke="#8a99a8" stroke-width="1.4"/>
  <line x1="700" y1="60" x2="700" y2="400" stroke="#8a99a8" stroke-width="1.4"/>
  <g>
    <rect x="140" y="48" width="120" height="34" rx="8" fill="#ffffff" stroke="#c9852c" stroke-width="1.6"/>
    <text x="200" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0b1c28">UE</text>
  </g>
  <g>
    <rect x="640" y="48" width="120" height="34" rx="8" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="700" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0b1c28">gNB（经卫星）</text>
  </g>

  <!-- 1. SIB19 -->
  <line x1="700" y1="100" x2="200" y2="100" stroke="#0a5561" stroke-width="2" marker-end="url(#arS3)"/>
  <text x="450" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a5561">SIB19：星历 / Common TA / K_offset / ta-Report</text>
  <text x="450" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">UE 同时需要有效 GNSS 位置，才能完成预补偿计算</text>

  <!-- 2. PRACH -->
  <line x1="200" y1="152" x2="700" y2="152" stroke="#c9852c" stroke-width="2" marker-end="url(#arS4)"/>
  <text x="450" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#a9681f">PRACH（Msg1）：已应用 TA / 频偏预补偿</text>

  <!-- 3. RAR -->
  <line x1="700" y1="196" x2="200" y2="196" stroke="#0a5561" stroke-width="2" marker-end="url(#arS3)"/>
  <text x="450" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a5561">RAR（Msg2）：残余 TA 修正 + 上行授权</text>

  <!-- 4. RRC Setup -->
  <line x1="200" y1="240" x2="700" y2="240" stroke="#c9852c" stroke-width="2" marker-end="url(#arS4)"/>
  <text x="450" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#a9681f">RRCSetupRequest / RRCSetup / Complete</text>
  <text x="450" y="258" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">（此时网络还不知道 UE 的 NTN 能力细节）</text>

  <!-- 5. 能力查询（重点） -->
  <rect x="330" y="286" width="240" height="70" rx="10" fill="#fdf3e3" stroke="#c9852c" stroke-width="1.8"/>
  <text x="450" y="310" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#a9681f">UECapabilityEnquiry ⇄ Information</text>
  <text x="450" y="330" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0b1c28">nonTerrestrialNetwork / ntn-Params…</text>
  <text x="450" y="348" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">NTN 能力在 RRC 连接建立之后才上报</text>
  <line x1="700" y1="300" x2="572" y2="300" stroke="#0a5561" stroke-width="2" marker-end="url(#arS3)"/>
  <line x1="330" y1="342" x2="200" y2="342" stroke="#c9852c" stroke-width="2" marker-end="url(#arS4)"/>

  <!-- 6. 配置 -->
  <line x1="700" y1="386" x2="200" y2="386" stroke="#0a5561" stroke-width="2" marker-end="url(#arS3)"/>
  <text x="450" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a5561">RRCReconfiguration：按能力下发 HARQ / tar-Config / CHO 配置</text>
</svg>
