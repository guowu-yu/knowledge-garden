<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="PTRS overview">
  <rect width="960" height="420" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">PTRS in NR (Phase Tracking Reference Signal)</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Track phase noise / common phase error during a PDSCH or PUSCH</text>

  <rect x="40" y="110" width="260" height="220" rx="14" fill="#c9852c"/>
  <text x="170" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">Problem</text>
  <text x="60" y="200" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Oscillator phase noise</text>
  <text x="60" y="230" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Worse at FR2 / high MCS</text>
  <text x="60" y="260" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Constellation rotates</text>

  <rect x="350" y="110" width="260" height="220" rx="14" fill="#0f7a8a"/>
  <text x="480" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">PTRS does</text>
  <text x="370" y="200" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Sparse RS in time/freq</text>
  <text x="370" y="230" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Estimate common phase</text>
  <text x="370" y="260" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Correct before decode</text>

  <rect x="660" y="110" width="260" height="220" rx="14" fill="#1f3a4d"/>
  <text x="790" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">Bound to</text>
  <text x="680" y="200" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">PDSCH or PUSCH</text>
  <text x="680" y="230" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">Associated DMRS port</text>
  <text x="680" y="260" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">Same schedule footprint</text>

  <text x="40" y="380" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">One-liner: DMRS opens the channel; PTRS keeps the phase locked while the TB flies.</text>
</svg>
