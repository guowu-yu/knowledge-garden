<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="PTRS config chain">
  <rect width="960" height="440" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Config chain</text>

  <rect x="40" y="90" width="200" height="90" rx="12" fill="#1f3a4d"/>
  <text x="140" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">UE Capability</text>
  <text x="140" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7f3f7">PTRS support / ports</text>

  <path d="M250 135 H300" stroke="#c9852c" stroke-width="3"/>

  <rect x="300" y="90" width="220" height="90" rx="12" fill="#0f7a8a"/>
  <text x="410" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">RRC</text>
  <text x="410" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#fff">PTRS-*-Config thresholds</text>

  <path d="M530 135 H580" stroke="#c9852c" stroke-width="3"/>

  <rect x="580" y="90" width="160" height="90" rx="12" fill="#c9852c"/>
  <text x="660" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">DCI grant</text>
  <text x="660" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#fff">MCS + N_RB</text>

  <path d="M750 135 H800" stroke="#c9852c" stroke-width="3"/>

  <rect x="800" y="90" width="120" height="90" rx="12" fill="#0a5561"/>
  <text x="860" y="135" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">L, K</text>
  <text x="860" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7f3f7">or absent</text>

  <rect x="40" y="230" width="880" height="160" rx="14" fill="#d9e8ef"/>
  <text x="60" y="270" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">Presence rule (intuition)</text>
  <text x="60" y="305" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">1) phaseTrackingRS configured under DMRS config</text>
  <text x="60" y="335" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">2) scheduled MCS and BW cross the RRC thresholds</text>
  <text x="60" y="365" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">3) map RE with associated DMRS port + RE offset; avoid colliding with DMRS RE</text>
</svg>
