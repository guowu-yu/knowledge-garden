<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="DL and UL PTRS">
  <rect width="960" height="420" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">DL PTRS vs UL PTRS</text>

  <rect x="40" y="90" width="420" height="260" rx="14" fill="#0f7a8a"/>
  <text x="250" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#fff">DL: with PDSCH</text>
  <text x="70" y="175" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">phaseTrackingRS in DMRS-DL cfg</text>
  <text x="70" y="210" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">UE receives + corrects CPE</text>
  <text x="70" y="245" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">epre-Ratio vs PDSCH EPRE</text>
  <text x="70" y="280" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Ports follow associated DMRS</text>

  <rect x="500" y="90" width="420" height="260" rx="14" fill="#c9852c"/>
  <text x="710" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#fff">UL: with PUSCH</text>
  <text x="530" y="175" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">phaseTrackingRS in DMRS-UL cfg</text>
  <text x="530" y="210" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">UE transmits; gNB tracks</text>
  <text x="530" y="245" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">CP-OFDM and DFT-s cases differ</text>
  <text x="530" y="280" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">maxNrofPorts / transformPrecoder</text>

  <text x="40" y="390" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Both are confined to the scheduled duration and bandwidth of that PDSCH/PUSCH.</text>
</svg>
