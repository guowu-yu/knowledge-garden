<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Why PTRS">
  <rect width="960" height="400" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Why phase tracking matters</text>

  <rect x="40" y="90" width="420" height="240" rx="14" fill="#1f3a4d"/>
  <text x="250" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">Without PTRS</text>
  <text x="70" y="180" font-family="Segoe UI, sans-serif" font-size="14" fill="#e7f3f7">Phase drifts across OFDM symbols</text>
  <text x="70" y="215" font-family="Segoe UI, sans-serif" font-size="14" fill="#e7f3f7">High-order QAM collapses</text>
  <text x="70" y="250" font-family="Segoe UI, sans-serif" font-size="14" fill="#e7f3f7">BLER up / MCS forced down</text>

  <rect x="500" y="90" width="420" height="240" rx="14" fill="#0f7a8a"/>
  <text x="710" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">With PTRS</text>
  <text x="530" y="180" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Track common phase error (CPE)</text>
  <text x="530" y="215" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Rotate constellation back</text>
  <text x="530" y="250" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Keep high MCS usable (esp. FR2)</text>

  <text x="40" y="370" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Phase noise is often common across subcarriers --&gt; sparse in frequency, denser in time.</text>
</svg>
