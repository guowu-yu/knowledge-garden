<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Microsoft YaHei, sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f3a4a">ITU-R 副瓣包络：S.580 / S.465 的共存底线</text>
  <line x1="60" y1="58" x2="900" y2="58" stroke="#0f7a8a" stroke-width="2"/>

  <!-- envelope plot -->
  <rect x="60" y="90" width="520" height="280" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="2"/>
  <text x="320" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f7a8a">方向图包络（相对主瓣增益，dBi）</text>
  <line x1="120" y1="330" x2="540" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="120" y1="330" x2="120" y2="140" stroke="#333" stroke-width="1.5"/>
  <text x="545" y="345" font-size="12" fill="#333">偏轴角</text>
  <text x="95" y="145" font-size="12" fill="#333">dBi</text>
  <!-- main lobe -->
  <path d="M 120 328 L 200 328 Q 240 328 268 240 Q 296 152 320 148 Q 344 152 372 240 Q 400 328 440 328" stroke="#0f7a8a" stroke-width="3" fill="none"/>
  <text x="320" y="136" text-anchor="middle" font-size="12" fill="#0f7a8a">主瓣</text>
  <!-- envelope -->
  <path d="M 120 328 L 185 328 L 205 240 L 540 240" stroke="#c96a1f" stroke-width="3" stroke-dasharray="10 5" fill="none"/>
  <text x="430" y="228" font-size="13" fill="#c96a1f" font-weight="bold">副瓣包络线（门限）</text>
  <text x="230" y="264" font-size="12" fill="#c96a1f">第一副瓣区</text>
  <text x="120" y="352" font-size="12" fill="#555">0°</text><text x="320" y="352" font-size="12" fill="#555">~48°</text><text x="520" y="352" font-size="12" fill="#555">80°</text>
  <text x="320" y="360" text-anchor="middle" font-size="12" fill="#555" transform="translate(0,10)">实际设计必须全程压在包络线之下</text>

  <!-- right table -->
  <rect x="610" y="90" width="290" height="280" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/>
  <text x="755" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a">两份建议书分工</text>
  <g font-size="13.5" fill="#333">
    <rect x="630" y="140" width="250" height="100" rx="8" fill="#e8f0dc" stroke="#4a7a3a"/>
    <text x="755" y="164" text-anchor="middle" font-weight="bold" fill="#2a5a1a">S.465（1–15 GHz）</text>
    <text x="755" y="188" text-anchor="middle">天线参考方向图 + 副瓣</text>
    <text x="755" y="208" text-anchor="middle">包络，用于地球站与</text>
    <text x="755" y="226" text-anchor="middle">陆地业务的协调分析</text>
    <rect x="630" y="255" width="250" height="100" rx="8" fill="#e8f0dc" stroke="#4a7a3a"/>
    <text x="755" y="279" text-anchor="middle" font-weight="bold" fill="#2a5a1a">S.580（更通用）</text>
    <text x="755" y="303" text-anchor="middle">29–25log₁₀(θ) 包络式</text>
    <text x="755" y="323" text-anchor="middle">广泛用于地球站指向/副瓣</text>
    <text x="755" y="341" text-anchor="middle">设计基准与频率协调</text>
  </g>

  <!-- bottom -->
  <rect x="60" y="390" width="840" height="120" rx="10" fill="#fff8ee" stroke="#c96a1f" stroke-width="2"/>
  <text x="480" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#c96a1f">对相控阵设计的直接含义</text>
  <g font-size="14" fill="#333">
    <circle cx="110" cy="448" r="5" fill="#0f7a8a"/><text x="130" y="453">副瓣不是"越低越好"的自由命题，而是有法定上限：超包络 = 干扰他方 = 协调失败</text>
    <circle cx="110" cy="476" r="5" fill="#0f7a8a"/><text x="130" y="481">扫描到大偏轴角时主瓣本身也落在包络区内——需要检查"最坏扫描角"而不是零指向角</text>
    <circle cx="110" cy="500" r="5" fill="#0f7a8a"/><text x="130" y="501">地面 5G 与卫星地球站的频段冲突（如 3.7–4.2 GHz）正是靠这些包络线做划界谈判</text>
  </g>
</svg>
