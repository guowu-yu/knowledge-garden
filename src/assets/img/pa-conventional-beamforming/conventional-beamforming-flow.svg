<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">常规波束形成：延迟-求和的工作链路</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#556">权值与数据无关，只由几何与扫描角决定 ⇒ 可以离线算好、查表兑现</text>

  <!-- array -->
  <rect x="40" y="90" width="150" height="360" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.5"/>
  <text x="115" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f7a8a">平面波入射</text>
  <g stroke="#c96a1f" stroke-width="2" opacity="0.8">
    <line x1="60" y1="150" x2="170" y2="120"/>
    <line x1="60" y1="190" x2="170" y2="160"/>
    <line x1="60" y1="230" x2="170" y2="200"/>
    <line x1="60" y1="270" x2="170" y2="240"/>
    <line x1="60" y1="310" x2="170" y2="280"/>
    <line x1="60" y1="350" x2="170" y2="320"/>
    <line x1="60" y1="390" x2="170" y2="360"/>
  </g>
  <g fill="#dceff2" stroke="#0f7a8a">
    <rect x="60" y="404" width="20" height="26" rx="3"/><rect x="88" y="404" width="20" height="26" rx="3"/>
    <rect x="116" y="404" width="20" height="26" rx="3"/><rect x="144" y="404" width="20" height="26" rx="3"/>
  </g>
  <text x="115" y="446" text-anchor="middle" font-size="10" fill="#0f7a8a">阵元 1..N</text>

  <!-- channel processing -->
  <rect x="230" y="90" width="300" height="360" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="380" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">每通道：下变频 → 滤波 → ADC</text>
  <g font-family="Consolas,monospace" font-size="10.5">
    <rect x="250" y="132" width="260" height="30" rx="5" fill="#f0f7ee" stroke="#4a7a3a"/>
    <text x="262" y="151" fill="#2f4f26">x_1[n]  →  e^{-j·2π f_c t}</text>
    <rect x="250" y="172" width="260" height="30" rx="5" fill="#f0f7ee" stroke="#4a7a3a"/>
    <text x="262" y="191" fill="#2f4f26">x_2[n]  →  e^{-j·2π f_c t}</text>
    <text x="380" y="222" text-anchor="middle" fill="#667">⋮  （共 N 路复基带 I/Q）</text>
    <rect x="250" y="240" width="260" height="30" rx="5" fill="#f0f7ee" stroke="#4a7a3a"/>
    <text x="262" y="259" fill="#2f4f26">x_N[n]  →  e^{-j·2π f_c t}</text>
  </g>
  <line x1="380" y1="285" x2="380" y2="320" stroke="#8a3a6a" stroke-width="1.6"/>
  <polygon points="380,342 374,326 386,326" fill="#8a3a6a"/>
  <rect x="250" y="342" width="260" height="88" rx="6" fill="#fbf3f7" stroke="#8a3a6a"/>
  <text x="380" y="364" text-anchor="middle" font-size="11" fill="#8a3a6a">复加权求和（DSP / FPGA 数据面）</text>
  <text x="380" y="388" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#3a2f3a">y[n] = Σ w_k · x_k[n]</text>
  <text x="380" y="412" text-anchor="middle" font-size="10" fill="#667">w_k = a_k*(θ₀)/N　（恒模，只有相位）</text>

  <!-- weight source -->
  <rect x="600" y="90" width="320" height="200" rx="10" fill="#ffffff" stroke="#c96a1f" stroke-width="1.5"/>
  <text x="760" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#c96a1f">权值来源：离线 LUT</text>
  <text x="620" y="140" font-size="10.5" fill="#333">索引 = f( 扫描角 θ₀ , 频点 f_c , 温度 T )</text>
  <g font-family="Consolas,monospace" font-size="10">
    <rect x="620" y="152" width="280" height="24" rx="4" fill="#fdf4ea" stroke="#e0c3a3"/>
    <text x="632" y="168" fill="#8a4a1f">LUT[θ][f][T] → { w_1 .. w_N }</text>
    <rect x="620" y="182" width="280" height="24" rx="4" fill="#ffffff" stroke="#e0c3a3"/>
    <text x="632" y="198" fill="#8a4a1f">相位仅取 2^B 档（4~6 bit 移相器）</text>
    <rect x="620" y="212" width="280" height="24" rx="4" fill="#fdf4ea" stroke="#e0c3a3"/>
    <text x="632" y="228" fill="#8a4a1f">幅度来自加窗（泰勒 / 切比雪夫）</text>
  </g>
  <text x="760" y="258" text-anchor="middle" font-size="10.5" fill="#667">一份 LUT 可跨帧复用，切换即"换波束"</text>
  <text x="760" y="278" text-anchor="middle" font-size="10.5" fill="#8a3a6a">代价：存储 = 角度数 × 频点 × 温度 × N × 位宽</text>

  <line x1="600" y1="230" x2="515" y2="330" stroke="#c96a1f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <polygon points="512,332 522,326 516,320" fill="#c96a1f"/>

  <rect x="600" y="320" width="320" height="150" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.5"/>
  <text x="760" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f7a8a">数据无关 vs 数据相关</text>
  <text x="618" y="370" font-size="10.5" fill="#333">· 常规波束形成：w 不依赖 x（本页主题）</text>
  <text x="618" y="392" font-size="10.5" fill="#333">· 自适应波束形成：w = f(R̂)，需实时解算</text>
  <text x="618" y="414" font-size="10.5" fill="#8a3a6a">　（MVDR / LCMV，见专题 18）</text>
  <text x="618" y="440" font-size="10.5" fill="#4a7a3a">· 常规是"基线"：自适应失效时兜底</text>
  <text x="618" y="462" font-size="10.5" fill="#667">· 抗导向误差、鲁棒、计算量近零</text>

  <text x="480" y="486" text-anchor="middle" font-size="11.5" fill="#333">常规波束形成的"计算"其实是两件事：权值解算（离线、慢）与 复乘加（在线、快）。</text>
  <text x="480" y="508" text-anchor="middle" font-size="11.5" fill="#8a3a6a">把慢的放到控制面、把快的留在数据面，是 S4 全部实现问题的起点。</text>
</svg>
