    <text x="80" y="234" font-size="12" fill="#fdeeda">38.321 MAC · 38.322 RLC · 38.323 PDCP · 38.331 RRC</text>
    <rect x="60" y="114" width="500" height="60" rx="10" fill="#0a5561"/>
    <text x="80" y="140" font-size="14" font-weight="700" fill="#f4fafc">38.300 · 总体描述（阅读起点）</text>
    <text x="80" y="162" font-size="12" fill="#bfe0ea">架构 · 协议栈 · 移动性 · §16.14 NTN</text>
    <rect x="60" y="42" width="500" height="60" rx="10" fill="#5d6b78"/>
    <text x="80" y="68" font-size="14" font-weight="700" fill="#ffffff">38.4xx · 接口</text>
