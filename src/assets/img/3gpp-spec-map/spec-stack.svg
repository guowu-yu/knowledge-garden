  <text x="24" y="60" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">从下往上：终端射频 → 物理层 → 二三层协议 → 总体架构 → 网络接口</text>
  <g font-family="Segoe UI, sans-serif">
