    <text x="80" y="284" font-size="14" font-weight="700" fill="#ffffff">38.2xx · 物理层</text>
    <text x="80" y="306" font-size="12" fill="#cfeaf0">38.211 信道与调制 · 38.212 编码 · 38.213 过程与定时 · 38.214 调度</text>
    <rect x="60" y="186" width="500" height="60" rx="10" fill="#c9852c"/>
