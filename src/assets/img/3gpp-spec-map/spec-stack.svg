      <text x="626" y="306" font-size="11.5" fill="#1f3a4d">NTN：Common TA / 自算 TA</text>
      <rect x="610" y="186" width="260" height="60" rx="10" fill="#ffffff" stroke="#c9852c" stroke-width="1.8"/>
      <text x="626" y="212" font-size="13" font-weight="700" fill="#0b1c28">38.321 HARQ（§5）</text>
      <text x="626" y="234" font-size="11.5" fill="#1f3a4d">NTN：mode A/B · 反馈开关</text>
      <rect x="610" y="114" width="260" height="60" rx="10" fill="#ffffff" stroke="#0a5561" stroke-width="1.8"/>
