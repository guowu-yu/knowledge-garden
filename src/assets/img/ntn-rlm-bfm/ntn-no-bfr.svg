<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" font-family="'Segoe UI', sans-serif">
  <rect width="860" height="580" fill="#eef5f8"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">同一个「链路坏了」：TN 与 NTN 的恢复路径对比</text>

  <!-- TN row -->
  <rect x="30" y="70" width="800" height="200" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="55" y="98" font-size="15" font-weight="bold" fill="#0f7a8a">地面 NR（FR2 窄波束）：BFR 把恢复压进 PHY/MAC，几十 ms 完成</text>
  <line x1="70" y1="175" x2="790" y2="175" stroke="#90a4ae" stroke-width="2"/>
  <circle cx="110" cy="175" r="6" fill="#c62828"/>
  <text x="110" y="199" text-anchor="middle" font-size="11.5" fill="#37474f">t0 波束被遮挡</text>
  <circle cx="260" cy="175" r="6" fill="#0f7a8a"/>
  <text x="260" y="199" text-anchor="middle" font-size="11.5" fill="#37474f">BFI_COUNTER 达限</text>
  <circle cx="430" cy="175" r="6" fill="#0f7a8a"/>
  <text x="430" y="199" text-anchor="middle" font-size="11.5" fill="#37474f">CFRA 指名候选波束</text>
  <circle cx="600" cy="175" r="6" fill="#2e7d32"/>
  <text x="600" y="199" text-anchor="middle" font-size="11.5" fill="#37474f">RAR 确认，链路恢复</text>
  <text x="700" y="175" font-size="12" fill="#2e7d32" font-weight="bold">~几十 ms</text>
  <text x="55" y="240" font-size="12.5" fill="#455a64">前提：多波束小区 + TCI 波束指示 + candidateBeamRSList——UE 手里始终握着好几个可选波束</text>

  <!-- NTN row -->
  <rect x="30" y="290" width="800" height="260" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="55" y="318" font-size="15" font-weight="bold" fill="#0f7a8a">NTN（Rel-17）：BFR 关闭，恢复走 RRC，尺度从 ms 变成 s 甚至分钟</text>
  <line x1="70" y1="420" x2="790" y2="420" stroke="#90a4ae" stroke-width="2"/>
  <circle cx="110" cy="420" r="6" fill="#c62828"/>
  <text x="110" y="444" text-anchor="middle" font-size="11.5" fill="#37474f">t0 链路劣化开始</text>
  <circle cx="285" cy="420" r="6" fill="#0f7a8a"/>
  <text x="285" y="444" text-anchor="middle" font-size="11.5" fill="#37474f">测量报告/CHO 执行</text>
  <circle cx="470" cy="420" r="6" fill="#0f7a8a"/>
  <text x="470" y="444" text-anchor="middle" font-size="11.5" fill="#37474f">切换确认（+1 RTT+）</text>
  <circle cx="640" cy="420" r="6" fill="#2e7d32"/>
  <text x="640" y="444" text-anchor="middle" font-size="11.5" fill="#37474f">新波束/新小区恢复</text>
  <text x="720" y="420" font-size="12" fill="#ef6c00" font-weight="bold">百 ms ~ s 级</text>

  <text x="55" y="478" font-size="12.5" fill="#37474f">① 主路径：几何可预测 → 提前下发 CHO（Rel-17）/ 位置时间触发切换，坏之前已经换好</text>
  <text x="55" y="502" font-size="12.5" fill="#37474f">② 次路径：突发遮蔽 → N310/T310 取大值硬扛，多数短暂遮蔽在 T310 超时前自愈，无需任何信令</text>
  <text x="55" y="526" font-size="12.5" fill="#37474f">③ 兜底：真的超时 → RLF → 重建立 / IDLE 重选（IDLE 驻留靠 SIB19 + t-Service 的重选规则）</text>
</svg>
