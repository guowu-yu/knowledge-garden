<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">方向图乘积定理与软件分工</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#556">总方向图 = 阵元方向图 × 阵列因子；代码里应把两者分开建模、分别标定</text>

  <!-- element pattern -->
  <rect x="30" y="84" width="288" height="300" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  <text x="52" y="110" font-size="14" font-weight="bold" fill="#4a7a3a">G_e(θ)：阵元方向图</text>
  <text x="52" y="132" font-size="11" fill="#667">由单元形式（贴片/偶极子/喇叭）决定</text>
  <line x1="60" y1="300" x2="290" y2="300" stroke="#8899a6" stroke-width="1.3"/>
  <line x1="175" y1="150" x2="175" y2="360" stroke="#8899a6" stroke-width="1.3"/>
  <path d="M 165 302 C 130 305, 96 330, 74 356" fill="none" stroke="#4a7a3a" stroke-width="2.4"/>
  <path d="M 185 302 C 220 305, 254 330, 276 356" fill="none" stroke="#4a7a3a" stroke-width="2.4"/>
  <path d="M 165 302 C 150 290, 130 250, 120 200" fill="none" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="5 4"/>
  <path d="M 185 302 C 200 290, 220 250, 230 200" fill="none" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="5 4"/>
  <text x="196" y="200" font-size="11" fill="#4a7a3a" font-family="Consolas,monospace">cosθ</text>
  <text x="52" y="366" font-size="11" fill="#333">工程做法：单元仿真/暗室测一次，</text>
  <text x="52" y="384" font-size="11" fill="#333">存成 (θ,φ) 插值表复用</text>

  <!-- array factor -->
  <rect x="336" y="84" width="288" height="300" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
  <text x="358" y="110" font-size="14" font-weight="bold" fill="#0f7a8a">|AF(θ)|：阵列因子</text>
  <text x="358" y="132" font-size="11" fill="#667">只由 N、d、权值 w_n 决定</text>
  <line x1="366" y1="320" x2="596" y2="320" stroke="#8899a6" stroke-width="1.3"/>
  <line x1="481" y1="150" x2="481" y2="360" stroke="#8899a6" stroke-width="1.3"/>
  <path d="M 481 158 C 462 200, 452 280, 448 320" fill="none" stroke="#0f7a8a" stroke-width="2.4"/>
  <path d="M 481 158 C 500 200, 510 280, 514 320" fill="none" stroke="#0f7a8a" stroke-width="2.4"/>
  <path d="M 420 320 C 410 292, 398 292, 388 320" fill="none" stroke="#0f7a8a" stroke-width="1.8"/>
  <path d="M 542 320 C 552 292, 564 292, 574 320" fill="none" stroke="#0f7a8a" stroke-width="1.8"/>
  <text x="358" y="344" font-size="11" fill="#333">纯解析可算：无源、无误差、</text>
  <text x="358" y="362" font-size="11" fill="#333">±90° 全域，微秒级</text>

  <!-- product -->
  <rect x="642" y="84" width="288" height="300" rx="10" fill="#ffffff" stroke="#8a3a6a" stroke-width="1.6"/>
  <text x="664" y="110" font-size="14" font-weight="bold" fill="#8a3a6a">G(θ) = G_e × |AF|</text>
  <text x="664" y="132" font-size="11" fill="#667">真实阵面的方向图</text>
  <line x1="672" y1="320" x2="902" y2="320" stroke="#8899a6" stroke-width="1.3"/>
  <line x1="787" y1="150" x2="787" y2="360" stroke="#8899a6" stroke-width="1.3"/>
  <path d="M 787 172 C 770 210, 760 285, 756 320" fill="none" stroke="#8a3a6a" stroke-width="2.6"/>
  <path d="M 787 172 C 804 210, 814 285, 818 320" fill="none" stroke="#8a3a6a" stroke-width="2.6"/>
  <path d="M 700 320 C 690 310, 680 310, 672 320" fill="none" stroke="#8a3a6a" stroke-width="1.6"/>
  <path d="M 874 320 C 884 310, 894 310, 902 320" fill="none" stroke="#8a3a6a" stroke-width="1.6"/>
  <text x="664" y="344" font-size="11" fill="#333">大角副瓣被单元方向图天然压低</text>
  <text x="664" y="362" font-size="11" fill="#333">但扫描时单元不转 ⇒ 收益变窄</text>

  <!-- flow -->
  <line x1="318" y1="234" x2="336" y2="234" stroke="#8899a6" stroke-width="1.6"/>
  <line x1="624" y1="234" x2="642" y2="234" stroke="#8899a6" stroke-width="1.6"/>
  <text x="327" y="226" text-anchor="middle" font-size="13" fill="#556">×</text>
  <text x="633" y="226" text-anchor="middle" font-size="13" fill="#556">=</text>

  <text x="480" y="424" text-anchor="middle" font-size="12" fill="#333">软件分工建议：<tspan font-weight="bold" fill="#4a7a3a">单元表</tspan>（厂商/仿真交付，低频更新） × <tspan font-weight="bold" fill="#0f7a8a">权值</tspan>（算法实时产生）</text>
  <text x="480" y="452" text-anchor="middle" font-size="11.5" fill="#667">乘积定理在"阵元全同 + 互耦可忽略 + 阵元尺寸远小于 λ"三条假设下成立；</text>
  <text x="480" y="474" text-anchor="middle" font-size="11.5" fill="#667">大阵、密集阵、宽扫描下这三条都会破——此时应直接用有源单元方向图 (AEP) 或全波仿真结果</text>
  <text x="480" y="502" text-anchor="middle" font-size="11.5" fill="#8a3a6a">实现提示：方向图函数签名建议 pad(theta_u, N, d, w=1) → AF，u 域等间隔，便于 FFT 加速</text>
</svg>
