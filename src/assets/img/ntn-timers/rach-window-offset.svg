<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="Segoe UI, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f7a8a"/>
    </marker>
  </defs>
  <rect width="840" height="480" fill="#eef5f8"/>
  <text x="420" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#164e63">随机接入的时间轴：偏移与拉长如何配合</text>
  <text x="420" y="47" text-anchor="middle" font-size="11.5" fill="#64748b">四步 RACH（GEO 场景，RTT ≈ 540 ms）：每个「等待」都被重新安排</text>

  <!-- 时间轴 -->
  <line x1="50" y1="260" x2="810" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arr4)"/>
  <g font-size="10" fill="#64748b">
    <line x1="90" y1="254" x2="90" y2="266" stroke="#334155"/><text x="90" y="282" text-anchor="middle">t₀</text>
    <line x1="330" y1="254" x2="330" y2="266" stroke="#334155"/><text x="330" y="282" text-anchor="middle">t₁ ≈ t₀ + 单向时延</text>
    <line x1="570" y1="254" x2="570" y2="266" stroke="#334155"/><text x="570" y="282" text-anchor="middle">t₂ ≈ t₀ + RTT</text>
    <line x1="790" y1="254" x2="790" y2="266" stroke="#334155"/><text x="790" y="282" text-anchor="middle">t₃</text>
  </g>

  <!-- Msg1 -->
  <rect x="62" y="220" width="56" height="40" rx="8" fill="#0f7a8a"/>
  <text x="90" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Msg1</text>
  <text x="90" y="251" text-anchor="middle" font-size="8.5" fill="#cde8ee">PRACH</text>
  <text x="90" y="206" text-anchor="middle" font-size="9.5" fill="#0f7a8a">已预补偿 TA+频偏</text>
  <text x="90" y="298" text-anchor="middle" font-size="9" fill="#64748b">RO 最后符号 + 1</text>

  <!-- 上行传播段 -->
  <rect x="90" y="252" width="240" height="8" rx="4" fill="#0f7a8a" fill-opacity="0.25"/>
  <text x="210" y="248" text-anchor="middle" font-size="9.5" fill="#475569">上行传播（预补偿后到达对齐）</text>

  <!-- gNB -->
  <rect x="318" y="215" width="60" height="46" rx="8" fill="#155e75"/>
  <text x="348" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">gNB</text>
  <text x="348" y="249" text-anchor="middle" font-size="8.5" fill="#cde8ee">检测+响应</text>

  <!-- 下行传播段 -->
  <rect x="378" y="252" width="192" height="8" rx="4" fill="#155e75" fill-opacity="0.25"/>
  <text x="474" y="248" text-anchor="middle" font-size="9.5" fill="#475569">下行传播（RAR）</text>

  <!-- RAR 窗口起点块（核心） -->
  <path d="M330 268 L360 268 L352 278 L360 288 L330 288 Z" fill="#f59e0b" fill-opacity="0.2"/>
  <rect x="400" y="86" width="380" height="116" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="590" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">★ RAR 窗口起点：NTN 的关键一笔</text>
  <text x="590" y="127" text-anchor="middle" font-size="10.5" fill="#334155">地面：RO 之后最早 CORESET 首符号即开窗</text>
  <text x="590" y="145" text-anchor="middle" font-size="10.5" fill="#334155">NTN：若 <tspan font-family="Consolas, monospace">N_TA,adj^UE</tspan> 或 <tspan font-family="Consolas, monospace">N_TA,adj^common</tspan> ≠ 0，</text>
  <text x="590" y="163" text-anchor="middle" font-size="10.5" fill="#334155">开窗再延后 <tspan font-family="Consolas, monospace" font-weight="bold" fill="#b45309">T_TA + k_mac</tspan>（ms）——先让 RAR 有机会到</text>
  <text x="590" y="182" text-anchor="middle" font-size="9.5" fill="#64748b">kmac ≈ 参考点与 gNB 间 RTT；窗口长度 ra-ResponseWindow 另配大值</text>
  <text x="590" y="196" text-anchor="middle" font-size="9.5" fill="#64748b">思想：开窗时延 ≠ 等待时长——起点推后 + 窗口拉长，二者分工</text>

  <!-- Msg2/RAR -->
  <rect x="545" y="220" width="56" height="40" rx="8" fill="#155e75"/>
  <text x="573" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Msg2</text>
  <text x="573" y="251" text-anchor="middle" font-size="8.5" fill="#cde8ee">RAR</text>
  <text x="573" y="298" text-anchor="middle" font-size="9" fill="#64748b">残差 TA ≤ 12bit</text>

  <!-- ra-ResponseWindow 区间 -->
  <path d="M600 262 L600 256 L760 256 L760 262" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <text x="680" y="252" text-anchor="middle" font-size="9.5" fill="#b45309" font-weight="bold">ra-ResponseWindow（拉长类）</text>

  <!-- Msg3 -->
  <rect x="700" y="220" width="60" height="40" rx="8" fill="#0f7a8a"/>
  <text x="730" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Msg3</text>
  <text x="730" y="251" text-anchor="middle" font-size="8.5" fill="#cde8ee">PUSCH</text>

  <!-- Msg3 公式 -->
  <rect x="600" y="316" width="216" height="102" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-opacity="0.45"/>
  <text x="708" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f7a8a">Msg3 时序（偏移类）</text>
  <text x="708" y="358" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#155e75">slot = n + k2 + Δ + 2^μ·K_offset</text>
  <text x="708" y="377" text-anchor="middle" font-size="9.5" fill="#64748b">n = 承载 RAR 的 PDSCH 时隙</text>
  <text x="708" y="393" text-anchor="middle" font-size="9.5" fill="#64748b">K_offset = cellSpecificKoffset 换算</text>
  <text x="708" y="409" text-anchor="middle" font-size="9.5" fill="#b45309">授权到 UE 手里时目标时隙仍在未来</text>

  <!-- 左下：说明块 -->
  <rect x="42" y="316" width="540" height="150" rx="10" fill="#ffffff" stroke="#64748b" stroke-dasharray="5 3" stroke-opacity="0.6"/>
  <text x="62" y="340" font-size="12" font-weight="bold" fill="#475569">每一步「等」的处理方式（三类机制对照）</text>
  <g font-size="10.5" fill="#334155">
    <text x="62" y="362">Msg1 → Msg2：偏移（开窗 + T_TA + k_mac）+ 拉长（ra-ResponseWindow 配大值）</text>
    <text x="62" y="382">Msg2 → Msg3：纯偏移（k2 + Δ + 2^μ·K_offset）——发送时刻被推过 RTT，无虚等</text>
    <text x="62" y="402">Msg3 → Msg4：拉长（ra-ContentionResolutionTimer 覆盖又一个 RTT）</text>
    <text x="62" y="422">Msg4 → 完成：HARQ-ACK = m + k1 + K_offset（见调度与 HARQ 专题）</text>
    <text x="62" y="446" font-weight="bold" fill="#b45309">口诀：发得晚（偏移）+ 等得起（拉长）——两类机制在一条时间轴上交替接力</text>
  </g>
</svg>
