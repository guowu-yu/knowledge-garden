<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="Segoe UI, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f7a8a"/>
    </marker>
  </defs>
  <rect width="840" height="480" fill="#eef5f8"/>
  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#164e63">NTN 应对长时延的三类时间机制全景</text>
  <text x="420" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">Rel-17 的选择：能推后就推后（偏移），必须等的放宽（拉长），全新语义的单独建定时器（新生）</text>

  <!-- 左列：偏移类 -->
  <rect x="26" y="68" width="250" height="368" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-opacity="0.35"/>
  <rect x="26" y="68" width="250" height="52" rx="10" fill="#0f7a8a"/>
  <text x="151" y="91" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff">① 偏移类：改变「何时」</text>
  <text x="151" y="110" text-anchor="middle" font-size="10.5" fill="#cde8ee">定时器不动，把发送时刻推过 RTT</text>
  <g font-size="10.5" fill="#334155">
    <text x="40" y="142" font-family="Consolas, monospace" font-weight="bold" fill="#0f7a8a">cellSpecificKoffset</text>
    <text x="40" y="157" fill="#64748b">UL 调度主偏移，SIB19 广播</text>
    <text x="40" y="180" font-family="Consolas, monospace" font-weight="bold" fill="#0f7a8a">kmac</text>
    <text x="40" y="195" fill="#64748b">DL 动作时序参考（RP↔gNB RTT）</text>
    <text x="40" y="218" font-family="Consolas, monospace" font-weight="bold" fill="#0f7a8a">Common TA（参考点）</text>
    <text x="40" y="233" fill="#64748b">馈电链路 RTT，三阶外推</text>
    <text x="40" y="256" font-family="Consolas, monospace" font-weight="bold" fill="#0f7a8a">RAR 窗口起点 + T_TA + k_mac</text>
    <text x="40" y="271" fill="#64748b">Msg1 之后多等一个 RTT 再开窗</text>
    <text x="40" y="294" font-family="Consolas, monospace" font-weight="bold" fill="#0f7a8a">Msg3 = n + k2 + Δ + 2^μ·K_offset</text>
    <text x="40" y="309" fill="#64748b">授权落地时目标时隙仍在未来</text>
    <text x="40" y="332" font-family="Consolas, monospace" font-weight="bold" fill="#0f7a8a">HARQ-ACK = m + k1 + K_offset</text>
    <text x="40" y="347" fill="#64748b">PUSCH = n·2^Δμ + k2 + K_offset</text>
    <text x="40" y="370" font-family="Consolas, monospace" font-weight="bold" fill="#0f7a8a">DRX HARQ-RTT 加偏移</text>
    <text x="40" y="385" fill="#64748b">按进程把睡眠窗推过 RTT</text>
    <text x="40" y="414" fill="#b45309" font-weight="bold">优点：不虚等、零功耗浪费</text>
  </g>

  <!-- 中列：拉长类 -->
  <rect x="296" y="68" width="250" height="368" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-opacity="0.5"/>
  <rect x="296" y="68" width="250" height="52" rx="10" fill="#b45309"/>
  <text x="421" y="91" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff">② 拉长类：改变「等多久」</text>
  <text x="421" y="110" text-anchor="middle" font-size="10.5" fill="#fde8c8">确实要等的，把定时器值放大</text>
  <g font-size="10.5" fill="#334155">
    <text x="310" y="142" font-family="Consolas, monospace" font-weight="bold" fill="#b45309">t-ReassemblyExt-r17</text>
    <text x="310" y="157" fill="#64748b">RLC 200 ms → 2200 ms（新枚举）</text>
    <text x="310" y="180" font-family="Consolas, monospace" font-weight="bold" fill="#b45309">ra-ResponseWindow</text>
    <text x="310" y="195" fill="#64748b">slot 计数，NTN 配大值盖 RTT</text>
    <text x="310" y="218" font-family="Consolas, monospace" font-weight="bold" fill="#b45309">ra-ContentionResolutionTimer</text>
    <text x="310" y="233" fill="#64748b">Msg4 再等一个 RTT</text>
    <text x="310" y="256" font-family="Consolas, monospace" font-weight="bold" fill="#b45309">drx-RetransmissionTimer DL/UL</text>
    <text x="310" y="271" fill="#64748b">醒着守重传的窗口放宽</text>
    <text x="310" y="294" font-family="Consolas, monospace" font-weight="bold" fill="#b45309">PDCP discardTimer / t-Reordering</text>
    <text x="310" y="309" fill="#64748b">选已有大值（o30s / s30…）</text>
    <text x="310" y="332" font-family="Consolas, monospace" font-weight="bold" fill="#b45309">T300/T301/T310/T319</text>
    <text x="310" y="347" fill="#64748b">枚举未扩，网络选最大值</text>
    <text x="310" y="370" font-family="Consolas, monospace" font-weight="bold" fill="#b45309">t-PollRetransmit / t-StatusProhibit</text>
    <text x="310" y="385" fill="#64748b">RAN2 决议：无需扩展</text>
    <text x="310" y="414" fill="#b45309" font-weight="bold">代价：虚等放大故障发现时延</text>
  </g>

  <!-- 右列：新生类 -->
  <rect x="566" y="68" width="250" height="368" rx="10" fill="#ffffff" stroke="#059669" stroke-opacity="0.45"/>
  <rect x="566" y="68" width="250" height="52" rx="10" fill="#047857"/>
  <text x="691" y="91" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff">③ 新生类：NTN 专属语义</text>
  <text x="691" y="110" text-anchor="middle" font-size="10.5" fill="#d1fae5">地面没有对应物，全新定时器</text>
  <g font-size="10.5" fill="#334155">
    <text x="580" y="142" font-family="Consolas, monospace" font-weight="bold" fill="#047857">T430（RRC_CONNECTED）</text>
    <text x="580" y="157" fill="#64748b">UL 同步有效期，锚定 epochTime</text>
    <text x="580" y="180" font-family="Consolas, monospace" font-weight="bold" fill="#047857">ntn-UlSyncValidityDuration</text>
    <text x="580" y="195" fill="#64748b">SIB19 有效期（s5…s900）</text>
    <text x="580" y="218" font-family="Consolas, monospace" font-weight="bold" fill="#047857">t-Service</text>
    <text x="580" y="233" fill="#64748b">准地球固定小区停止服务时刻</text>
    <text x="580" y="256" font-family="Consolas, monospace" font-weight="bold" fill="#047857">CondEvent T1（时间触发 CHO）</text>
    <text x="580" y="271" fill="#64748b">T1 绝对时刻 + T2 持续时长</text>
    <text x="580" y="294" font-family="Consolas, monospace" font-weight="bold" fill="#047857">ExtendedPagingCycle-r17</text>
    <text x="580" y="309" fill="#64748b">寻呼周期扩到 rf1024 = 10.24 s</text>
    <text x="580" y="332" font-family="Consolas, monospace" font-weight="bold" fill="#047857">location-based CHO</text>
    <text x="580" y="347" fill="#64748b">按距离参考点触发（50 m 步进）</text>
    <text x="580" y="370" font-family="Consolas, monospace" font-weight="bold" fill="#047857">ephe-ValidityTime</text>
    <text x="580" y="385" fill="#64748b">星历本身的有效期（s900 档）</text>
    <text x="580" y="414" fill="#047857" font-weight="bold">共性：以卫星几何为时间锚</text>
  </g>

  <!-- 底部结论 -->
  <rect x="26" y="448" width="790" height="26" rx="6" fill="#ffffff" stroke="#0f7a8a" stroke-dasharray="4 3" stroke-opacity="0.5"/>
  <text x="421" y="465" text-anchor="middle" font-size="11.5" fill="#155e75" font-weight="bold">设计哲学：偏移优先于拉长——凡是「答案还在路上」的场景都用偏移把动作推后，只有「必须收答案」的等待才花钱拉长定时器</text>
</svg>
