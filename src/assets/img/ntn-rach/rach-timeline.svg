<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="NTN 四步接入时序与计时器偏移">
  <rect width="900" height="500" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">NTN 四步接入：每一步都被一个偏移量重新定位（信道与 RNTI 与地面完全相同）</text>
  <defs>
    <marker id="arR4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a4b5c"/>
    </marker>
  </defs>

  <line x1="180" y1="70" x2="180" y2="470" stroke="#0f7a8a" stroke-width="2"/>
  <text x="180" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a5561">UE（已预补偿）</text>
  <line x1="720" y1="70" x2="720" y2="470" stroke="#0f7a8a" stroke-width="2"/>
  <text x="720" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a5561">gNB（经卫星）</text>

  <line x1="188" y1="100" x2="712" y2="130" stroke="#3a4b5c" stroke-width="1.8" marker-end="url(#arR4)"/>
  <text x="450" y="100" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">Msg1：PRACH 前导（TA/频偏已预补偿）</text>
  <text x="450" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">提前量 = Common TA + UE 专用 TA；gNB 只测到残差</text>

  <line x1="712" y1="190" x2="188" y2="220" stroke="#3a4b5c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arR4)"/>
  <text x="450" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">Msg2：RAR（PDSCH / DCI 1_0 / RA-RNTI）</text>
  <text x="450" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">TA 命令 = 残差修正；窗口起点偏移 = UE 自身 RTT</text>

  <rect x="140" y="238" width="180" height="30" rx="6" fill="#e2eef4"/>
  <text x="230" y="258" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0a5561">ra-ResponseWindow</text>
  <text x="340" y="258" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">起点 = UE RTT 之后，不再从 Msg1 结束立即起算</text>

  <line x1="188" y1="310" x2="712" y2="340" stroke="#3a4b5c" stroke-width="1.8" marker-end="url(#arR4)"/>
  <text x="450" y="310" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">Msg3：PUSCH（slot += cellSpecificKoffset）</text>
  <text x="450" y="328" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">Koffset 把上行调度推到因果可达的未来；Rel-18 可重复发送</text>

  <line x1="712" y1="396" x2="188" y2="426" stroke="#3a4b5c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arR4)"/>
  <text x="450" y="396" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">Msg4：竞争解决（TC-RNTI → C-RNTI）</text>
  <text x="450" y="414" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">HARQ-ACK 也按 Koffset 偏移；Rel-18 可重复反馈</text>

  <rect x="140" y="442" width="200" height="30" rx="6" fill="#fdf3e3"/>
  <text x="240" y="462" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#a9681f">ra-ContentionResolutionTimer</text>
  <text x="360" y="462" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">起点同样带 NTN 偏移——省电关键：不在物理上不可能收到答案的时段空守 PDCCH</text>
</svg>
