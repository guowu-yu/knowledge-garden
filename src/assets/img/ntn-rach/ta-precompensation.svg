<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Msg1 预补偿几何与残差">
  <rect width="900" height="470" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">Msg1 预补偿的几何：UE 提前量的三段构成（TS 38.300 §16.14）</text>
  <defs>
    <marker id="arR1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a4b5c"/>
    </marker>
    <marker id="arR2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9852c"/>
    </marker>
  </defs>

  <g>
    <rect x="640" y="56" width="180" height="56" rx="10" fill="#0f7a8a"/>
    <text x="730" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f4fafc">gNB（网关）</text>
    <text x="730" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#d9f0f4">馈电链路由网络补偿</text>
  </g>
  <g>
    <rect x="360" y="120" width="180" height="56" rx="10" fill="#0f7a8a"/>
    <text x="450" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f4fafc">卫星（透明载荷）</text>
    <text x="450" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#d9f0f4">星历广播其位置与速度</text>
  </g>
  <g>
    <rect x="80" y="250" width="170" height="64" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="165" y="274" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a5561">UE</text>
    <text x="165" y="294" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">GNSS 定位 + SIB19 星历</text>
  </g>

  <g>
    <circle cx="290" cy="150" r="14" fill="#c9852c"/>
    <text x="290" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#a9681f">RP</text>
    <text x="290" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">参考点（公共 TA 锚点）</text>
  </g>

  <line x1="195" y1="252" x2="282" y2="163" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arR1)"/>
  <text x="200" y="200" font-family="Consolas, monospace" font-size="11.5" fill="#0a5561">d0：UE→RP 服务链路</text>
  <text x="200" y="218" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">UE 自己算（GNSS + 星历）</text>
  <line x1="310" y1="158" x2="378" y2="150" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arR1)"/>
  <text x="312" y="136" font-family="Consolas, monospace" font-size="11.5" fill="#0a5561">d_ref：RP→gNB</text>
  <text x="312" y="176" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">网络广播为 Common TA</text>
  <line x1="540" y1="148" x2="636" y2="88" stroke="#3a4b5c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arR1)"/>
  <text x="556" y="110" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">馈电链路</text>

  <g>
    <rect x="80" y="350" width="500" height="96" rx="12" fill="#e2eef4"/>
    <text x="98" y="378" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0a5561">UE 发送 Msg1 的提前量 = Common TA + UE 专用 TA</text>
    <text x="98" y="404" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">Common TA：网络广播（SIB19 ta-Common 外推至当前时刻）</text>
    <text x="98" y="426" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">UE 专用 TA：f(GNSS 位置, 星历, 参考点) —— UE 自行计算</text>
  </g>
  <g>
    <rect x="600" y="350" width="240" height="96" rx="12" fill="#fdf3e3"/>
    <text x="720" y="378" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#a9681f">gNB 在前导里只测到</text>
    <text x="720" y="400" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#a9681f">残余 TA（residual，μs 级）</text>
    <text x="720" y="424" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">Msg2 的 12bit TA 命令 = 残差修正</text>
  </g>
</svg>
