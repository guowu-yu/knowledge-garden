<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="自举反转：地面与 NTN 随机接入范式对比">
  <rect width="900" height="430" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">自举反转（Bootstrap Inversion）：RACH 的目的被整个倒过来了</text>

  <g>
    <rect x="60" y="60" width="380" height="330" rx="12" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="250" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a5561">地面 NR：RACH 创造同步</text>
    <line x1="80" y1="104" x2="420" y2="104" stroke="#e2eef4" stroke-width="1.4"/>
    <text x="80" y="132" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">UE 发 Msg1 时：未对齐（这正是发它的意义）</text>
    <text x="80" y="158" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">网络从前导测量到：UE 的完整往返时延</text>
    <text x="80" y="184" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">限制小区尺寸：PRACH 循环前缀 CP</text>
    <text x="80" y="210" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">CP 必须覆盖小区内的往返时延扩散</text>
    <text x="80" y="240" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">→ 小区半径被 CP 限制在几十公里</text>
    <text x="80" y="270" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">前置硬件要求：无（只需射频）</text>
    <text x="80" y="300" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">UE 无法估计自身时延：无所谓，从不需要</text>
    <text x="80" y="340" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">流程：失步 → Msg1 → 网络测全量 TA → 对齐</text>
    <text x="80" y="366" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">（38.211 CP 设计：前导必须在 CP 窗口内到达）</text>
  </g>

  <g>
    <rect x="460" y="60" width="380" height="330" rx="12" fill="#fdf3e3" stroke="#c9852c" stroke-width="1.6"/>
    <text x="650" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#a9681f">NTN：先同步，才有资格 RACH</text>
    <line x1="480" y1="104" x2="820" y2="104" stroke="#ffffff" stroke-width="1.4"/>
    <text x="480" y="132" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">UE 发 Msg1 时：已按开环计算自行预对齐</text>
    <text x="480" y="158" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">网络从前导测量到：UE 估计的残差（μs 级）</text>
    <text x="480" y="184" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">限制小区尺寸：链路预算与波束设计</text>
    <text x="480" y="210" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">CP 只需吸收预补偿后的残余误差</text>
    <text x="480" y="240" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">→ 1000 km 小区可用地面小半径前导格式</text>
    <text x="480" y="270" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">前置要求：GNSS 接收机 + 有效星历 + Common TA</text>
    <text x="480" y="300" font-family="Segoe UI, sans-serif" font-size="12" fill="#0b1c28">UE 无法定位：被禁止接入该小区</text>
    <text x="480" y="340" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#a9681f">流程：GNSS+星历 → 预补偿 → Msg1 → 微调</text>
    <text x="480" y="366" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">（38.300 §16.14：接入前须持有 GNSS + 星历 + Common TA）</text>
  </g>
</svg>
