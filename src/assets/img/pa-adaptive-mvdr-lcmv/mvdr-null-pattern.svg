<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">方向图对比：常规 vs MVDR vs LCMV</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#556">同一场景：期望信号 0°，两个干扰 −40° / +35°（INR 30 dB）</text>

  <!-- axes -->
  <line x1="90" y1="440" x2="900" y2="440" stroke="#556" stroke-width="1.4"/>
  <line x1="90" y1="440" x2="90" y2="90" stroke="#556" stroke-width="1.4"/>
  <text x="880" y="462" font-size="11" fill="#556">方位角 / °</text>
  <text x="46" y="96" font-size="11" fill="#556">增益 / dB</text>
  <g font-family="Consolas,monospace" font-size="9.5" fill="#667">
    <text x="60" y="444">-60</text><text x="200" y="444">-40</text><text x="340" y="444">-20</text>
    <text x="480" y="444">0</text><text x="620" y="444">20</text><text x="760" y="444">40</text><text x="866" y="444">60</text>
    <text x="62" y="442">0</text><text x="52" y="372">-10</text><text x="52" y="302">-20</text>
    <text x="52" y="232">-30</text><text x="52" y="162">-40</text><text x="52" y="92">-50</text>
  </g>
  <g stroke="#dbe6ea" stroke-width="0.8">
    <line x1="90" y1="370" x2="900" y2="370"/><line x1="90" y1="300" x2="900" y2="300"/>
    <line x1="90" y1="230" x2="900" y2="230"/><line x1="90" y1="160" x2="900" y2="160"/>
  </g>
  <!-- angle grid for 0deg and interferers -->
  <g stroke="#c96a1f" stroke-width="1" stroke-dasharray="4 4" opacity="0.7">
    <line x1="480" y1="90" x2="480" y2="440"/>
    <line x1="340" y1="90" x2="340" y2="440"/>
    <line x1="620" y1="90" x2="620" y2="440"/>
  </g>
  <text x="480" y="82" text-anchor="middle" font-size="10" fill="#c96a1f">期望 0°</text>
  <text x="340" y="82" text-anchor="middle" font-size="10" fill="#c96a1f">干扰 −40°</text>
  <text x="620" y="82" text-anchor="middle" font-size="10" fill="#c96a1f">干扰 +35°</text>

  <!-- conventional: sinc main lobe wide, -13dB sidelobes -->
  <path d="M300,440 C380,300 440,120 480,110 C520,120 580,300 660,440" fill="none" stroke="#4a7a3a" stroke-width="2.6"/>
  <path d="M180,440 C240,400 300,430 340,440" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
  <path d="M620,440 C660,430 720,400 790,440" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
  <text x="220" y="418" font-size="10.5" fill="#4a7a3a">常规：副瓣 −13 dB，主瓣最宽</text>

  <!-- MVDR: narrow main lobe, deep nulls -->
  <path d="M400,440 C450,340 465,120 480,110 C495,120 512,340 560,440" fill="none" stroke="#0f7a8a" stroke-width="2.6"/>
  <!-- null at -40 (x=340) and +35 (x=610) -->
  <path d="M320,440 C330,432 326,430 340,430 C354,430 350,432 362,440" fill="none" stroke="#0f7a8a" stroke-width="1.8"/>
  <line x1="340" y1="352" x2="340" y2="440" stroke="#0f7a8a" stroke-width="2.4"/>
  <line x1="608" y1="344" x2="608" y2="440" stroke="#0f7a8a" stroke-width="2.4"/>
  <text x="330" y="342" font-size="10" fill="#0f7a8a">深零陷 ≈ −45 dB</text>
  <text x="596" y="334" font-size="10" fill="#0f7a8a">深零陷</text>
  <text x="700" y="150" font-size="10.5" fill="#0f7a8a">MVDR：主瓣更窄、</text>
  <text x="700" y="168" font-size="10.5" fill="#0f7a8a">副瓣更平滑、零陷自动对准干扰</text>

  <!-- LCMV: null steered + mainlobe constraint -->
  <path d="M408,440 C456,344 468,124 480,114 C492,124 508,344 556,440" fill="none" stroke="#8a3a6a" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="342" y1="336" x2="342" y2="440" stroke="#8a3a6a" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="618" y1="352" x2="618" y2="440" stroke="#8a3a6a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="636" y="240" font-size="10.5" fill="#8a3a6a">LCMV：可"指定"零陷与多点约束</text>
  <text x="636" y="258" font-size="10.5" fill="#8a3a6a">（干扰方向 + 主瓣保形 + 多约束）</text>

  <!-- data caption -->
  <rect x="60" y="484" width="840" height="44" rx="8" fill="#ffffff" stroke="#dbe6ea"/>
  <text x="80" y="502" font-size="11" fill="#333">读法：三条曲线都"看见了"干扰——区别在于 常规 完全无视，MVDR 自动挖深坑，LCMV 在约束框架下挖坑。</text>
  <text x="80" y="522" font-size="11" fill="#8a3a6a">但注意：MVDR/LCMV 的零陷是"算出来的"，一旦 R̂ 估不准或干扰移动，零陷会偏、会浅。</text>
</svg>
