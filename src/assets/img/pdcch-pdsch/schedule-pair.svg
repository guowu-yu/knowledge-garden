<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="PDCCH schedules PDSCH">
  <rect width="1000" height="520" rx="18" fill="#f3f7f9"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Scheduling pair: PDCCH -&gt; PDSCH</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Typical DL slot: control first (or in CORESET), then shared data</text>

  <!-- slot grid -->
  <rect x="80" y="120" width="840" height="200" rx="8" fill="#fff" stroke="#d0dde3"/>
  <text x="100" y="150" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">one DL slot (intuition)</text>

  <rect x="120" y="170" width="160" height="110" rx="8" fill="#0f7a8a"/>
  <text x="200" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">PDCCH</text>
  <text x="200" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7f3f7">in CORESET</text>

  <rect x="320" y="170" width="520" height="110" rx="8" fill="#c9852c"/>
  <text x="580" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">PDSCH (+ DMRS)</text>
  <text x="580" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#fff">time-freq RBs from DCI TDRA/FDRA</text>

  <rect x="80" y="360" width="840" height="120" rx="12" fill="#1f3a4d"/>
  <text x="100" y="400" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">DCI on PDCCH answers</text>
  <text x="100" y="435" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">WHO (RNTI)  WHERE (FDRA/TDRA)  HOW (MCS/RV/NDI/HARQ/ports)  HOW TO ACK (PUCCH resource)</text>
</svg>
