<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="PDCCH resource composition">
  <rect width="960" height="520" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">PDCCH resource stack</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">CORESET -&gt; REG -&gt; CCE -&gt; aggregation -&gt; candidate</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="80" y="110" width="800" height="60" rx="10" fill="#0a5561"/>
    <text x="480" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">CORESET (RB set x 1..3 symbols)</text>

    <rect x="120" y="200" width="720" height="50" rx="8" fill="#0f7a8a"/>
    <text x="480" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">REGs (1 RB x 1 symbol each)</text>

    <rect x="160" y="280" width="640" height="50" rx="8" fill="#1a8f9e"/>
    <text x="480" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">CCE = 6 REGs</text>

    <rect x="200" y="360" width="560" height="50" rx="8" fill="#c9852c"/>
    <text x="480" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PDCCH candidate = L CCEs (L=1/2/4/8/16)</text>
  </g>

  <text x="40" y="460" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Also: PDCCH DMRS for channel estimation; Search Space decides when to monitor which candidates.</text>
  <text x="40" y="490" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Payload after successful decode = DCI (see DCI/UCI topic).</text>
</svg>
