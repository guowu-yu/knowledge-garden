<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="'Segoe UI', sans-serif">
  <rect width="860" height="540" fill="#eef5f8"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">准地球固定 vs 移动波束：两套小区生命周期</text>

  <!-- quasi-earth-fixed -->
  <rect x="30" y="70" width="390" height="250" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="225" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f7a8a">准地球固定小区（Quasi-Earth-Fixed）</text>
  <path d="M60 290 Q225 210 390 290" stroke="#b0bec5" stroke-width="3" fill="#f7fbfc"/>
  <!-- fixed cells on ground -->
  <ellipse cx="140" cy="262" rx="42" ry="16" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="140" y="267" text-anchor="middle" font-size="11" fill="#2e7d32">Cell A</text>
  <ellipse cx="235" cy="252" rx="42" ry="16" fill="none" stroke="#0f7a8a" stroke-width="2"/>
  <text x="235" y="257" text-anchor="middle" font-size="11" fill="#0f7a8a">Cell B</text>
  <ellipse cx="330" cy="262" rx="42" ry="16" fill="none" stroke="#ef6c00" stroke-width="2"/>
  <text x="330" y="267" text-anchor="middle" font-size="11" fill="#ef6c00">Cell C</text>
  <circle cx="235" cy="248" r="6" fill="#0f7a8a"/>
  <!-- moving satellites above -->
  <g transform="translate(120,120)">
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#0f7a8a"/>
    <rect x="-32" y="-3" width="17" height="6" fill="#4dd0e1"/>
    <rect x="15" y="-3" width="17" height="6" fill="#4dd0e1"/>
  </g>
  <g transform="translate(225,105)">
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#0f7a8a"/>
    <rect x="-32" y="-3" width="17" height="6" fill="#4dd0e1"/>
    <rect x="15" y="-3" width="17" height="6" fill="#4dd0e1"/>
  </g>
  <g transform="translate(330,120)">
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#0f7a8a"/>
    <rect x="-32" y="-3" width="17" height="6" fill="#4dd0e1"/>
    <rect x="15" y="-3" width="17" height="6" fill="#4dd0e1"/>
  </g>
  <path d="M132 130 L148 252" stroke="#0f7a8a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M218 118 L232 242" stroke="#0f7a8a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M322 130 L336 252" stroke="#ef6c00" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="225" y="356" text-anchor="middle" font-size="13" fill="#455a64">小区锚在地面不动，卫星轮流「值班」</text>
  <text x="225" y="376" text-anchor="middle" font-size="13" fill="#455a64">→ 换星 = 服务链路切换，PCI 可不变</text>

  <!-- earth-moving -->
  <rect x="440" y="70" width="390" height="250" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="635" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f7a8a">移动波束小区（Earth-Moving）</text>
  <path d="M470 290 Q635 210 800 290" stroke="#b0bec5" stroke-width="3" fill="#f7fbfc"/>
  <!-- sweeping beams -->
  <g transform="translate(560,120)">
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#0f7a8a"/>
    <rect x="-32" y="-3" width="17" height="6" fill="#4dd0e1"/>
    <rect x="15" y="-3" width="17" height="6" fill="#4dd0e1"/>
  </g>
  <path d="M552 130 L540 262" stroke="#0f7a8a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M568 130 L600 258" stroke="#0f7a8a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <ellipse cx="575" cy="258" rx="52" ry="18" fill="none" stroke="#0f7a8a" stroke-width="2"/>
  <!-- arrow of motion -->
  <path d="M500 200 Q635 150 770 200" stroke="#ef6c00" stroke-width="2" fill="none" marker-end="url(#arr1)"/>
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ef6c00"/>
    </marker>
  </defs>
  <text x="635" y="146" text-anchor="middle" font-size="12" fill="#ef6c00">波束随卫星连续移动</text>
  <circle cx="700" cy="250" r="6" fill="#0f7a8a"/>
  <text x="700" y="272" text-anchor="middle" font-size="11" fill="#37474f">UE</text>
  <text x="635" y="356" text-anchor="middle" font-size="13" fill="#455a64">小区本身在动：referenceLocation 不够用</text>
  <text x="635" y="376" text-anchor="middle" font-size="13" fill="#455a64">→ 需 movingReferenceLocation + epochTime（D2）</text>

  <!-- bottom table -->
  <rect x="30" y="345" width="800" height="160" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="430" y="373" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f7a8a">对移动性的影响</text>
  <line x1="60" y1="390" x2="800" y2="390" stroke="#c9dde3"/>
  <text x="90" y="412" font-size="13" fill="#37474f" font-weight="bold">机制</text>
  <text x="330" y="412" font-size="13" fill="#37474f" font-weight="bold">准地球固定</text>
  <text x="610" y="412" font-size="13" fill="#37474f" font-weight="bold">移动波束</text>
  <line x1="60" y1="424" x2="800" y2="424" stroke="#e3edf1"/>
  <text x="90" y="446" font-size="12.5" fill="#455a64">IDLE 测量启动（38.304）</text>
  <text x="330" y="446" font-size="12.5" font-family="Consolas, monospace" fill="#0f7a8a">referenceLocation + distanceThresh</text>
  <text x="610" y="446" font-size="12.5" font-family="Consolas, monospace" fill="#0f7a8a">movingReferenceLocation-r18</text>
  <text x="90" y="470" font-size="12.5" fill="#455a64">连接态事件</text>
  <text x="330" y="470" font-size="12.5" font-family="Consolas, monospace" fill="#0f7a8a">Event D1</text>
  <text x="610" y="470" font-size="12.5" font-family="Consolas, monospace" fill="#0f7a8a">Event D2</text>
  <text x="90" y="494" font-size="12.5" fill="#455a64">t-Service 语义</text>
  <text x="330" y="494" font-size="12.5" fill="#455a64">服务链路切换（换星值班）</text>
  <text x="610" y="494" font-size="12.5" fill="#455a64">仅馈电链路切换</text>
</svg>
