<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'Segoe UI', sans-serif">
  <rect width="860" height="560" fill="#eef5f8"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">条件切换 CHO：把切换命令提前下发</text>

  <!-- timeline -->
  <line x1="60" y1="120" x2="800" y2="120" stroke="#90a4ae" stroke-width="2"/>
  <!-- t0 -->
  <circle cx="140" cy="120" r="6" fill="#0f7a8a"/>
  <text x="140" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f7a8a">T0</text>
  <rect x="70" y="150" width="150" height="92" rx="8" fill="#ffffff" stroke="#0f7a8a"/>
  <text x="145" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f7a8a">网络下发 RRC 重配置</text>
  <text x="145" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#37474f">condRRCReconfig</text>
  <text x="145" y="210" text-anchor="middle" font-size="11" fill="#455a64">含 ≤8 个候选目标</text>
  <text x="145" y="227" text-anchor="middle" font-size="11" fill="#455a64">+ 执行条件（先存储）</text>

  <!-- t1 -->
  <circle cx="430" cy="120" r="6" fill="#0f7a8a"/>
  <text x="430" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f7a8a">T1</text>
  <rect x="340" y="150" width="190" height="110" rx="8" fill="#ffffff" stroke="#0f7a8a"/>
  <text x="435" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f7a8a">UE 本地评估条件</text>
  <text x="435" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#37474f">CondEvent D1 / D2 / T1</text>
  <text x="435" y="210" text-anchor="middle" font-size="11" fill="#455a64">（或经典 A3/A5 RSRP）</text>
  <text x="435" y="232" text-anchor="middle" font-size="11" fill="#455a64">不满足 → 继续用旧小区</text>
  <text x="435" y="250" text-anchor="middle" font-size="11" fill="#455a64">全程零上行信令</text>

  <!-- t2 -->
  <circle cx="700" cy="120" r="6" fill="#2e7d32"/>
  <text x="700" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">T2</text>
  <rect x="610" y="150" width="170" height="92" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="695" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e7d32">条件满足即执行</text>
  <text x="695" y="192" text-anchor="middle" font-size="11" fill="#455a64">接入目标小区</text>
  <text x="695" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#37474f">随机接入 → RA 成功</text>
  <text x="695" y="228" text-anchor="middle" font-size="11" fill="#455a64">中断时间显著缩短</text>

  <!-- key point -->
  <rect x="60" y="290" width="800" height="110" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="460" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f7a8a">为什么 NTN 特别需要 CHO</text>
  <text x="460" y="344" text-anchor="middle" font-size="13" fill="#455a64">传统切换要「测量报告 → 切换命令」一来一回；LEO 链路 RTT 数十 ms，且</text>
  <text x="460" y="366" text-anchor="middle" font-size="13" fill="#455a64">服务小区的消失时间由星历决定——提前下发命令 + UE 自行判断执行，</text>
  <text x="460" y="388" text-anchor="middle" font-size="13" fill="#455a64">把不可靠的「临场信令」换成可靠的「预先部署」。</text>

  <!-- execution time -->
  <rect x="60" y="420" width="800" height="100" rx="10" fill="#f2fafb" stroke="#9fd3db"/>
  <text x="430" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f7a8a">Rel-18 新增：时间触发的执行条件</text>
  <text x="430" y="472" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#37474f">CondEvent T1: t1-Threshold &lt; Mt &lt; t1-Threshold + duration</text>
  <text x="430" y="496" text-anchor="middle" font-size="12" fill="#607d8b">配合 SIB19 的 t-Service：网络直接说「在 t-Service 前的这扇窗里完成切换」· 38.331 condExecutionTime</text>

  <text x="430" y="545" text-anchor="middle" font-size="1" fill="none">.</text>
</svg>
