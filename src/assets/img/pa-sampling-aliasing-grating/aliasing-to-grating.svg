<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="560" fill="#eef5f8"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">栅瓣 = 空间混叠：从采样定理到 d ≤ λ/2</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#556">阵元间距 d 就是空间采样间隔；空间频率上界 1/λ；奈奎斯特给出 d ≤ λ/2</text>

  <!-- Step 1: spatial frequency -->
  <rect x="30" y="82" width="900" height="108" rx="9" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
  <circle cx="72" cy="118" r="17" fill="#0f7a8a"/>
  <text x="72" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <text x="104" y="114" font-size="13" font-weight="bold" fill="#0f7a8a">平面波沿阵列轴的"空间频率"</text>

  <line x1="120" y1="164" x2="420" y2="164" stroke="#8899a6" stroke-width="1.6"/>
  <g fill="#0f7a8a">
    <rect x="140" y="154" width="9" height="12" rx="2"/>
    <rect x="196" y="154" width="9" height="12" rx="2"/>
    <rect x="252" y="154" width="9" height="12" rx="2"/>
    <rect x="308" y="154" width="9" height="12" rx="2"/>
    <rect x="364" y="154" width="9" height="12" rx="2"/>
  </g>
  <text x="160" y="188" font-size="10.5" fill="#556">间距 d（空间采样间隔）</text>

  <line x1="350" y1="130" x2="470" y2="106" stroke="#c96a1f" stroke-width="2"/>
  <text x="432" y="98" font-size="11" fill="#c96a1f">波前</text>

  <text x="500" y="118" font-size="12" fill="#333" font-family="Consolas,monospace">投影波长 λ_u = λ / sinθ  →  f_u = sinθ / λ</text>
  <text x="500" y="142" font-size="12" fill="#333" font-family="Consolas,monospace">空间采样率 = 1 / d</text>
  <text x="500" y="166" font-size="12" fill="#8a3a6a" font-weight="bold" font-family="Consolas,monospace">|sinθ| ≤ 1 ⇒ |f_u| ≤ 1/λ（空间频率上界）</text>

  <!-- Step 2: Nyquist -->
  <rect x="30" y="202" width="900" height="100" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
  <circle cx="72" cy="238" r="17" fill="#4a7a3a"/>
  <text x="72" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <text x="104" y="234" font-size="13" font-weight="bold" fill="#4a7a3a">套用奈奎斯特–香农采样定理</text>

  <text x="104" y="262" font-size="13" fill="#333" font-family="Consolas,monospace">采样率 1/d  ≥  2 × 最高空间频率 1/λ</text>
  <rect x="640" y="222" width="270" height="52" rx="7" fill="#edf4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  <text x="775" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a3a" font-family="Consolas,monospace">d ≤ λ/2</text>
  <text x="104" y="286" font-size="11" fill="#556">这就是"半波长准则"的真正来源：它不是经验规则，是采样定理的直接推论。</text>

  <!-- Step 3: periodicity -->
  <rect x="30" y="314" width="900" height="180" rx="9" fill="#ffffff" stroke="#c96a1f" stroke-width="1.8"/>
  <circle cx="72" cy="350" r="17" fill="#c96a1f"/>
  <text x="72" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
  <text x="104" y="346" font-size="13" font-weight="bold" fill="#c96a1f">方向图在 u 轴上的周期性：周期 = λ/d</text>

  <!-- u axis with periods -->
  <line x1="100" y1="450" x2="880" y2="450" stroke="#8899a6" stroke-width="1.4"/>
  <text x="884" y="454" font-size="11" fill="#556">u</text>

  <!-- visible space band -->
  <rect x="390" y="420" width="260" height="60" rx="5" fill="#0f7a8a" opacity="0.10"/>
  <line x1="390" y1="450" x2="390" y2="414" stroke="#0f7a8a" stroke-width="1.6"/>
  <line x1="650" y1="450" x2="650" y2="414" stroke="#0f7a8a" stroke-width="1.6"/>
  <text x="520" y="410" text-anchor="middle" font-size="11" fill="#0f7a8a" font-weight="bold">可见空间 |u| ≤ 1</text>

  <!-- pattern replicas -->
  <path d="M 120 450 C 150 450, 158 440, 172 434 C 190 427, 205 400, 218 372 C 228 356, 234 352, 240 352 C 246 352, 252 356, 262 372 C 275 400, 290 427, 308 434 C 322 440, 330 450, 360 450"
        fill="none" stroke="#c96a1f" stroke-width="2"/>
  <text x="240" y="344" text-anchor="middle" font-size="10" fill="#8a3a6a">副本 -1</text>

  <path d="M 390 450 C 410 450, 418 440, 430 434 C 448 427, 462 400, 474 372 C 484 356, 490 352, 496 352 C 502 352, 508 356, 518 372 C 531 400, 546 427, 564 434 C 578 440, 588 450, 620 450"
        fill="none" stroke="#0f7a8a" stroke-width="2.6"/>
  <text x="496" y="344" text-anchor="middle" font-size="10.5" fill="#0f7a8a" font-weight="bold">主瓣</text>

  <path d="M 650 450 C 672 450, 680 440, 692 434 C 710 427, 724 400, 736 372 C 746 356, 752 352, 758 352 C 764 352, 770 356, 780 372 C 793 400, 808 427, 826 434 C 840 440, 850 450, 880 450"
        fill="none" stroke="#c96a1f" stroke-width="2"/>
  <text x="758" y="344" text-anchor="middle" font-size="10" fill="#8a3a6a">副本 +1（栅瓣）</text>

  <!-- period arrow -->
  <line x1="240" y1="478" x2="496" y2="478" stroke="#4a7a3a" stroke-width="1.6"/>
  <line x1="240" y1="472" x2="240" y2="484" stroke="#4a7a3a" stroke-width="1.6"/>
  <line x1="496" y1="472" x2="496" y2="484" stroke="#4a7a3a" stroke-width="1.6"/>
  <text x="368" y="496" text-anchor="middle" font-size="11" fill="#4a7a3a">周期 λ/d（d &gt; λ/2 时 &lt; 2 ⇒ 副本落入可见空间）</text>

  <text x="104" y="378" font-size="11.5" fill="#333">d = 0.7λ 时，周期 = 1.43 &lt; 2，可见空间内出现两个完整主瓣 ⇒ 栅瓣；角位置 sinθ_gl = sinθ₀ ± λ/d</text>

  <!-- conclusion -->
  <rect x="30" y="506" width="900" height="42" rx="8" fill="#faf0e6" stroke="#c96a1f" stroke-width="1.4"/>
  <text x="480" y="533" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c96a1f">核心结论：栅瓣不是"副瓣变高"，而是主瓣的平移副本 —— 它与主瓣同高，幅度加权无法消除</text>
</svg>
