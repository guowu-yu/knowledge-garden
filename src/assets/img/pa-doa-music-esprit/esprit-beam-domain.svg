<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">ESPRIT 与波束域 MUSIC：大阵的两条工程路</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#556">一条用"旋转不变性"换掉角度搜索；一条用"降维"换掉 O(N³)</text>

  <!-- ESPRIT -->
  <rect x="30" y="80" width="440" height="320" rx="10" fill="#ffffff" stroke="#c96a1f" stroke-width="1.5"/>
  <text x="250" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#c96a1f">ESPRIT：旋转不变性</text>
  <!-- two subarrays -->
  <g fill="#dceff2" stroke="#0f7a8a">
    <circle cx="70" cy="180" r="7"/><circle cx="110" cy="180" r="7"/><circle cx="150" cy="180" r="7"/>
    <circle cx="190" cy="180" r="7"/><circle cx="230" cy="180" r="7"/>
  </g>
  <rect x="56" y="150" width="190" height="60" rx="8" fill="none" stroke="#c96a1f" stroke-width="1.4"/>
  <text x="150" y="146" text-anchor="middle" font-size="10" fill="#c96a1f">子阵 1（阵元 1..N−1）</text>
  <g fill="#f0f7ee" stroke="#4a7a3a">
    <circle cx="110" cy="256" r="7"/><circle cx="150" cy="256" r="7"/><circle cx="190" cy="256" r="7"/>
    <circle cx="230" cy="256" r="7"/><circle cx="270" cy="256" r="7"/>
  </g>
  <rect x="96" y="226" width="190" height="60" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.4"/>
  <text x="250" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">子阵 2（阵元 2..N）</text>
  <g stroke="#8a3a6a" stroke-width="1.1" stroke-dasharray="3 3">
    <line x1="70" y1="187" x2="110" y2="249"/><line x1="110" y1="187" x2="150" y2="249"/>
    <line x1="150" y1="187" x2="190" y2="249"/><line x1="230" y1="187" x2="270" y2="249"/>
  </g>
  <text x="250" y="308" text-anchor="middle" font-size="10.5" fill="#333">两个子阵只差"一个阵元位移 ⇒ 一个固定相位旋转 Φ"</text>
  <text x="250" y="330" text-anchor="middle" font-family="Consolas,monospace" font-size="11.5" fill="#8a3a6a">U_{s2} = U_{s1} · Φ　⇒　Φ 的特征值 = e^{jψ_k}</text>
  <text x="250" y="352" text-anchor="middle" font-size="10.5" fill="#0f7a8a">ψ_k = 2π d sinθ_k / λ ⇒ θ_k = asin( ∠Φ_k · λ / 2πd )</text>
  <text x="250" y="378" text-anchor="middle" font-size="10.5" fill="#333">无需角度扫描，闭式解 ⇒ 计算量 O(N²D) 低于 MUSIC 谱搜索</text>

  <!-- beam domain MUSIC -->
  <rect x="500" y="80" width="430" height="320" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.5"/>
  <text x="715" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f7a8a">波束域 MUSIC：大阵的降维解</text>
  <g font-family="Consolas,monospace" font-size="10.5">
    <rect x="520" y="124" width="180" height="46" rx="6" fill="#f7fbfc" stroke="#0f7a8a"/>
    <text x="610" y="144" text-anchor="middle" fill="#0f7a8a">N 元全阵数据</text>
    <text x="610" y="162" text-anchor="middle" fill="#667">x ∈ C^N</text>
    <rect x="720" y="124" width="180" height="46" rx="6" fill="#f0f7ee" stroke="#4a7a3a"/>
    <text x="810" y="144" text-anchor="middle" fill="#4a7a3a">固定波束变换 B</text>
    <text x="810" y="162" text-anchor="middle" fill="#667">Bᴴ x ∈ C^B, B≪N</text>
    <rect x="520" y="186" width="380" height="46" rx="6" fill="#fbf3f7" stroke="#8a3a6a"/>
    <text x="710" y="206" text-anchor="middle" fill="#8a3a6a">在 B 维上做 MUSIC：R_b = BᴴR̂B, 特征分解 O(B³)</text>
    <text x="710" y="224" text-anchor="middle" fill="#667">可分辨源数 ≤ B−1（自由度降了，能力也降了）</text>
  </g>
  <text x="715" y="256" text-anchor="middle" font-size="10.5" fill="#333">为什么能降维？</text>
  <text x="536" y="278" font-size="10.5" fill="#333">· 感兴趣的角度区间有限（覆盖扇区 ≪ 全空间）</text>
  <text x="536" y="300" font-size="10.5" fill="#333">· 用 B 个"覆盖该扇区的正交波束"捕获全部能量</text>
  <text x="536" y="322" font-size="10.5" fill="#8a3a6a">· 若 B 个波束恰好张成信号子空间 ⇒ 性能几乎无损</text>
  <text x="536" y="344" font-size="10.5" fill="#4a7a3a">· 实测：波束域 MUSIC 在等价性能下复杂度降 ~N/B 倍</text>
  <text x="715" y="374" text-anchor="middle" font-size="10.5" fill="#667">这也是"混合架构（只有 N_RF 个数字通道）"下做 DOA 的天然路径。</text>

  <!-- comparison -->
  <rect x="30" y="416" width="900" height="96" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="480" y="440" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">选型速查</text>
  <text x="60" y="466" font-size="11.5" fill="#333">MUSIC：适合需要"全空间谱 + 精确峰位"的场合；代价 O(N³) 特征分解 + 逐角度扫描。</text>
  <text x="60" y="488" font-size="11.5" fill="#333">ESPRIT/Root-MUSIC：ULA/均匀阵 + 需要低复杂度闭式解；代价是"必须知道源数、且需要阵型规则"。</text>
  <text x="60" y="508" font-size="11.5" fill="#8a3a6a">波束域 MUSIC：大阵（N 大）/ 混合架构的唯一现实路径；代价是可分辨源数随降维而降。</text>
</svg>
