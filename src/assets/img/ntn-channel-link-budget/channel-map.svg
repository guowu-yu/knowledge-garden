<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="'Segoe UI', sans-serif">
  <rect width="860" height="620" fill="#eef5f8"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">38.811 大尺度模型：一条链路，五笔损耗</text>

  <!-- formula banner -->
  <rect x="60" y="66" width="740" height="56" rx="10" fill="#ffffff" stroke="#0f7a8a"/>
  <text x="430" y="94" text-anchor="middle" font-size="16" font-family="Consolas" fill="#0f7a8a">PL = PL_b + PL_g + PL_s (+ PL_e)</text>
  <text x="430" y="112" text-anchor="middle" font-size="11.5" fill="#455a64">基本路损（FSPL+遮蔽+阴影） ＋ 大气气体 ＋ 闪烁（＋建筑入射 O2I）</text>

  <!-- component 1: FSPL -->
  <rect x="60" y="140" width="360" height="130" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="85" y="168" font-size="15" font-weight="bold" fill="#0f7a8a">FSPL（绝对主角）</text>
  <text x="85" y="192" font-size="12.5" font-family="Consolas" fill="#37474f">92.45 + 20lg(d_km) + 20lg(f_GHz)</text>
  <text x="85" y="216" font-size="12" fill="#37474f">LEO-600 天顶：≈155 dB</text>
  <text x="85" y="238" font-size="12" fill="#37474f">LEO-1200 天顶：≈161 dB</text>
  <text x="85" y="260" font-size="11.5" fill="#455a64">斜距由轨道高度与仰角决定（38.811 §6.6.2）</text>

  <!-- component 2: clutter -->
  <rect x="440" y="140" width="360" height="130" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="465" y="168" font-size="15" font-weight="bold" fill="#0f7a8a">杂波损耗 CL(α, f_c)</text>
  <text x="465" y="192" font-size="12" fill="#37474f">地面建筑/树木对信号的遮挡</text>
  <text x="465" y="214" font-size="12" fill="#37474f">取决于仰角 α、频率、环境（4 类）</text>
  <text x="465" y="236" font-size="12.5" font-weight="bold" fill="#c62828">LoS 条件下置 0 dB</text>
  <text x="465" y="258" font-size="11.5" fill="#455a64">低仰角 + 密集城区时可达十几 dB</text>

  <!-- component 3: shadow -->
  <rect x="60" y="290" width="360" height="120" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="85" y="318" font-size="15" font-weight="bold" fill="#0f7a8a">阴影衰落 SF</text>
  <text x="85" y="342" font-size="12" font-family="Consolas" fill="#37474f">SF ~ N(0, σ_SF²)（对数正态）</text>
  <text x="85" y="364" font-size="12" fill="#37474f">标准差按环境/仰角/LoS 查表</text>
  <text x="85" y="386" font-size="11.5" fill="#455a64">NTN 的空间相关距离远大于地面（大覆盖）</text>

  <!-- component 4+5 -->
  <rect x="440" y="290" width="360" height="120" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="465" y="318" font-size="15" font-weight="bold" fill="#0f7a8a">大气气体 ＋ 闪烁</text>
  <text x="465" y="342" font-size="12" fill="#37474f">大气吸收：&lt;10 GHz 基本忽略（低仰角除外）</text>
  <text x="465" y="364" font-size="12" fill="#37474f">电离层闪烁：L/S 频段低仰角/低纬度，1% 最差 ~2.2 dB</text>
  <text x="465" y="386" font-size="12" fill="#37474f">对流层闪烁：Ka 频段 ~1 dB 量级</text>

  <!-- bottom: design consequence -->
  <rect x="60" y="430" width="740" height="160" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="85" y="458" font-size="15" font-weight="bold" fill="#0f7a8a">与地面模型的三个结构差异</text>
  <text x="85" y="484" font-size="12.5" fill="#37474f">① 卫星距离远 → 各径近乎平行、角度扩展趋近 0，大尺度参数（LoS 概率/时延扩展等）改为依赖仰角而非距离；</text>
  <text x="85" y="508" font-size="12.5" fill="#37474f">② 雨衰/云衰 6 GHz 以下忽略——S 频段账本里没有雨，Ka 频段雨衰是最大单项（见余量分配图）；</text>
  <text x="85" y="532" font-size="12.5" fill="#37474f">③ L/S 频段法拉第旋转使线极化失效 → 系统采用圆极化（极化失配 ~3 dB）。</text>
  <text x="85" y="566" font-size="11.5" fill="#78909c">规范锚点：TR 38.811 §6.6（大尺度）、§6.7（快衰落）、§6.9（CDL/TDL）、§6.8.2（法拉第旋转）</text>
</svg>
