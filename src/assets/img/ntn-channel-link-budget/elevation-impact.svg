<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="'Segoe UI', sans-serif">
  <rect width="860" height="600" fill="#eef5f8"/>
  <text x="430" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">仰角 α：贯穿信道模型一切的变量</text>

  <!-- geometry -->
  <rect x="60" y="70" width="740" height="180" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="85" y="98" font-size="15" font-weight="bold" fill="#0f7a8a">几何：仰角决定斜距</text>
  <circle cx="160" cy="215" r="55" fill="none" stroke="#90a4ae" stroke-width="2"/>
  <circle cx="215" cy="215" r="5" fill="#0f7a8a"/>
  <text x="215" y="238" text-anchor="middle" font-size="11" fill="#37474f">UE</text>
  <line x1="215" y1="215" x2="430" y2="110" stroke="#0f7a8a" stroke-width="2"/>
  <circle cx="440" cy="106" r="6" fill="#c62828"/>
  <text x="440" y="94" text-anchor="middle" font-size="11" fill="#c62828">卫星</text>
  <path d="M 245 215 A 30 30 0 0 0 238 196" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="268" y="200" font-size="11.5" fill="#2e7d32">仰角 α</text>
  <text x="470" y="130" font-size="12.5" font-family="Consolas" fill="#37474f">d = √((R_E+h)² − R_E²cos²α) − R_E·sinα</text>
  <text x="470" y="156" font-size="12" fill="#37474f">α=90°：d = h（600 km）→ FSPL ≈ 155 dB</text>
  <text x="470" y="178" font-size="12" fill="#37474f">α=30°：d ≈ 829 km（38.821 目标仰角）</text>
  <text x="470" y="200" font-size="12" fill="#37474f">α=10°：d ≈ 1310 km → FSPL 多 ~7 dB</text>
  <text x="470" y="228" font-size="11.5" fill="#78909c">一次过境：仰角抛物线 → 路损/多普勒/时延全部沿它摆动</text>

  <!-- effects table -->
  <rect x="60" y="270" width="740" height="180" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="85" y="298" font-size="15" font-weight="bold" fill="#0f7a8a">仰角还改写哪些项</text>
  <text x="85" y="326" font-size="12.5" fill="#37474f">① 斜距 → FSPL：低仰角多付 5~7 dB（600 km 轨道 90°→10°）</text>
  <text x="85" y="350" font-size="12.5" fill="#37474f">② LoS 概率：环境 + 仰角查表（38.811 §6.6.1），低仰角 LoS 概率显著下降</text>
  <text x="85" y="374" font-size="12.5" fill="#37474f">③ 杂波损耗 CL：低仰角时信号贴地穿过更多遮挡物，CL 随 α 降低而增大</text>
  <text x="85" y="398" font-size="12.5" fill="#37474f">④ 大气/闪烁：低仰角穿过更厚的大气与电离层，吸收与闪烁加重</text>
  <text x="85" y="422" font-size="12.5" fill="#37474f">⑤ 小尺度模型：CDL/TDL 的时延扩展、K 因子等大尺度参数按仰角档位取值</text>

  <!-- design implication -->
  <rect x="60" y="470" width="740" height="100" rx="10" fill="#ffffff" stroke="#c9dde3"/>
  <text x="85" y="498" font-size="15" font-weight="bold" fill="#0f7a8a">系统设计的直接推论</text>
  <text x="85" y="524" font-size="12.5" fill="#37474f">星座设计中「目标仰角」是链路预算的第一参数：38.821 取 LEO 30°、GEO 12.5°/20°——仰角门限越高，</text>
  <text x="85" y="548" font-size="12.5" fill="#37474f">单星有效服务时间越短、需要更多卫星；仰角门限放低，则低仰角段的深损耗与恶化信道要吃掉余量。</text>
  <text x="85" y="576" font-size="11.5" fill="#78909c">这也是 38.811 把所有表格按仰角分档的原因：仰角是 NTN 信道里取代「UE 距离」的新坐标轴</text>
</svg>
