<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">副瓣与主瓣的"能量守恒"：压得越低，主瓣越胖</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#556">同一孔径下总辐射功率不变，压低副瓣只能靠把能量往主瓣里堆</text>

  <!-- curves -->
  <rect x="70" y="84" width="820" height="266" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
  <line x1="110" y1="310" x2="870" y2="310" stroke="#8899a6" stroke-width="1.4"/>
  <line x1="490" y1="102" x2="490" y2="310" stroke="#dfe9ec" stroke-width="1.2"/>
  <line x1="110" y1="200" x2="870" y2="200" stroke="#dfe9ec" stroke-width="1"/>

  <!-- uniform -->
  <path d="M 490 110 C 470 150, 452 280, 446 310" fill="none" stroke="#8a3a3a" stroke-width="2.6"/>
  <path d="M 490 110 C 510 150, 528 280, 534 310" fill="none" stroke="#8a3a3a" stroke-width="2.6"/>
  <path d="M 396 310 C 384 262, 360 262, 346 310" fill="none" stroke="#8a3a3a" stroke-width="2"/>
  <path d="M 634 310 C 646 262, 670 262, 684 310" fill="none" stroke="#8a3a3a" stroke-width="2"/>

  <!-- taylor -->
  <path d="M 490 122 C 476 170, 464 285, 460 310" fill="none" stroke="#0f7a8a" stroke-width="2.2" stroke-dasharray="8 5"/>
  <path d="M 490 122 C 504 170, 516 285, 520 310" fill="none" stroke="#0f7a8a" stroke-width="2.2" stroke-dasharray="8 5"/>
  <path d="M 400 310 C 392 292, 376 292, 366 310" fill="none" stroke="#0f7a8a" stroke-width="1.8" stroke-dasharray="8 5"/>
  <path d="M 614 310 C 622 292, 638 292, 648 310" fill="none" stroke="#0f7a8a" stroke-width="1.8" stroke-dasharray="8 5"/>

  <!-- -13.2 / -30 lines -->
  <line x1="110" y1="246" x2="870" y2="246" stroke="#8a3a3a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="820" y="240" font-size="10.5" fill="#8a3a3a">−13.2 dB</text>
  <line x1="110" y1="284" x2="870" y2="284" stroke="#0f7a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="820" y="278" font-size="10.5" fill="#0f7a8a">−30 dB</text>

  <!-- HPBW markers -->
  <line x1="446" y1="196" x2="534" y2="196" stroke="#8a3a3a" stroke-width="1.2"/>
  <text x="490" y="190" text-anchor="middle" font-size="10.5" fill="#8a3a3a">HPBW_u</text>
  <line x1="460" y1="176" x2="520" y2="176" stroke="#0f7a8a" stroke-width="1.2"/>
  <text x="490" y="170" text-anchor="middle" font-size="10.5" fill="#0f7a8a">1.14×</text>

  <text x="124" y="136" font-size="11.5" fill="#8a3a3a">均匀</text>
  <text x="124" y="158" font-size="11.5" fill="#0f7a8a">泰勒 −30 dB</text>

  <!-- gain/loss summary -->
  <rect x="30" y="368" width="290" height="144" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  <text x="52" y="394" font-size="13" font-weight="bold" fill="#4a7a3a">代价一：增益损失</text>
  <text x="52" y="420" font-size="11.5" fill="#333">锥削效率定义为</text>
  <text x="52" y="444" font-size="11.5" fill="#0f7a8a" font-family="Consolas,monospace">η_t = |Σa_n|² / (N·Σ|a_n|²)</text>
  <text x="52" y="472" font-size="11.5" fill="#333">均匀：η_t = 1；深锥削可低到 0.5</text>
  <text x="52" y="496" font-size="11" fill="#8a3a6a">这是"硬件钱"：要么加阵元补回来，要么接受</text>

  <rect x="335" y="368" width="290" height="144" rx="10" fill="#ffffff" stroke="#c96a1f" stroke-width="1.6"/>
  <text x="357" y="394" font-size="13" font-weight="bold" fill="#c96a1f">代价二：主瓣展宽</text>
  <text x="357" y="420" font-size="11.5" fill="#333">等效于有效孔径减小</text>
  <text x="357" y="442" font-size="11.5" fill="#0f7a8a" font-family="Consolas,monospace">HPBW_win = B_win · λ / (L cosθ₀)</text>
  <text x="357" y="470" font-size="11.5" fill="#333">B_win：均匀 1.0，泰勒 1.12~1.15</text>
  <text x="357" y="492" font-size="11.5" fill="#333">汉明 1.3~1.5（覆盖变宽，容量下降）</text>

  <rect x="640" y="368" width="290" height="144" rx="10" fill="#ffffff" stroke="#8a3a6a" stroke-width="1.6"/>
  <text x="662" y="394" font-size="13" font-weight="bold" fill="#8a3a6a">代价三：边缘电平过低</text>
  <text x="662" y="420" font-size="11.5" fill="#333">深锥削时边缘单元幅度 &lt; 0.1，</text>
  <text x="662" y="440" font-size="11.5" fill="#333">对通道幅相误差的<tspan font-weight="bold">敏感度急剧上升</tspan></text>
  <text x="662" y="466" font-size="11.5" fill="#333">⇒ 误差导致的副瓣抬升被放大</text>
  <text x="662" y="490" font-size="11" fill="#c96a1f">结论：校准精度不足时，深加窗反而更差</text>

  <text x="480" y="530" text-anchor="middle" font-size="11.5" fill="#333">工程建议：从均匀 −13 dB 起步，按需要逐级试到 −25/−30 dB 为止；超过 −35 dB 的收益通常被误差吃掉</text>
</svg>
