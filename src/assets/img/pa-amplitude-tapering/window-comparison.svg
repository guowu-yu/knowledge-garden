<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">从矩形窗到低副瓣：加窗的本质是"抹掉孔径边缘的突变"</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#556">矩形窗的傅里叶变换为 sinc，其第一旁瓣恒为 −13.2 dB</text>

  <!-- uniform -->
  <rect x="30" y="84" width="210" height="176" rx="10" fill="#ffffff" stroke="#8a3a3a" stroke-width="1.6"/>
  <text x="52" y="110" font-size="12.5" font-weight="bold" fill="#8a3a3a">均匀（矩形窗）</text>
  <line x1="56" y1="216" x2="216" y2="216" stroke="#8899a6" stroke-width="1.3"/>
  <path d="M 62 220 L 62 140 L 210 140 L 210 220" fill="#e6c9c9" stroke="#8a3a3a" stroke-width="2"/>
  <text x="136" y="240" font-size="11" fill="#8a3a3a">幅度恒为 1，边缘突变</text>
  <text x="56" y="132" font-size="11" fill="#333" font-family="Consolas,monospace">SLL = −13.2 dB</text>

  <!-- taylor -->
  <rect x="255" y="84" width="210" height="176" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
  <text x="277" y="110" font-size="12.5" font-weight="bold" fill="#0f7a8a">泰勒窗（指定 SLL）</text>
  <line x1="281" y1="216" x2="441" y2="216" stroke="#8899a6" stroke-width="1.3"/>
  <path d="M 285 208 C 300 150, 340 140, 363 138 C 386 140, 426 150, 441 208" fill="#d8ecf1" stroke="#0f7a8a" stroke-width="2"/>
  <text x="361" y="240" font-size="11" fill="#0f7a8a">近端 ~n̄ 个副瓣等电平后滚降</text>
  <text x="281" y="132" font-size="11" fill="#333" font-family="Consolas,monospace">SLL 可设计 −25…−40</text>

  <!-- cheb -->
  <rect x="480" y="84" width="210" height="176" rx="10" fill="#ffffff" stroke="#c96a1f" stroke-width="1.6"/>
  <text x="502" y="110" font-size="12.5" font-weight="bold" fill="#c96a1f">切比雪夫（等副瓣最优）</text>
  <line x1="506" y1="216" x2="666" y2="216" stroke="#8899a6" stroke-width="1.3"/>
  <path d="M 510 204 C 530 156, 560 152, 586 176 C 612 152, 642 156, 666 204" fill="#f6e2d2" stroke="#c96a1f" stroke-width="2"/>
  <text x="588" y="240" font-size="11" fill="#c96a1f">全部副瓣等高（等波纹）</text>
  <text x="506" y="132" font-size="11" fill="#333" font-family="Consolas,monospace">同 SLL 下主瓣最窄</text>

  <!-- hamming -->
  <rect x="705" y="84" width="225" height="176" rx="10" fill="#ffffff" stroke="#8a3a6a" stroke-width="1.6"/>
  <text x="727" y="110" font-size="12.5" font-weight="bold" fill="#8a3a6a">汉明/汉宁（通用窗）</text>
  <line x1="731" y1="216" x2="911" y2="216" stroke="#8899a6" stroke-width="1.3"/>
  <path d="M 735 182 C 760 150, 800 142, 821 141 C 842 142, 882 150, 907 182" fill="#eddcE8" stroke="#8a3a6a" stroke-width="2"/>
  <text x="821" y="240" font-size="11" fill="#8a3a6a">边缘不为零（汉明 0.08）</text>
  <text x="731" y="132" font-size="11" fill="#333" font-family="Consolas,monospace">汉明 −42 dB / 汉宁 −31 dB</text>

  <text x="480" y="298" text-anchor="middle" font-size="12" fill="#333">窗函数的三个代价（必须同时记账）</text>

  <!-- table -->
  <rect x="30" y="314" width="900" height="186" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  <text x="52" y="340" font-size="11.5" fill="#0f7a8a" font-weight="bold" font-family="Consolas,monospace">窗类型</text>
  <text x="212" y="340" font-size="11.5" fill="#0f7a8a" font-weight="bold" font-family="Consolas,monospace">第一副瓣</text>
  <text x="352" y="340" font-size="11.5" fill="#0f7a8a" font-weight="bold" font-family="Consolas,monospace">主瓣展宽因子</text>
  <text x="542" y="340" font-size="11.5" fill="#0f7a8a" font-weight="bold" font-family="Consolas,monospace">增益损失</text>
  <text x="692" y="340" font-size="11.5" fill="#0f7a8a" font-weight="bold" font-family="Consolas,monospace">锥削效率 η_t</text>
  <text x="852" y="340" font-size="11.5" fill="#0f7a8a" font-weight="bold" font-family="Consolas,monospace">适用</text>

  <text x="52" y="366" font-size="11.5" fill="#333" font-family="Consolas,monospace">均匀</text>
  <text x="212" y="366" font-size="11.5" fill="#333" font-family="Consolas,monospace">−13.2 dB</text>
  <text x="352" y="366" font-size="11.5" fill="#333" font-family="Consolas,monospace">1.00×</text>
  <text x="542" y="366" font-size="11.5" fill="#333" font-family="Consolas,monospace">0 dB</text>
  <text x="692" y="366" font-size="11.5" fill="#333" font-family="Consolas,monospace">1.00</text>
  <text x="852" y="366" font-size="11" fill="#667">最大增益</text>

  <text x="52" y="392" font-size="11.5" fill="#333" font-family="Consolas,monospace">泰勒 n̄=5, −30 dB</text>
  <text x="212" y="392" font-size="11.5" fill="#333" font-family="Consolas,monospace">−30 dB</text>
  <text x="352" y="392" font-size="11.5" fill="#333" font-family="Consolas,monospace">1.12~1.15×</text>
  <text x="542" y="392" font-size="11.5" fill="#333" font-family="Consolas,monospace">≈ −0.8 dB</text>
  <text x="692" y="392" font-size="11.5" fill="#333" font-family="Consolas,monospace">0.88~0.91</text>
  <text x="852" y="392" font-size="11" fill="#0f7a8a">通信/雷达首选</text>

  <text x="52" y="418" font-size="11.5" fill="#333" font-family="Consolas,monospace">切比雪夫 −30 dB</text>
  <text x="212" y="418" font-size="11.5" fill="#333" font-family="Consolas,monospace">−30 dB（全等）</text>
  <text x="352" y="418" font-size="11.5" fill="#333" font-family="Consolas,monospace">1.10~1.15×</text>
  <text x="542" y="418" font-size="11.5" fill="#333" font-family="Consolas,monospace">≈ −0.5 dB</text>
  <text x="692" y="418" font-size="11.5" fill="#333" font-family="Consolas,monospace">0.90</text>
  <text x="852" y="418" font-size="11" fill="#667">副瓣预算固定时</text>

  <text x="52" y="444" font-size="11.5" fill="#333" font-family="Consolas,monospace">汉明</text>
  <text x="212" y="444" font-size="11.5" fill="#333" font-family="Consolas,monospace">−42 dB</text>
  <text x="352" y="444" font-size="11.5" fill="#333" font-family="Consolas,monospace">1.30~1.50×</text>
  <text x="542" y="444" font-size="11.5" fill="#333" font-family="Consolas,monospace">≈ −1.3 dB</text>
  <text x="692" y="444" font-size="11.5" fill="#333" font-family="Consolas,monospace">0.73</text>
  <text x="852" y="444" font-size="11" fill="#667">强抗扰场景</text>

  <text x="52" y="470" font-size="11.5" fill="#333" font-family="Consolas,monospace">汉宁（Hann）</text>
  <text x="212" y="470" font-size="11.5" fill="#333" font-family="Consolas,monospace">−31 dB</text>
  <text x="352" y="470" font-size="11.5" fill="#333" font-family="Consolas,monospace">1.40~1.60×</text>
  <text x="542" y="470" font-size="11.5" fill="#333" font-family="Consolas,monospace">≈ −1.8 dB</text>
  <text x="692" y="470" font-size="11.5" fill="#333" font-family="Consolas,monospace">0.67</text>
  <text x="852" y="470" font-size="11" fill="#667">远副瓣滚降快</text>

  <text x="480" y="522" text-anchor="middle" font-size="11.5" fill="#8a3a6a">注意"第一副瓣"与"平均副瓣"是两件事：随机误差抬高的是平均副瓣，加窗压低的是确定性副瓣</text>
</svg>
