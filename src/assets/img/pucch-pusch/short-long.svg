<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Short vs Long PUCCH">
  <rect width="1000" height="480" rx="18" fill="#f3f7f9"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Short PUCCH vs Long PUCCH</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Duration is the first split: 1-2 symbols vs 4-14 symbols</text>

  <!-- short slot -->
  <text x="80" y="115" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a5561">Short PUCCH (Formats 0 / 2)</text>
  <rect x="80" y="130" width="840" height="70" rx="8" fill="#fff" stroke="#d0dde3"/>
  <rect x="100" y="145" width="620" height="40" fill="#d0dde3"/>
  <text x="410" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">other UL / DL symbols in slot</text>
  <rect x="740" y="145" width="140" height="40" fill="#0f7a8a"/>
  <text x="810" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#fff">1-2 sym PUCCH</text>

  <!-- long slot -->
  <text x="80" y="250" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a5a14">Long PUCCH (Formats 1 / 3 / 4)</text>
  <rect x="80" y="265" width="840" height="70" rx="8" fill="#fff" stroke="#d0dde3"/>
  <rect x="100" y="280" width="780" height="40" fill="#c9852c"/>
  <text x="490" y="305" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#fff">4 .. 14 symbols spanning most of the slot</text>

  <rect x="80" y="370" width="400" height="70" rx="10" fill="#0f7a8a"/>
  <text x="280" y="400" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fff">Short: low latency ACK</text>
  <text x="280" y="422" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7f3f7">fits end of slot, fast turnaround</text>

  <rect x="520" y="370" width="400" height="70" rx="10" fill="#c9852c"/>
  <text x="720" y="400" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fff">Long: coverage / capacity</text>
  <text x="720" y="422" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#fff">more energy / more bits (3/4)</text>
</svg>
