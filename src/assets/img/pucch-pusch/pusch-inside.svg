<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="PUSCH composition">
  <rect width="960" height="460" rx="18" fill="#f3f7f9"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">PUSCH: what is inside</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">UL-SCH data + DMRS (+ optional UCI piggyback / PTRS)</text>

  <rect x="80" y="120" width="500" height="240" rx="10" fill="#fff" stroke="#d0dde3"/>
  <rect x="110" y="160" width="440" height="50" fill="#c9852c"/>
  <text x="330" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">UL-SCH data REs</text>
  <rect x="110" y="230" width="440" height="20" fill="#1f3a4d"/>
  <text x="330" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#fff">DMRS</text>
  <rect x="110" y="270" width="440" height="50" fill="#e8b56a"/>
  <text x="330" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">optional UCI multiplexed</text>

  <rect x="620" y="120" width="280" height="240" rx="12" fill="#0f7a8a"/>
  <text x="760" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">Indicated by</text>
  <text x="760" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">DCI Format 0_0/0_1</text>
  <text x="760" y="235" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">FDRA / TDRA</text>
  <text x="760" y="270" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">MCS / HARQ / DMRS</text>
  <text x="760" y="305" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">or configured grant</text>

  <text x="40" y="410" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Msg3 in RACH is also a special early PUSCH using the RAR UL grant.</text>
</svg>
