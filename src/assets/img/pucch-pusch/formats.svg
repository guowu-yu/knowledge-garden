<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="PUCCH format map">
  <rect width="960" height="520" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">PUCCH Formats 0..4</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Pick by payload size and short/long duration</text>

  <g font-family="Segoe UI, sans-serif" font-size="12">
    <rect x="40" y="100" width="170" height="150" rx="10" fill="#0f7a8a"/>
    <text x="125" y="135" text-anchor="middle" fill="#fff" font-weight="700">Format 0</text>
    <text x="125" y="165" text-anchor="middle" fill="#e7f3f7">SHORT</text>
    <text x="125" y="195" text-anchor="middle" fill="#e7f3f7">1-2 bits</text>
    <text x="125" y="225" text-anchor="middle" fill="#e7f3f7">seq-based</text>

    <rect x="230" y="100" width="170" height="150" rx="10" fill="#c9852c"/>
    <text x="315" y="135" text-anchor="middle" fill="#fff" font-weight="700">Format 1</text>
    <text x="315" y="165" text-anchor="middle" fill="#fff">LONG</text>
    <text x="315" y="195" text-anchor="middle" fill="#fff">1-2 bits</text>
    <text x="315" y="225" text-anchor="middle" fill="#fff">seq + time</text>

    <rect x="420" y="100" width="170" height="150" rx="10" fill="#1a8f9e"/>
    <text x="505" y="135" text-anchor="middle" fill="#fff" font-weight="700">Format 2</text>
    <text x="505" y="165" text-anchor="middle" fill="#e7f3f7">SHORT</text>
    <text x="505" y="195" text-anchor="middle" fill="#e7f3f7">more bits</text>
    <text x="505" y="225" text-anchor="middle" fill="#e7f3f7">CSI/ACK</text>

    <rect x="610" y="100" width="150" height="150" rx="10" fill="#8a5a14"/>
    <text x="685" y="135" text-anchor="middle" fill="#fff" font-weight="700">Format 3</text>
    <text x="685" y="165" text-anchor="middle" fill="#fff">LONG</text>
    <text x="685" y="195" text-anchor="middle" fill="#fff">large UCI</text>
    <text x="685" y="225" text-anchor="middle" fill="#fff">coded</text>

    <rect x="780" y="100" width="140" height="150" rx="10" fill="#1f3a4d"/>
    <text x="850" y="135" text-anchor="middle" fill="#fff" font-weight="700">Format 4</text>
    <text x="850" y="165" text-anchor="middle" fill="#e7f3f7">LONG</text>
    <text x="850" y="195" text-anchor="middle" fill="#e7f3f7">+ OCC</text>
    <text x="850" y="225" text-anchor="middle" fill="#e7f3f7">multi-UE</text>
  </g>

  <rect x="40" y="290" width="880" height="180" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="330" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">Selection intuition</text>
  <text x="60" y="365" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Few bits + need fast ACK after PDSCH -&gt; often Format 0 (short)</text>
  <text x="60" y="395" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Few bits + need coverage -&gt; Format 1 (long)</text>
  <text x="60" y="425" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Medium/large CSI on short timeline -&gt; Format 2; large / multiuser long -&gt; 3 / 4</text>
</svg>
