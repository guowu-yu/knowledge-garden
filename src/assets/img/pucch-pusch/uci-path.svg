<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="UCI on PUCCH or PUSCH">
  <rect width="960" height="480" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Where UCI rides</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Not UCI=PUCCH always: first ask if it can piggyback on PUSCH</text>

  <rect x="80" y="110" width="180" height="80" rx="10" fill="#1f3a4d"/>
  <text x="170" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fff">UCI ready</text>
  <text x="170" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#e7f3f7">ACK / SR / CSI</text>

  <path d="M270 150 H320" stroke="#1f3a4d" stroke-width="3"/>
  <rect x="330" y="100" width="280" height="100" rx="10" fill="#0f7a8a"/>
  <text x="470" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">PUSCH same slot?</text>
  <text x="470" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7f3f7">+ multiplexing rules OK?</text>

  <path d="M470 210 V240" stroke="#1f3a4d" stroke-width="2"/>
  <path d="M300 240 H640" stroke="#1f3a4d" stroke-width="2"/>
  <path d="M300 240 V270" stroke="#1f3a4d" stroke-width="2"/>
  <path d="M640 240 V270" stroke="#1f3a4d" stroke-width="2"/>

  <text x="300" y="262" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a5561">No</text>
  <text x="640" y="262" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8a5a14">Yes</text>

  <rect x="180" y="280" width="240" height="90" rx="10" fill="#1a8f9e"/>
  <text x="300" y="318" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">send on PUCCH</text>
  <text x="300" y="345" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#e7f3f7">dedicated control channel</text>

  <rect x="520" y="280" width="240" height="90" rx="10" fill="#c9852c"/>
  <text x="640" y="318" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">piggyback PUSCH</text>
  <text x="640" y="345" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#fff">UCI rides with UL data</text>

  <text x="40" y="420" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">UCI = content; PUCCH / PUSCH = how it is carried. Format 0..4 is chosen only if PUCCH path is taken.</text>
  <text x="40" y="450" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Rules in TS 38.213 decide multiplex vs drop when resources conflict.</text>
</svg>
