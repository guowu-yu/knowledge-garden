<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="520" fill="#eef5f8"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">相量的两种视角：旋转矢量 ↔ 正弦时域</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#556">向右旋转 = 正频率 (e^{jωt})，逆时针 = 负频率；投影到实轴才是真实信号</text>

  <!-- Complex plane -->
  <rect x="40" y="88" width="400" height="360" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
  <text x="60" y="114" font-size="14" font-weight="bold" fill="#0f7a8a">复平面 (相量空间)</text>

  <!-- axes -->
  <line x1="80" y1="270" x2="410" y2="270" stroke="#8899a6" stroke-width="1.4"/>
  <line x1="240" y1="130" x2="240" y2="415" stroke="#8899a6" stroke-width="1.4"/>
  <text x="415" y="274" font-size="11" fill="#556">Re</text>
  <text x="246" y="126" font-size="11" fill="#556">Im</text>
  <text x="196" y="288" font-size="10.5" fill="#556">0</text>

  <!-- unit circle -->
  <circle cx="240" cy="270" r="110" fill="none" stroke="#c7d8dd" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- vector A -->
  <line x1="240" y1="270" x2="330" y2="180" stroke="#0f7a8a" stroke-width="2.6"/>
  <polygon points="330,180 320,188 325,196" fill="#0f7a8a"/>
  <text x="335" y="176" font-size="12.5" font-weight="bold" fill="#0f7a8a">A e^{jφ}</text>

  <!-- projection -->
  <line x1="330" y1="180" x2="330" y2="270" stroke="#c96a1f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="240" y1="180" x2="330" y2="180" stroke="#c96a1f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="300" y="290" font-size="11" fill="#c96a1f">A cosφ</text>
  <text x="200" y="196" font-size="11" fill="#c96a1f">A sinφ</text>

  <!-- angle arc -->
  <path d="M 280 270 A 40 40 0 0 0 268 243" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
  <text x="288" y="252" font-size="12" font-weight="bold" fill="#4a7a3a">φ</text>

  <!-- element weight vector -->
  <line x1="240" y1="270" x2="180" y2="330" stroke="#8a3a6a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="132" y="348" font-size="11" fill="#8a3a6a">w_n = a_n e^{jφ_n}</text>

  <!-- time domain -->
  <rect x="470" y="88" width="450" height="360" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
  <text x="490" y="114" font-size="14" font-weight="bold" fill="#0f7a8a">时域投影 (示波器看到的)</text>

  <line x1="500" y1="270" x2="900" y2="270" stroke="#8899a6" stroke-width="1.2"/>
  <line x1="500" y1="140" x2="500" y2="400" stroke="#8899a6" stroke-width="1.2"/>
  <text x="903" y="274" font-size="10.5" fill="#556">t</text>
  <text x="504" y="138" font-size="10.5" fill="#556">s(t)</text>

  <!-- sine wave -->
  <path d="M 500 270 C 530 170, 560 170, 590 270 C 620 370, 650 370, 680 270 C 710 170, 740 170, 770 270 C 800 370, 830 370, 860 270 C 880 208, 892 200, 900 214"
        fill="none" stroke="#0f7a8a" stroke-width="2.6"/>
  <line x1="545" y1="270" x2="545" y2="196" stroke="#c96a1f" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="545" cy="196" r="3.6" fill="#c96a1f"/>
  <text x="556" y="192" font-size="11" fill="#c96a1f">Re{A e^{j(ωt+φ)}}</text>

  <!-- period marker -->
  <line x1="545" y1="382" x2="635" y2="382" stroke="#4a7a3a" stroke-width="1.6"/>
  <line x1="545" y1="376" x2="545" y2="388" stroke="#4a7a3a" stroke-width="1.6"/>
  <line x1="635" y1="376" x2="635" y2="388" stroke="#4a7a3a" stroke-width="1.6"/>
  <text x="592" y="398" text-anchor="middle" font-size="11" fill="#4a7a3a">T = 2π/ω = 1/f</text>

  <!-- equivalence note -->
  <text x="480" y="472" text-anchor="middle" font-size="11.5" fill="#333">阵列的"配相" = 在复平面上把每个通道的相量旋转 φ_n，而不改变其模长 a_n</text>
</svg>
