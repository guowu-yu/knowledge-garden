<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="DMRS config chain">
  <rect width="960" height="420" rx="18" fill="#f3f7f9"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">How UE knows DMRS</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">MIB / RRC semi-static + DCI dynamic fields</text>

  <g font-family="Segoe UI, sans-serif" font-size="12">
    <rect x="40" y="130" width="180" height="90" rx="10" fill="#0f7a8a"/>
    <text x="130" y="170" text-anchor="middle" fill="#fff" font-weight="700">MIB</text>
    <text x="130" y="195" text-anchor="middle" fill="#e7f3f7">TypeA pos2/pos3</text>

    <path d="M230 175 H270" stroke="#1f3a4d" stroke-width="2"/>
    <rect x="280" y="130" width="200" height="90" rx="10" fill="#1a8f9e"/>
    <text x="380" y="170" text-anchor="middle" fill="#fff" font-weight="700">RRC</text>
    <text x="380" y="195" text-anchor="middle" fill="#e7f3f7">dmrs-Type / add. pos</text>

    <path d="M490 175 H530" stroke="#1f3a4d" stroke-width="2"/>
    <rect x="540" y="130" width="180" height="90" rx="10" fill="#c9852c"/>
    <text x="630" y="170" text-anchor="middle" fill="#fff" font-weight="700">DCI</text>
    <text x="630" y="195" text-anchor="middle" fill="#fff">antenna ports...</text>

    <path d="M730 175 H770" stroke="#1f3a4d" stroke-width="2"/>
    <rect x="780" y="130" width="140" height="90" rx="10" fill="#1f3a4d"/>
    <text x="850" y="175" text-anchor="middle" fill="#fff" font-weight="700">Decode</text>
  </g>

  <rect x="40" y="270" width="880" height="100" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="315" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">Also</text>
  <text x="60" y="345" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">CDM groups, scrambling ID (n_SCID), transform precoding (PUSCH), PTRS for phase noise at high MCS/FR2.</text>
</svg>
