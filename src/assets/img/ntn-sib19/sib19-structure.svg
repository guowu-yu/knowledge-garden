<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="SIB19 内容结构">
  <rect width="900" height="560" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">SIB19-r17 内容结构：卫星辅助信息的全部家当（TS 38.331）</text>
  <defs>
    <marker id="arS1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a4b5c"/>
    </marker>
  </defs>

  <g>
    <rect x="60" y="56" width="780" height="130" rx="12" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="80" y="82" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0a5561">ntn-Config-r17（服务小区卫星参数，主体）</text>
    <line x1="80" y1="94" x2="820" y2="94" stroke="#e2eef4" stroke-width="1.4"/>
    <text x="80" y="116" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">epochTime-r17 {sfn 0..1023, subFrameNR 0..9}   ntn-UlSyncValidityDuration-r17 {s5..s900}</text>
    <text x="80" y="138" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">cellSpecificKoffset-r17 (1..1023)   kmac-r17 (1..512)   ta-Info-r17 (ta-Common/Drift/Variant)</text>
    <text x="80" y="160" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">ephemerisInfo-r17 (positionVelocity | orbital)   ntn-PolarizationDL/UL   ta-Report-r17 {enabled}</text>
    <text x="80" y="178" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a9681f">星历 + 公共 TA + 定时偏移 + 有效期：UE 预补偿的全部广播输入</text>
  </g>

  <g>
    <rect x="60" y="206" width="250" height="96" rx="12" fill="#ffffff" stroke="#c9852c" stroke-width="1.6"/>
    <text x="185" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#a9681f">t-Service-r17</text>
    <text x="185" y="254" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">0..549755813887 × 10 ms</text>
    <text x="185" y="274" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">1900-01-01 纪元</text>
    <text x="185" y="292" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a9681f">本小区停止服务时刻</text>
  </g>
  <g>
    <rect x="326" y="206" width="250" height="96" rx="12" fill="#ffffff" stroke="#c9852c" stroke-width="1.6"/>
    <text x="451" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#a9681f">referenceLocation + distanceThresh</text>
    <text x="451" y="254" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">门限 50 m 步进（0..65525）</text>
    <text x="451" y="274" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">TS 38.304 定义</text>
    <text x="451" y="292" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a9681f">基于位置的测量启动触发</text>
  </g>
  <g>
    <rect x="592" y="206" width="250" height="96" rx="12" fill="#ffffff" stroke="#c9852c" stroke-width="1.6"/>
    <text x="717" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#a9681f">ntn-NeighCellConfigList</text>
    <text x="717" y="254" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">每邻区：ntn-Config + ARFCN + PCI</text>
    <text x="717" y="274" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">取交集可得共同覆盖窗口</text>
    <text x="717" y="292" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a9681f">不广播邻区星历时须专用信令</text>
  </g>

  <g>
    <rect x="60" y="322" width="380" height="220" rx="12" fill="#e2eef4"/>
    <text x="250" y="350" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0a5561">ephemerisInfo-r17 ::= CHOICE</text>
    <line x1="80" y1="362" x2="420" y2="362" stroke="#ffffff" stroke-width="1.4"/>
    <text x="80" y="386" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">positionVelocity（ECEF）</text>
    <text x="80" y="408" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">positionX/Y/Z-r17  ±26843545.675 m</text>
    <text x="80" y="428" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">velocityVX/VY/VZ-r17  ±16384 m/s</text>
    <text x="80" y="448" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">10 μm / 0.1 mm/s 精度，单点快照</text>
    <text x="80" y="478" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">orbital（开普勒 6 根数）</text>
    <text x="80" y="500" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">semiMajorAxis / eccentricity / periapsis</text>
    <text x="80" y="520" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">longitude / inclination / argOfPerigee</text>
  </g>

  <g>
    <rect x="460" y="322" width="382" height="220" rx="12" fill="#fdf3e3"/>
    <text x="651" y="350" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#a9681f">ta-Info-r17 ::= TAInfo</text>
    <line x1="480" y1="362" x2="822" y2="362" stroke="#ffffff" stroke-width="1.4"/>
    <text x="480" y="386" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">ta-Common-r17        0..66485757</text>
    <text x="480" y="406" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">公共 TA 初值 ×16 Tc ≈ 0.049152 ms 步进</text>
    <text x="480" y="432" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">ta-CommonDrift-r17   ±261935（μs/s）</text>
    <text x="480" y="452" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">ta-CommonDriftVariant-r17  0..29470（μs/s²）</text>
    <text x="480" y="482" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">N_TA,common(t) = ta-Common</text>
    <text x="480" y="500" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">  + Drift·Δt + ½·Variant·Δt²</text>
    <text x="480" y="524" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a9681f">Δt = 当前时刻 − epochTime</text>
  </g>
</svg>
