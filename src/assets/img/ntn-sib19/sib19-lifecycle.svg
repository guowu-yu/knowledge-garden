<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="UE 使用 SIB19 的全流程">
  <rect width="900" height="470" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">UE 使用 SIB19 的全流程：从小区发现到有效期守护</text>
  <defs>
    <marker id="arS3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a4b5c"/>
    </marker>
  </defs>

  <g>
    <rect x="60" y="60" width="230" height="72" rx="10" fill="#0f7a8a"/>
    <text x="175" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f4fafc">发现 NTN 小区</text>
    <text x="175" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#d9f0f4">MIB + SIB1（SIB1 标记 NTN 小区）</text>
  </g>
  <g>
    <rect x="336" y="60" width="230" height="72" rx="10" fill="#0f7a8a"/>
    <text x="451" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f4fafc">获取 SIB19</text>
    <text x="451" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#d9f0f4">SI 窗口周期广播 / 按需请求</text>
  </g>
  <g>
    <rect x="612" y="60" width="230" height="72" rx="10" fill="#0f7a8a"/>
    <text x="727" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f4fafc">GNSS 定位 + 星历解算</text>
    <text x="727" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#d9f0f4">星历外推卫星位置与速度</text>
  </g>
  <line x1="290" y1="96" x2="328" y2="96" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arS3)"/>
  <line x1="566" y1="96" x2="604" y2="96" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arS3)"/>

  <g>
    <rect x="60" y="182" width="230" height="72" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="175" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a5561">预补偿计算</text>
    <text x="175" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">UE 专用 TA + 多普勒频偏</text>
  </g>
  <g>
    <rect x="336" y="182" width="230" height="72" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="451" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a5561">PRACH 接入</text>
    <text x="451" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">Koffset 保证 UL 不落在过去</text>
  </g>
  <g>
    <rect x="612" y="182" width="230" height="72" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
    <text x="727" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a5561">有效期内守护</text>
    <text x="727" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">IDLE 自主重读 / 连接态 T430</text>
  </g>
  <path d="M727 132 C 727 160, 175 150, 175 174" fill="none" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arS3)"/>
  <line x1="290" y1="218" x2="328" y2="218" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arS3)"/>
  <line x1="566" y1="218" x2="604" y2="218" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arS3)"/>

  <g>
    <rect x="180" y="330" width="250" height="100" rx="10" fill="#fdf3e3" stroke="#c9852c" stroke-width="1.6"/>
    <text x="305" y="356" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#a9681f">RRC_IDLE / INACTIVE 到期</text>
    <text x="305" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">停止上行发射</text>
    <text x="305" y="396" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">重新获取系统信息后恢复</text>
    <text x="305" y="416" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a9681f">（38.300 §5.2.3 / 38.331）</text>
  </g>
  <g>
    <rect x="470" y="330" width="250" height="100" rx="10" fill="#fdf3e3" stroke="#c9852c" stroke-width="1.6"/>
    <text x="595" y="356" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#a9681f">RRC_CONNECTED：T430</text>
    <text x="595" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">星历 + Common TA 计时器</text>
    <text x="595" y="396" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">超时未刷新星历 → RLF</text>
    <text x="595" y="416" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a9681f">（38.331 §5.2.11）</text>
  </g>
  <line x1="727" y1="254" x2="727" y2="286" stroke="#c9852c" stroke-width="1.6"/>
  <line x1="727" y1="286" x2="305" y2="286" stroke="#c9852c" stroke-width="1.6"/>
  <line x1="305" y1="286" x2="305" y2="322" stroke="#c9852c" stroke-width="1.6" marker-end="url(#arS3)"/>
  <line x1="727" y1="286" x2="595" y2="286" stroke="#c9852c" stroke-width="1.6"/>
  <line x1="595" y1="286" x2="595" y2="322" stroke="#c9852c" stroke-width="1.6" marker-end="url(#arS3)"/>
  <text x="727" y="276" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#a9681f">到期未刷新</text>
</svg>
