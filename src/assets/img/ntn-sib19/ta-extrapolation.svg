<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="公共 TA 外推与有效期">
  <rect width="900" height="430" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">公共 TA 外推与有效期：为什么 SIB19 是「有时效的广播」</text>
  <defs>
    <marker id="arS2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a4b5c"/>
    </marker>
  </defs>

  <rect x="200" y="60" width="560" height="250" rx="12" fill="#e2eef4"/>
  <text x="480" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0a5561">ntn-UlSyncValidityDuration 有效窗口（s5 … s900 秒）</text>

  <line x1="80" y1="370" x2="840" y2="370" stroke="#3a4b5c" stroke-width="1.6" marker-end="url(#arS2)"/>
  <text x="840" y="396" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">时间 t（UE 本地时钟对齐 epochTime）</text>

  <line x1="200" y1="310" x2="200" y2="60" stroke="#0f7a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="190" y="330" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0a5561">epochTime</text>
  <text x="190" y="348" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">SFN + 子帧号（1024 帧周期）</text>

  <path d="M200 290 C 330 280, 480 250, 620 190 L 760 120" fill="none" stroke="#0f7a8a" stroke-width="2.4" marker-end="url(#arS2)"/>
  <text x="220" y="312" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">ta-Common 初值</text>
  <text x="330" y="252" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">ta-CommonDrift（μs/s）一阶项</text>
  <text x="520" y="180" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">DriftVariant（μs/s²）二阶弯项</text>

  <line x1="760" y1="310" x2="760" y2="60" stroke="#a9681f" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="770" y="330" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#a9681f">有效期到期</text>
  <text x="770" y="348" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">IDLE：停发上行重读 SI / 连接态：T430</text>

  <text x="90" y="110" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0a5561">N_TA,common(t) =</text>
  <text x="90" y="130" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">ta-Common</text>
  <text x="90" y="148" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">+ Drift · Δt</text>
  <text x="90" y="166" font-family="Consolas, monospace" font-size="12" fill="#0b1c28">+ ½ Variant · Δt²</text>
  <text x="90" y="196" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">NGSO：外推是常态</text>
  <text x="90" y="214" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7a8b99">GSO：drift≈0，近似常数</text>
</svg>
