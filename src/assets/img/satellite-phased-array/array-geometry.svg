<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="线性阵列几何与波程差">
  <rect width="900" height="420" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">线性阵列的几何关系与波程差</text>
  <text x="24" y="56" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">d = 阵元间距，θ = 扫描角（偏离阵列法线），ΔR = 相邻阵元的波程差 = d·sinθ</text>

  <defs>
    <marker id="ga-ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9852c"/>
    </marker>
    <marker id="ga-ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0f7a8a"/>
    </marker>
  </defs>

  <!-- 法线 -->
  <line x1="300" y1="330" x2="300" y2="90" stroke="#8a99a8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="308" y="100" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">阵列法线 broadside</text>

  <!-- 波前（垂直波束方向） -->
  <line x1="196" y1="150" x2="640" y2="304" stroke="#0f7a8a" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="562" y="330" font-family="Segoe UI, sans-serif" font-size="12" fill="#0a5561">等相位波前</text>

  <!-- 波束方向 -->
  <line x1="300" y1="330" x2="612" y2="152" stroke="#c9852c" stroke-width="2.4" marker-end="url(#ga-ar)"/>
  <text x="620" y="146" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#a9681f">波束方向</text>

  <!-- 阵列板 -->
  <rect x="180" y="330" width="240" height="20" rx="5" fill="#0b1c28"/>
  <!-- 阵元 -->
  <g fill="#0f7a8a">
    <circle cx="196" cy="330" r="7"/>
    <circle cx="244" cy="330" r="7"/>
    <circle cx="292" cy="330" r="7"/>
    <circle cx="340" cy="330" r="7"/>
    <circle cx="388" cy="330" r="7"/>
  </g>
  <text x="180" y="374" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">阵元 1</text>
  <text x="372" y="374" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">阵元 N</text>

  <!-- 间距标注 -->
  <line x1="196" y1="356" x2="244" y2="356" stroke="#0f7a8a" stroke-width="1.6" marker-start="url(#ga-ar2)" marker-end="url(#ga-ar2)"/>
  <text x="200" y="404" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a5561">d</text>

  <!-- 扫描角标注 -->
  <path d="M300 300 A 30 30 0 0 0 322 288" fill="none" stroke="#c9852c" stroke-width="1.6"/>
  <text x="316" y="290" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#a9681f">θ</text>

  <!-- 波程差几何：两条垂直到波束方向的射线 -->
  <line x1="196" y1="150" x2="196" y2="330" stroke="#b9c8d2" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="244" y1="150" x2="244" y2="330" stroke="#b9c8d2" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="196" y1="150" x2="244" y2="150" stroke="#c9852c" stroke-width="2" marker-end="url(#ga-ar)"/>
  <text x="140" y="136" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#a9681f">ΔR</text>

  <!-- 右侧文字块 -->
  <rect x="660" y="90" width="216" height="150" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.4"/>
  <text x="678" y="116" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0b1c28">补偿相位</text>
  <text x="678" y="146" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Δφ = 2π·d·sinθ / λ</text>
  <text x="678" y="178" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">阵元 n 的相位偏移：</text>
  <text x="678" y="202" font-family="Segoe UI, sans-serif" font-size="13" fill="#0a5561">φ_n = −n · Δφ</text>
  <text x="678" y="226" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">相位只由频率与几何决定</text>
</svg>
