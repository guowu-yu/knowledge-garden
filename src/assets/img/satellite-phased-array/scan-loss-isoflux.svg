<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="扫描角与增益滚降及等通量波束">
  <rect width="900" height="430" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">扫描增益滚降与等通量波束设计</text>
  <text x="24" y="56" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">左：有效孔径随扫描角按 cosθ 收缩；右：扫描带来的额外损耗由波束形状补偿</text>

  <!-- 左：坐标图 -->
  <rect x="30" y="80" width="400" height="300" rx="10" fill="#ffffff" stroke="#cfe0e8" stroke-width="1.2"/>
  <text x="52" y="106" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a5561">扫描损耗 vs 扫描角</text>

  <!-- 坐标轴 -->
  <line x1="76" y1="330" x2="400" y2="330" stroke="#8a99a8" stroke-width="1.4"/>
  <line x1="76" y1="330" x2="76" y2="130" stroke="#8a99a8" stroke-width="1.4"/>
  <text x="330" y="352" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">扫描角 θ (°)</text>
  <text x="34" y="140" font-family="Segoe UI, sans-serif" font-size="11" fill="#7a8b99">损耗 (dB)</text>

  <!-- 网格与刻度 -->
  <g stroke="#dde7ec" stroke-width="1">
    <line x1="76" y1="280" x2="400" y2="280"/>
    <line x1="76" y1="230" x2="400" y2="230"/>
    <line x1="76" y1="180" x2="400" y2="180"/>
    <line x1="76" y1="330" x2="76" y2="130"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="10" fill="#7a8b99">
    <text x="52" y="334">0</text>
    <text x="44" y="284">−2</text>
    <text x="44" y="234">−4</text>
    <text x="44" y="184">−6</text>
    <text x="86" y="346">0</text>
    <text x="140" y="346">15</text>
    <text x="200" y="346">30</text>
    <text x="260" y="346">45</text>
    <text x="316" y="346">60</text>
    <text x="368" y="346">75</text>
  </g>
  <line x1="140" y1="130" x2="140" y2="330" stroke="#dde7ec" stroke-width="1"/>
  <line x1="200" y1="130" x2="200" y2="330" stroke="#dde7ec" stroke-width="1"/>
  <line x1="260" y1="130" x2="260" y2="330" stroke="#dde7ec" stroke-width="1"/>
  <line x1="316" y1="130" x2="316" y2="330" stroke="#dde7ec" stroke-width="1"/>

  <!-- 曲线：10log10(cosθ) -->
  <path d="M76 330 L140 323 L200 312 L260 291 L316 266 L372 226" fill="none" stroke="#c9852c" stroke-width="2.6"/>

  <!-- 关键点 -->
  <circle cx="260" cy="291" r="4.5" fill="#c9852c"/>
  <circle cx="316" cy="266" r="4.5" fill="#c9852c"/>
  <circle cx="372" cy="226" r="4.5" fill="#c9852c"/>

  <text x="266" y="282" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#a9681f">45° / −1.5 dB</text>
  <text x="322" y="258" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#a9681f">60° / −3 dB</text>
  <text x="286" y="218" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#a9681f">75° / −6 dB</text>

  <text x="52" y="286" font-family="Segoe UI, sans-serif" font-size="11" fill="#1f3a4d">实际阵列在 60° 以外还会叠加</text>
  <text x="52" y="304" font-family="Segoe UI, sans-serif" font-size="11" fill="#1f3a4d">阵元方向图与互耦恶化，滚降更快</text>

  <!-- 右：等通量示意 -->
  <rect x="452" y="80" width="424" height="300" rx="10" fill="#ffffff" stroke="#cfe0e8" stroke-width="1.2"/>
  <text x="474" y="106" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a5561">等通量（isoflux）波束</text>

  <!-- 卫星 -->
  <rect x="584" y="128" width="72" height="34" rx="6" fill="#0f7a8a"/>
  <text x="620" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#f4fafc">SAT</text>

  <!-- 三个波束：近端窄、远端宽 -->
  <path d="M620 166 L516 348 L556 348 Z" fill="#c9852c" fill-opacity="0.14" stroke="#c9852c" stroke-width="1.3"/>
  <path d="M620 166 L562 348 L702 348 Z" fill="#0f7a8a" fill-opacity="0.14" stroke="#0f7a8a" stroke-width="1.3"/>
  <path d="M620 166 L708 348 L748 348 Z" fill="#c9852c" fill-opacity="0.14" stroke="#c9852c" stroke-width="1.3"/>

  <!-- 地面弧 -->
  <path d="M470 356 Q664 330 856 356" fill="none" stroke="#0f7a8a" stroke-width="2.2"/>

  <!-- 标注 -->
  <text x="498" y="310" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#a9681f">远端</text>
  <text x="498" y="326" font-family="Segoe UI, sans-serif" font-size="10" fill="#a9681f">窄波束高增益</text>
  <text x="608" y="310" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#0a5561">星下点</text>
  <text x="608" y="326" font-family="Segoe UI, sans-serif" font-size="10" fill="#0a5561">宽波束低增益</text>
  <text x="700" y="310" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#a9681f">远端</text>
  <text x="700" y="326" font-family="Segoe UI, sans-serif" font-size="10" fill="#a9681f">窄波束高增益</text>

  <text x="474" y="376" font-family="Segoe UI, sans-serif" font-size="11" fill="#1f3a4d">地球曲率与斜距差共同造成约 3～5 dB 的路损落差，</text>
  <text x="474" y="394" font-family="Segoe UI, sans-serif" font-size="11" fill="#1f3a4d">靠波束形状反向补偿，使各地面功率密度趋于一致。</text>
</svg>
