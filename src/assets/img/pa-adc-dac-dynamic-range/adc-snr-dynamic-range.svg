<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">ADC 的三条曲线：SNR / ENOB / SFDR</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#556">理论极限由位数给出；实际能用的动态范围由 SFDR 与实际 ENOB 给出，通常还要打折</text>

  <!-- SNR ladder -->
  <rect x="30" y="80" width="440" height="256" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.5"/>
  <text x="48" y="106" font-size="13" font-weight="bold" fill="#0f7a8a">理想 SNR = 6.02·N + 1.76 dB</text>
  <g font-size="11">
    <rect x="90" y="124" width="90" height="20" rx="3" fill="#0f7a8a" opacity="0.35"/>
    <text x="86" y="139" text-anchor="end" fill="#333">8 bit</text><text x="190" y="139" fill="#333">49.9 dB</text>
    <rect x="90" y="152" width="120" height="20" rx="3" fill="#0f7a8a" opacity="0.45"/>
    <text x="86" y="167" text-anchor="end" fill="#333">10 bit</text><text x="220" y="167" fill="#333">62.0 dB</text>
    <rect x="90" y="180" width="150" height="20" rx="3" fill="#0f7a8a" opacity="0.6"/>
    <text x="86" y="195" text-anchor="end" fill="#333">12 bit</text><text x="250" y="195" fill="#333">74.0 dB</text>
    <rect x="90" y="208" width="180" height="20" rx="3" fill="#0f7a8a" opacity="0.75"/>
    <text x="86" y="223" text-anchor="end" fill="#333">14 bit</text><text x="280" y="223" fill="#333">86.0 dB</text>
    <rect x="90" y="236" width="210" height="20" rx="3" fill="#0f7a8a"/>
    <text x="86" y="251" text-anchor="end" fill="#333">16 bit</text><text x="310" y="251" fill="#333">98.1 dB</text>
  </g>
  <text x="48" y="284" font-size="11" fill="#556">每多 1 bit，理想 SNR 提高约 6 dB；这是"量化噪声均匀铺满 Nyquist 带宽"的结果。</text>
  <text x="48" y="308" font-size="11.5" fill="#c96a1f">过采样收益：SFDR_eff = SNR + 10log10( fs / (2B) )</text>
  <text x="48" y="328" font-size="11" fill="#667">fs=1 GSPS、B=1 MHz 时处理增益 27 dB，把 14 bit 的 86 dB 抬到 ~113 dB</text>

  <!-- ENOB / SFDR contrast -->
  <rect x="490" y="80" width="440" height="256" rx="10" fill="#ffffff" stroke="#c96a1f" stroke-width="1.5"/>
  <text x="508" y="106" font-size="13" font-weight="bold" fill="#c96a1f">理论与现实的落差</text>
  <text x="508" y="134" font-size="11.5" fill="#333">ENOB = (SINAD − 1.76) / 6.02</text>
  <text x="508" y="158" font-size="11.5" fill="#333">实际 ENOB 常比标称位数少 1~3 bit：</text>
  <text x="508" y="182" font-size="11" fill="#556">· DNL / INL 非线性</text>
  <text x="508" y="202" font-size="11" fill="#556">· 采样时钟抖动（高频尤其致命）</text>
  <text x="508" y="222" font-size="11" fill="#556">· 热噪声、交织杂散</text>
  <text x="508" y="252" font-size="11.5" fill="#333">14 bit ADC 的 SFDR 实测常为 75~85 dBc，</text>
  <text x="508" y="274" font-size="11.5" fill="#333">比理想的 86 dB 差。</text>
  <text x="508" y="304" font-size="11" fill="#8a3a6a">抖动限制：SNR_jitter = −20log10( 2π·f_in·t_jitter )</text>
  <text x="508" y="324" font-size="11" fill="#667">1 GHz 输入 + 100 fs 抖动 → 上限约 64 dB（≈10.3 ENOB），再加位数也没用</text>

  <!-- notes -->
  <rect x="30" y="352" width="900" height="168" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  <text x="48" y="378" font-size="13" font-weight="bold" fill="#4a7a3a">给数字波束成形工程师的三个结论</text>
  <text x="48" y="404" font-size="11.5" fill="#333">① <tspan font-weight="bold">SFDR 决定"强信号压住弱信号"的能力</tspan>：一个强的邻道/干扰会盖住你要的弱目标，SFDR 就是那条"看不见的地板"。</text>
  <text x="48" y="426" font-size="11.5" fill="#333">② <tspan font-weight="bold">过采样是"免费的"动态范围</tspan>：只要能接受更窄的瞬时带宽，多采样再数字滤波，换来 3 dB/倍频的 SNR 增益。</text>
  <text x="48" y="448" font-size="11.5" fill="#333">③ <tspan font-weight="bold">抖动是高频的隐藏天花板</tspan>：Ka/E 波段直采时，先算 jitter 限制，再决定要不要堆位数。</text>
  <text x="48" y="476" font-size="11.5" fill="#8a3a6a">算法提醒：数字域的零陷深度不可能超过 ADC 的动态范围。你在仿真里做的 −60 dB 零陷，若前端只有 60 dB SFDR，就是自欺。</text>
  <text x="48" y="502" font-size="11.5" fill="#556">所以"零陷能力"的第一约束是接收链（ADC 位数 + 前端线性度），而不是你的自适应算法。</text>
</svg>
