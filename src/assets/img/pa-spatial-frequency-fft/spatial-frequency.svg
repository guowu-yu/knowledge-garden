<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">空间频率 u = sinθ：为什么用正弦而不是角度</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#556">物理量是"相邻阵元的波程差"，它正比于 sinθ；用 θ 做横轴会让等间隔采样在图上变得不等间隔</text>

  <!-- left: geometry -->
  <rect x="30" y="84" width="430" height="220" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
  <text x="50" y="110" font-size="13.5" font-weight="bold" fill="#0f7a8a">几何：波程差 = d·sinθ</text>

  <!-- array line -->
  <line x1="70" y1="248" x2="440" y2="248" stroke="#8899a6" stroke-width="1.6"/>
  <g fill="#0f7a8a">
    <rect x="86" y="238" width="9" height="12" rx="2"/>
    <rect x="136" y="238" width="9" height="12" rx="2"/>
    <rect x="186" y="238" width="9" height="12" rx="2"/>
    <rect x="236" y="238" width="9" height="12" rx="2"/>
  </g>
  <text x="92" y="268" font-size="10.5" fill="#556">0</text>
  <text x="140" y="268" font-size="10.5" fill="#556">1</text>
  <text x="252" y="268" font-size="10.5" fill="#556">n</text>

  <!-- incoming wavefront -->
  <line x1="180" y1="130" x2="330" y2="196" stroke="#c96a1f" stroke-width="2.4"/>
  <line x1="186" y1="146" x2="336" y2="212" stroke="#c96a1f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="326" y="136" font-size="11.5" fill="#c96a1f">等相位面（波前）</text>

  <!-- theta -->
  <line x1="240" y1="248" x2="240" y2="160" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M 240 200 A 48 48 0 0 0 205 182" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
  <text x="248" y="188" font-size="13" font-weight="bold" fill="#4a7a3a">θ</text>

  <!-- path difference -->
  <line x1="186" y1="180" x2="236" y2="201" stroke="#8a3a6a" stroke-width="2"/>
  <text x="150" y="176" font-size="11" fill="#8a3a6a">Δr = d·sinθ</text>

  <text x="50" y="294" font-size="11" fill="#333" font-family="Consolas,monospace">Δφ = 2π·(d/λ)·sinθ = 2π·(d/λ)·u</text>

  <!-- right: u vs theta -->
  <rect x="490" y="84" width="440" height="220" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.6"/>
  <text x="510" y="110" font-size="13.5" font-weight="bold" fill="#0f7a8a">u = sinθ 把可见空间"拉直"</text>

  <!-- theta axis mapping -->
  <line x1="520" y1="200" x2="910" y2="200" stroke="#8899a6" stroke-width="1.4"/>
  <text x="912" y="204" font-size="10.5" fill="#556">θ</text>
  <text x="525" y="220" font-size="10.5" fill="#556">-90°</text>
  <text x="695" y="220" font-size="10.5" fill="#556">0°</text>
  <text x="880" y="220" font-size="10.5" fill="#556">90°</text>
  <g stroke="#c7d8dd" stroke-width="1">
    <line x1="560" y1="200" x2="560" y2="206"/>
    <line x1="640" y1="200" x2="640" y2="206"/>
    <line x1="800" y1="200" x2="800" y2="206"/>
  </g>
  <text x="556" y="234" font-size="10" fill="#8899a6">-60°</text>
  <text x="806" y="234" font-size="10" fill="#8899a6">60°</text>

  <!-- u axis -->
  <line x1="526" y1="272" x2="904" y2="272" stroke="#0f7a8a" stroke-width="1.8"/>
  <text x="908" y="276" font-size="11" font-weight="bold" fill="#0f7a8a">u</text>
  <text x="522" y="290" font-size="10.5" fill="#0f7a8a">-1</text>
  <text x="698" y="290" font-size="10.5" fill="#0f7a8a">0</text>
  <text x="886" y="290" font-size="10.5" fill="#0f7a8a">+1</text>

  <!-- uniform sampling markers on u axis -->
  <g fill="#0f7a8a">
    <circle cx="564" cy="272" r="3.4"/>
    <circle cx="602" cy="272" r="3.4"/>
    <circle cx="640" cy="272" r="3.4"/>
    <circle cx="678" cy="272" r="3.4"/>
    <circle cx="716" cy="272" r="3.4"/>
    <circle cx="754" cy="272" r="3.4"/>
    <circle cx="792" cy="272" r="3.4"/>
    <circle cx="830" cy="272" r="3.4"/>
    <circle cx="868" cy="272" r="3.4"/>
  </g>
  <text x="530" y="302" font-size="10.5" fill="#333">u 轴 ⋯ 等间隔（间距 λ/(2d) 决定采样点）</text>

  <text x="510" y="150" font-size="11" fill="#4a7a3a">可见空间 = 单位圆在 u 轴上的投影 [-1, +1]</text>
  <text x="510" y="170" font-size="11" fill="#8a3a6a">"扫描" = 沿 u 轴平移这条采样序列</text>

  <!-- bottom: dual pair -->
  <rect x="30" y="324" width="900" height="184" rx="10" fill="#ffffff" stroke="#8a3a6a" stroke-width="1.6"/>
  <text x="50" y="350" font-size="13.5" font-weight="bold" fill="#8a3a6a">傅里叶对偶：激励 ↔ 方向图</text>

  <!-- excitation -->
  <text x="70" y="382" font-size="11.5" fill="#0f7a8a" font-weight="bold">空间域（阵元激励 w_n）</text>
  <line x1="70" y1="440" x2="410" y2="440" stroke="#8899a6" stroke-width="1.2"/>
  <g fill="#0f7a8a">
    <rect x="76" y="410" width="12" height="30" rx="2"/>
    <rect x="112" y="404" width="12" height="36" rx="2"/>
    <rect x="148" y="396" width="12" height="44" rx="2"/>
    <rect x="184" y="386" width="12" height="54" rx="2"/>
    <rect x="220" y="378" width="12" height="62" rx="2"/>
    <rect x="256" y="371" width="12" height="69" rx="2"/>
    <rect x="292" y="366" width="12" height="74" rx="2"/>
    <rect x="328" y="362" width="12" height="78" rx="2"/>
    <rect x="364" y="359" width="12" height="81" rx="2"/>
  </g>
  <text x="240" y="466" text-anchor="middle" font-size="11" fill="#556">线性相位斜坡 e^{j·n·Δφ}（= 空间频移）</text>
  <text x="240" y="486" text-anchor="middle" font-size="10.5" fill="#8899a6">↕ DFT</text>

  <!-- pattern -->
  <text x="560" y="382" font-size="11.5" fill="#c96a1f" font-weight="bold">空间频域（方向图 AF(u)）</text>
  <line x1="560" y1="440" x2="900" y2="440" stroke="#8899a6" stroke-width="1.2"/>
  <path d="M 570 440 C 600 440, 610 424, 630 424 C 650 424, 655 410, 668 396 C 680 383, 690 356, 700 320 C 710 356, 720 383, 732 396 C 745 410, 750 424, 770 424 C 790 424, 800 440, 830 440 L 900 440"
        fill="none" stroke="#c96a1f" stroke-width="2.4"/>
  <line x1="700" y1="320" x2="700" y2="440" stroke="#8a3a6a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="700" y="312" text-anchor="middle" font-size="10.5" fill="#8a3a6a">主瓣</text>
  <text x="640" y="368" font-size="10" fill="#556">副瓣</text>
  <text x="560" y="466" font-size="11" fill="#556">空间域"加窗" = 频域"卷积"（平滑、压低振铃）</text>
  <text x="560" y="486" font-size="10.5" fill="#8899a6">空间域"斜坡" = 频域"平移"（扫描）</text>
</svg>
