<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="切换失败与恢复">
  <rect width="1000" height="380" rx="18" fill="#eef5f7"/>
  <text x="40" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">切换失败与恢复</text>

  <rect x="60" y="80" width="180" height="60" rx="10" fill="#c9852c"/>
  <text x="150" y="115" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">切换命令</text>

  <path d="M260 110 H310" stroke="#1f3a4d" stroke-width="2"/>
  <rect x="320" y="80" width="180" height="60" rx="10" fill="#0f7a8a"/>
  <text x="410" y="115" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">同步目标</text>

  <path d="M500 110 H550" stroke="#1f3a4d" stroke-width="2"/>
  <rect x="560" y="80" width="180" height="60" rx="10" fill="#b33a3a"/>
  <text x="650" y="105" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">t304 超时</text>
  <text x="650" y="125" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#fff">切换失败</text>

  <rect x="60" y="180" width="280" height="90" rx="10" fill="#1f3a4d"/>
  <text x="190" y="215" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">RRC 重建</text>
  <text x="190" y="240" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">试源站或合适小区</text>

  <rect x="360" y="180" width="280" height="90" rx="10" fill="#6b4c9a"/>
  <text x="490" y="215" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">回源小区</text>
  <text x="490" y="240" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">源链路仍可用（少见）</text>

  <rect x="660" y="180" width="280" height="90" rx="10" fill="#0a5561"/>
  <text x="830" y="215" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">Idle 重驻留</text>
  <text x="830" y="240" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">重建失败</text>

  <rect x="60" y="300" width="880" height="70" rx="10" fill="#fff" stroke="#d0dde3"/>
  <text x="80" y="335" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">常见原因：目标 PCI 错、CFRA 不匹配、目标未就绪、目标射频过弱</text>
  <text x="80" y="355" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">用户感知：短断话、TCP 重传尖峰、游戏卡顿</text>
</svg>
