<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="条件切换 CHO">
  <rect width="1000" height="420" rx="18" fill="#eef5f7"/>
  <text x="40" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">条件切换（CHO）</text>
  <text x="40" y="65" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#1f3a4d">网络预配目标；条件满足时 UE 自主执行</text>

  <rect x="60" y="95" width="200" height="70" rx="10" fill="#1f3a4d"/>
  <text x="160" y="120" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">1. 网络下发</text>
  <text x="160" y="150" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">条件重配</text>

  <path d="M250 130 H300" stroke="#c9852c" stroke-width="3"/>
  <rect x="310" y="95" width="200" height="70" rx="10" fill="#0f7a8a"/>
  <text x="410" y="120" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">2. UE 保存</text>
  <text x="410" y="150" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">候选目标小区</text>

  <path d="M500 130 H550" stroke="#c9852c" stroke-width="3"/>
  <rect x="560" y="95" width="200" height="70" rx="10" fill="#c9852c"/>
  <text x="660" y="120" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">3. 条件满足</text>
  <text x="660" y="150" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#fff">本地 A3/A5 类</text>

  <path d="M750 130 H800" stroke="#c9852c" stroke-width="3"/>
  <rect x="810" y="95" width="150" height="70" rx="10" fill="#1a8f9e"/>
  <text x="865" y="120" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">4. UE 执行</text>
  <text x="865" y="150" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">自行 withSync</text>

  <rect x="60" y="200" width="900" height="190" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="80" y="235" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">CHO 与标准切换对比</text>
  <text x="80" y="265" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">标准：测量报告 → 网络决策 → 下发切换命令（网络决定时刻）</text>
  <text x="80" y="305" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">CHO：命令已在 UE；事件触发即执行（更低时延）</text>
  <text x="80" y="335" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">场景：高铁、出隧道 — 链路恶化前预配目标</text>
  <text x="80" y="365" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">可多候选；UE 选首个满足条件的目标</text>
  <text x="80" y="395" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">相关：EN-DC / NR-DC 条件 PSCell 变更</text>
</svg>
