<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="EN-DC 移动性">
  <rect width="1000" height="360" rx="18" fill="#eef5f7"/>
  <text x="40" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">NSA EN-DC 移动性（扩展，非纯 SA HO）</text>

  <rect x="60" y="80" width="200" height="90" rx="10" fill="#1f3a4d"/>
  <text x="160" y="110" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">MN 切换</text>
  <text x="160" y="135" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">LTE 锚点迁移</text>
  <text x="160" y="155" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">SN 可能变更</text>

  <rect x="280" y="80" width="200" height="90" rx="10" fill="#0f7a8a"/>
  <text x="380" y="110" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">SN 变更</text>
  <text x="380" y="135" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">NR 腿换 gNB</text>
  <text x="380" y="155" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">MN 可不变</text>

  <rect x="500" y="80" width="200" height="90" rx="10" fill="#c9852c"/>
  <text x="600" y="110" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">PSCell 变更</text>
  <text x="600" y="135" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#fff">SCG 主 NR 小区</text>
  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#fff">CA / DC 场景</text>

  <rect x="720" y="80" width="200" height="90" rx="10" fill="#1a8f9e"/>
  <text x="820" y="110" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">SCell 添加</text>
  <text x="820" y="135" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">非完整 HO</text>
  <text x="820" y="155" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">增加载波</text>

  <rect x="60" y="220" width="880" height="120" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="80" y="255" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">SA NR 切换 vs EN-DC</text>
  <text x="80" y="285" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">SA：MCG SpCell（NR PCell）经 withSync 迁移 — 本篇主线</text>
  <text x="80" y="310" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">EN-DC：MCG（LTE）+ SCG（NR）；移动性可分别动 MN、SN、PSCell</text>
  <text x="80" y="335" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">NR-DC（双 NR）有类似的 MN/SN / PSCell 移动性</text>
</svg>
