<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">架构对比：把"能力"和"代价"放在同一张表上</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#556">选型的本质是加权打分：权重来自你的系统指标，而不是"哪个更先进"</text>

  <!-- header -->
  <rect x="24" y="76" width="190" height="40" rx="6" fill="#0f7a8a"/>
  <text x="119" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">维度</text>
  <rect x="220" y="76" width="176" height="40" rx="6" fill="#0f7a8a"/>
  <text x="308" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">PESA</text>
  <rect x="402" y="76" width="176" height="40" rx="6" fill="#c96a1f"/>
  <text x="490" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">AESA</text>
  <rect x="584" y="76" width="176" height="40" rx="6" fill="#4a7a3a"/>
  <text x="672" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">混合</text>
  <rect x="766" y="76" width="170" height="40" rx="6" fill="#8a3a6a"/>
  <text x="851" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">全数字</text>

  <g font-size="10.8">
    <rect x="24" y="120" width="912" height="40" fill="#ffffff" stroke="#dbe6ea"/>
    <text x="36" y="145" font-weight="bold" fill="#333">射频链数 / 阵元</text>
    <text x="232" y="145" fill="#556">≈ 1 / N（全阵共用）</text>
    <text x="414" y="145" fill="#556">1（模拟 T/R）</text>
    <text x="596" y="145" fill="#556">1 / 子阵</text>
    <text x="778" y="145" fill="#556">1（数字 T/R）</text>

    <rect x="24" y="160" width="912" height="40" fill="#f7fbfc" stroke="#dbe6ea"/>
    <text x="36" y="185" font-weight="bold" fill="#333">同时多波束</text>
    <text x="232" y="185" fill="#8a3a6a">单波束</text>
    <text x="414" y="185" fill="#8a3a6a">少量（~3）</text>
    <text x="596" y="185" fill="#4a7a3a">N_RF 个</text>
    <text x="778" y="185" fill="#4a7a3a">任意多</text>

    <rect x="24" y="200" width="912" height="40" fill="#ffffff" stroke="#dbe6ea"/>
    <text x="36" y="225" font-weight="bold" fill="#333">发射效率</text>
    <text x="232" y="225" fill="#c96a1f">低（功分损耗大）</text>
    <text x="414" y="225" fill="#4a7a3a">高（空间功率合成）</text>
    <text x="596" y="225" fill="#4a7a3a">高</text>
    <text x="778" y="225" fill="#4a7a3a">高</text>

    <rect x="24" y="240" width="912" height="40" fill="#f7fbfc" stroke="#dbe6ea"/>
    <text x="36" y="265" font-weight="bold" fill="#333">接收 NF</text>
    <text x="232" y="265" fill="#c96a1f">高（前段损耗）</text>
    <text x="414" y="265" fill="#4a7a3a">低（LNA 紧贴阵元）</text>
    <text x="596" y="265" fill="#4a7a3a">低</text>
    <text x="778" y="265" fill="#4a7a3a">低</text>

    <rect x="24" y="280" width="912" height="40" fill="#ffffff" stroke="#dbe6ea"/>
    <text x="36" y="305" font-weight="bold" fill="#333">自适应零陷</text>
    <text x="232" y="305" fill="#8a3a6a">几乎无</text>
    <text x="414" y="305" fill="#8a3a6a">很有限</text>
    <text x="596" y="305" fill="#c96a1f">子阵级、受限</text>
    <text x="778" y="305" fill="#4a7a3a">完整（阵元级）</text>

    <rect x="24" y="320" width="912" height="40" fill="#f7fbfc" stroke="#dbe6ea"/>
    <text x="36" y="345" font-weight="bold" fill="#333">波束斜视（宽带）</text>
    <text x="232" y="345" fill="#c96a1f">严重</text>
    <text x="414" y="345" fill="#c96a1f">严重</text>
    <text x="596" y="345" fill="#c96a1f">子阵内严重</text>
    <text x="778" y="345" fill="#4a7a3a">可用数字补偿</text>

    <rect x="24" y="360" width="912" height="40" fill="#ffffff" stroke="#dbe6ea"/>
    <text x="36" y="385" font-weight="bold" fill="#333">可靠性</text>
    <text x="232" y="385" fill="#8a3a6a">单点故障</text>
    <text x="414" y="385" fill="#4a7a3a">优雅降级</text>
    <text x="596" y="385" fill="#4a7a3a">优雅降级</text>
    <text x="778" y="385" fill="#4a7a3a">优雅降级</text>

    <rect x="24" y="400" width="912" height="40" fill="#f7fbfc" stroke="#dbe6ea"/>
    <text x="36" y="425" font-weight="bold" fill="#333">功耗 / 成本</text>
    <text x="232" y="425" fill="#4a7a3a">最低</text>
    <text x="414" y="425" fill="#c96a1f">中</text>
    <text x="596" y="425" fill="#c96a1f">中（随 N_RF 上升）</text>
    <text x="778" y="425" fill="#8a3a6a">最高</text>
  </g>

  <rect x="24" y="452" width="912" height="68" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.4"/>
  <text x="42" y="476" font-size="12" font-weight="bold" fill="#0f7a8a">怎么读这张表</text>
  <text x="42" y="498" font-size="11.5" fill="#333">如果"多波束 / 零陷"是你的硬指标 → 混合起步，向全数字推进；如果"成本与体积"是硬约束 → AESA 仍是性价比最优解。</text>
  <text x="42" y="514" font-size="11.5" fill="#667">PESA 在今天的新设计里已很少见，但理解它有助于明白"为什么 AESA 是一次架构跃迁"。</text>
</svg>
