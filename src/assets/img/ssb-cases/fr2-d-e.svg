<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="FR2 Case D and E">
  <rect width="960" height="500" rx="18" fill="#f3f7f9"/>
  <text x="40" y="42" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">FR2 - Case D / Case E</text>
  <text x="40" y="70" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Higher SCS, denser candidate grid, Lmax up to 64 for more beams</text>

  <rect x="40" y="100" width="430" height="280" rx="14" fill="#fff" stroke="#1f3a4d" stroke-width="2"/>
  <text x="255" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1f3a4d">Case D - 120 kHz</text>
  <text x="255" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Pattern family: {4,8,16,20}+28n</text>
  <text x="255" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#0b1c28">Lmax = 64</text>
  <text x="255" y="250" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Many n values selected</text>
  <text x="255" y="280" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">to pack beams in 5 ms</text>
  <text x="255" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#0a5561">Typical mmWave SSB SCS</text>

  <rect x="490" y="100" width="430" height="280" rx="14" fill="#fff" stroke="#8a5a14" stroke-width="2"/>
  <text x="705" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#8a5a14">Case E - 240 kHz</text>
  <text x="705" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">{8,12,16,20,32,36,40,44}+56n</text>
  <text x="705" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#0b1c28">Lmax = 64</text>
  <text x="705" y="250" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Even denser symbol grid</text>
  <text x="705" y="280" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Shorter symbol duration</text>
  <text x="705" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#8a5a14">More SSBs fit in time</text>

  <rect x="40" y="410" width="880" height="60" rx="12" fill="#fff4e6" stroke="#c9852c"/>
  <text x="480" y="447" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">FR2 needs more beams - larger Lmax; Cases define where those beams can be placed.</text>
</svg>
