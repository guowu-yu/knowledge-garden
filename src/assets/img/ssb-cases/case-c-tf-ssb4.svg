<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="Case C time-frequency grid for SSB count 4">
  <rect width="960" height="580" rx="18" fill="#eef5f7"/>
  <text x="40" y="38" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0b1c28">Case C time-frequency sketch (example: SSB count = 4)</text>
  <text x="40" y="62" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">100 MHz / 273 PRB @ 30 kHz. Vertical = PRB, Horizontal = OFDM symbol in half-frame.</text>

  <!-- axes -->
  <line x1="120" y1="480" x2="880" y2="480" stroke="#0a5561" stroke-width="2"/>
  <line x1="120" y1="480" x2="120" y2="100" stroke="#0a5561" stroke-width="2"/>
  <text x="500" y="520" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#0a5561">OFDM symbol (half-frame)</text>
  <text x="40" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#0a5561" transform="rotate(-90 40 300)">PRB</text>

  <!-- carrier band background -->
  <rect x="120" y="110" width="740" height="360" fill="#dfeaf0" stroke="#9bb8c2"/>

  <!-- SSB frequency strip ~20/273 of height -->
  <rect x="120" y="250" width="740" height="40" fill="#f7e7cf" stroke="#c9852c" stroke-dasharray="4 3"/>
  <text x="900" y="275" font-family="Segoe UI, sans-serif" font-size="11" fill="#8a5a14">20 RB</text>

  <!-- 4 SSB blocks at symbols ~2,8,16,22 -->
  <!-- map symbols 0..56 to x 120..860 -->
  <!-- x = 120 + sym * (740/56) -->
  <!-- sym2: 146, sym8: 225, sym16: 331, sym22: 410 ; width 4 symbols ~ 53 -->
  <rect x="146" y="250" width="53" height="40" rx="3" fill="#0f7a8a"/>
  <text x="172" y="275" text-anchor="middle" font-size="11" fill="#fff" font-family="Segoe UI, sans-serif">#0</text>
  <rect x="225" y="250" width="53" height="40" rx="3" fill="#0f7a8a"/>
  <text x="251" y="275" text-anchor="middle" font-size="11" fill="#fff" font-family="Segoe UI, sans-serif">#1</text>
  <rect x="331" y="250" width="53" height="40" rx="3" fill="#c9852c"/>
  <text x="357" y="275" text-anchor="middle" font-size="11" fill="#fff" font-family="Segoe UI, sans-serif">#2</text>
  <rect x="410" y="250" width="53" height="40" rx="3" fill="#c9852c"/>
  <text x="436" y="275" text-anchor="middle" font-size="11" fill="#fff" font-family="Segoe UI, sans-serif">#3</text>

  <text x="172" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#0a5561">sym2</text>
  <text x="251" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#0a5561">sym8</text>
  <text x="357" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#0a5561">sym16</text>
  <text x="436" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#0a5561">sym22</text>

  <text x="130" y="130" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">PRB 272</text>
  <text x="130" y="470" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">PRB 0</text>

  <rect x="560" y="120" width="280" height="100" rx="10" fill="#fff" stroke="#d0dde3"/>
  <text x="580" y="150" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0b1c28">Same for 2/6/8</text>
  <text x="580" y="175" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">Frequency strip stays 20 RB.</text>
  <text x="580" y="198" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">Only the number of time</text>
  <text x="580" y="216" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">blocks changes (2/4/6/8).</text>
</svg>
