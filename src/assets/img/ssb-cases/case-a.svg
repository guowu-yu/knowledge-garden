<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Case A SSB positions">
  <rect width="960" height="560" rx="18" fill="#eef5f7"/>
  <text x="40" y="42" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Case A - SSB positions (15 kHz)</text>
  <text x="40" y="70" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Half-frame = 5 ms. First symbol of each SSB: {2, 8} + 14n</text>

  <line x1="80" y1="200" x2="900" y2="200" stroke="#0a5561" stroke-width="2"/>
  <text x="490" y="240" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#0a5561">OFDM symbol index in half-frame (schematic)</text>

  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">
    <rect x="100" y="120" width="168" height="60" fill="#d9e8ef" stroke="#9bb8c2"/>
    <text x="184" y="155" text-anchor="middle">slot n=0</text>
    <rect x="268" y="120" width="168" height="60" fill="#e7eef2" stroke="#9bb8c2"/>
    <text x="352" y="155" text-anchor="middle">slot n=1</text>
    <rect x="436" y="120" width="168" height="60" fill="#d9e8ef" stroke="#9bb8c2"/>
    <text x="520" y="155" text-anchor="middle">slot n=2</text>
    <rect x="604" y="120" width="168" height="60" fill="#e7eef2" stroke="#9bb8c2"/>
    <text x="688" y="155" text-anchor="middle">slot n=3</text>
  </g>

  <g>
    <rect x="124" y="130" width="48" height="40" rx="4" fill="#0f7a8a"/>
    <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#fff">SSB0</text>
    <text x="148" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0a5561">sym 2</text>

    <rect x="196" y="130" width="48" height="40" rx="4" fill="#0f7a8a"/>
    <text x="220" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#fff">SSB1</text>
    <text x="220" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0a5561">sym 8</text>

    <rect x="292" y="130" width="48" height="40" rx="4" fill="#c9852c"/>
    <text x="316" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#fff">SSB2</text>
    <text x="316" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#8a5a14">sym 16</text>

    <rect x="364" y="130" width="48" height="40" rx="4" fill="#c9852c"/>
    <text x="388" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#fff">SSB3</text>
    <text x="388" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#8a5a14">sym 22</text>
  </g>

  <text x="40" y="290" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">Lmax = 4 (above) vs Lmax = 8 (more candidates)</text>
  <rect x="40" y="310" width="880" height="100" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="345" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Lmax=4 first symbols: 2, 8, 16, 22</text>
  <text x="60" y="375" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Lmax=8 first symbols: 2, 8, 16, 22, 30, 36, 44, 50</text>
  <text x="60" y="400" font-family="Segoe UI, sans-serif" font-size="13" fill="#0a5561">Each SSB occupies 4 consecutive OFDM symbols starting at that index.</text>

  <rect x="40" y="440" width="880" height="80" rx="12" fill="#fff4e6" stroke="#c9852c"/>
  <text x="60" y="475" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a5a14">Memory tip</text>
  <text x="60" y="500" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Case A/C share the same index pattern {2,8}+14n - differ by SCS (15 vs 30 kHz).</text>
</svg>
