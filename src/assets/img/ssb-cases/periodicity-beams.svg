<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="SSB burst set and periodicity">
  <rect width="960" height="560" rx="18" fill="#eef5f7"/>
  <text x="40" y="42" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">SSB burst set &amp; periodicity</text>
  <text x="40" y="70" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Candidates sit in a half-frame; actual sent SSBs may be a subset (beam sweep)</text>

  <!-- 20ms period -->
  <text x="40" y="115" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0a5561">Example: 20 ms SSB period (common default)</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="60" y="140" width="200" height="70" rx="8" fill="#0f7a8a"/>
    <text x="160" y="170" text-anchor="middle" font-size="14" fill="#fff">half-frame</text>
    <text x="160" y="195" text-anchor="middle" font-size="12" fill="#e7f3f7">SSB burst set</text>

    <rect x="280" y="140" width="200" height="70" rx="8" fill="#d9e8ef" stroke="#9bb8c2"/>
    <text x="380" y="182" text-anchor="middle" font-size="13" fill="#1f3a4d">no SSB</text>

    <rect x="500" y="140" width="200" height="70" rx="8" fill="#0f7a8a"/>
    <text x="600" y="170" text-anchor="middle" font-size="14" fill="#fff">half-frame</text>
    <text x="600" y="195" text-anchor="middle" font-size="12" fill="#e7f3f7">SSB burst set</text>

    <rect x="720" y="140" width="160" height="70" rx="8" fill="#d9e8ef" stroke="#9bb8c2"/>
    <text x="800" y="182" text-anchor="middle" font-size="13" fill="#1f3a4d">...</text>
  </g>

  <line x1="60" y1="240" x2="880" y2="240" stroke="#0a5561" stroke-width="2"/>
  <text x="160" y="265" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#0a5561">0 ms</text>
  <text x="380" y="265" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#0a5561">10 ms</text>
  <text x="600" y="265" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#0a5561">20 ms</text>

  <!-- beams -->
  <rect x="40" y="300" width="880" height="210" rx="14" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">Inside one burst set: beam sweeping</text>
  <text x="60" y="370" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Different SSB indices can use different beams (same cell ID, different spatial direction).</text>

  <g font-family="Segoe UI, sans-serif" font-size="12">
    <rect x="80" y="400" width="90" height="70" rx="8" fill="#0f7a8a"/><text x="125" y="430" text-anchor="middle" fill="#fff">SSB #0</text><text x="125" y="452" text-anchor="middle" fill="#e7f3f7">beam 0</text>
    <rect x="190" y="400" width="90" height="70" rx="8" fill="#1a8f9e"/><text x="235" y="430" text-anchor="middle" fill="#fff">SSB #1</text><text x="235" y="452" text-anchor="middle" fill="#e7f3f7">beam 1</text>
    <rect x="300" y="400" width="90" height="70" rx="8" fill="#0a5561"/><text x="345" y="430" text-anchor="middle" fill="#fff">SSB #2</text><text x="345" y="452" text-anchor="middle" fill="#e7f3f7">beam 2</text>
    <rect x="410" y="400" width="90" height="70" rx="8" fill="#c9852c"/><text x="455" y="430" text-anchor="middle" fill="#fff">SSB #3</text><text x="455" y="452" text-anchor="middle" fill="#fff">beam 3</text>
    <text x="560" y="440" fill="#1f3a4d">UE measures &amp; picks</text>
    <text x="560" y="462" fill="#1f3a4d">the strongest SSB / beam</text>
  </g>
</svg>
