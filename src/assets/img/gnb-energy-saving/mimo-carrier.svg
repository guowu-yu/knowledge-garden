<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="通道与载波关断">
  <rect width="1000" height="360" rx="18" fill="#eef5f7"/>
  <text x="40" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">通道关断与载波关断</text>
  <rect x="40" y="70" width="420" height="130" rx="12" fill="#0f7a8a"/>
  <text x="260" y="100" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#fff">通道 / MIMO 关断</text>
  <text x="60" y="130" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">64T64R 降到 32T 或更少层发射</text>
  <text x="60" y="155" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">低阶 MIMO、关部分天线面板</text>
  <text x="60" y="180" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">负载升高再恢复全通道</text>
  <rect x="500" y="70" width="420" height="130" rx="12" fill="#c9852c"/>
  <text x="710" y="100" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#fff">载波关断（CA）</text>
  <text x="520" y="130" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fff">PCell 锚定载波保持</text>
  <text x="520" y="155" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fff">SCell / 辅载波深夜关掉</text>
  <text x="520" y="180" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fff">与 SCell dormancy 协同</text>
  <rect x="40" y="220" width="920" height="100" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="255" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">例子：商场白天 4 载波 CA，凌晨只留 n78 主载波，n41 辅载波关断</text>
  <text x="60" y="285" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">风险：唤醒需时间，突发流量要预测或快速激活策略</text>
</svg>