<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="节电时间尺度">
  <rect width="1000" height="380" rx="18" fill="#eef5f7"/>
  <text x="40" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">节电手段按时间尺度</text>
  <rect x="40" y="70" width="200" height="90" rx="10" fill="#0f7a8a"/>
  <text x="140" y="100" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">符号级</text>
  <text x="140" y="125" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">符号关断 / muting</text>
  <text x="140" y="150" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">微睡眠 micro sleep</text>
  <rect x="260" y="70" width="200" height="90" rx="10" fill="#1a8f9e"/>
  <text x="360" y="100" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">时隙级</text>
  <text x="360" y="125" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">Cell DTX</text>
  <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">无调度则不发射</text>
  <rect x="520" y="70" width="200" height="90" rx="10" fill="#c9852c"/>
  <text x="620" y="100" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">载波级</text>
  <text x="620" y="125" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#fff">载波关断</text>
  <text x="620" y="150" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#fff">CA 辅载波休眠</text>
  <rect x="740" y="70" width="200" height="90" rx="10" fill="#1f3a4d"/>
  <text x="840" y="100" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">小区级</text>
  <text x="840" y="125" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">小区睡眠</text>
  <text x="840" y="150" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#e7f3f7">轻睡 / 深睡</text>
  <rect x="40" y="200" width="920" height="150" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="235" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">越深睡眠 = 省电越多，但唤醒越慢</text>
  <text x="60" y="265" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">微睡眠：符号间隙，唤醒极快</text>
  <text x="60" y="295" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">轻睡眠：短时无业务，关部分射频通道</text>
  <text x="60" y="325" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">深睡眠：小区/载波整段关掉，需 Xn 协调唤醒</text>
</svg>