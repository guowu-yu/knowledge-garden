<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="SSB与系统信息自适应">
  <rect width="1000" height="360" rx="18" fill="#eef5f7"/>
  <text x="40" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">常发信号精简：SSB / SIB / CSI-RS</text>
  <rect x="40" y="70" width="280" height="100" rx="10" fill="#0f7a8a"/>
  <text x="160" y="100" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">SSB 周期扩展</text>
  <text x="60" y="130" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">低负载时拉长 SSB 周期</text>
  <text x="60" y="155" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">按需 SSB（Rel-17+）</text>
  <rect x="360" y="70" width="280" height="100" rx="10" fill="#1a8f9e"/>
  <text x="480" y="100" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">按需 SIB1</text>
  <text x="380" y="130" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">UE 上行唤醒请求 SIB1</text>
  <text x="380" y="155" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">减少周期广播 SI</text>
  <rect x="680" y="70" width="280" height="100" rx="10" fill="#c9852c"/>
  <text x="800" y="100" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">CSI-RS 精简</text>
  <text x="700" y="130" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fff">降低周期 / 关波束 TRS</text>
  <text x="700" y="155" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fff">SCell 无 SSB（Rel-18+）</text>
  <rect x="40" y="200" width="920" height="120" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="235" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">矛盾：常发信号保障接入与移动性，但也是零业务时耗电主因之一</text>
  <text x="60" y="265" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">折中：保证覆盖层常发，容量层/辅载波按需发；Inactive 寻呼可限波束集</text>
  <text x="60" y="305" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">相关专题：[帧结构 SSB](frame-structure-ssb.html)、[NR CSI-RS](nr-csi-rs.html)</text>
</svg>