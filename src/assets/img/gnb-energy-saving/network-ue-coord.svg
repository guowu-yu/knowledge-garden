  <text x="60" y="285" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">gNB 配长 DRX + 深夜载波关断：UE 少醒、基站少发</text>
  <text x="60" y="315" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">UE Assistance：上报偏好带宽/层数，gNB 降 MIMO 与 BWP</text>
  <text x="60" y="355" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f3a4d">本篇主线是 gNB/小区；UE 细节见 ShareTechnote Power Saving</text>
</svg>