<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="网端与终端协同节电">
  <rect width="1000" height="400" rx="18" fill="#eef5f7"/>
  <text x="40" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">网端节电与 UE 配置协同</text>
  <rect x="40" y="70" width="440" height="140" rx="12" fill="#1f3a4d"/>
  <text x="260" y="100" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#fff">gNB 侧 NES</text>
  <text x="60" y="130" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">DTX、载波/小区睡眠、SSB 自适应</text>
  <text x="60" y="155" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">SON/AI 负载预测开关</text>
  <text x="60" y="180" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">Xn 邻站协调唤醒</text>
  <rect x="520" y="70" width="440" height="140" rx="12" fill="#0f7a8a"/>
  <text x="740" y="100" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#fff">网络配置的 UE 节电</text>
  <text x="540" y="130" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">C-DRX / WUS：少监听 PDCCH</text>
  <text x="540" y="155" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">BWP 切换、SCell dormancy</text>
  <text x="540" y="180" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e7f3f7">gNB 调度减少 = 双方都省</text>
  <rect x="40" y="220" width="920" height="150" rx="12" fill="#fff" stroke="#d0dde3"/>
