<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="LEO 过顶多普勒变化">
  <rect width="760" height="340" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">LEO 一次过顶的多普勒频移变化（示意，S 波段量级）</text>
  <line x1="80" y1="290" x2="710" y2="290" stroke="#8a99a8" stroke-width="1.2"/>
  <line x1="80" y1="60" x2="80" y2="290" stroke="#8a99a8" stroke-width="1.2"/>
  <text x="710" y="312" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">时间 →（卫星过顶过程）</text>
  <text x="70" y="66" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">+f</text>
  <text x="70" y="294" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">−f</text>
  <text x="72" y="180" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">0</text>
  <line x1="80" y1="176" x2="710" y2="176" stroke="#c3ced6" stroke-width="1.2" stroke-dasharray="6 5"/>
  <path d="M80,88 C200,94 300,134 380,176 C460,218 560,258 710,266" fill="none" stroke="#c9852c" stroke-width="2.6"/>
  <circle cx="80" cy="88" r="4.5" fill="#c9852c"/>
  <circle cx="380" cy="176" r="4.5" fill="#0f7a8a"/>
  <circle cx="710" cy="266" r="4.5" fill="#c9852c"/>
  <text x="96" y="76" font-family="Segoe UI, sans-serif" font-size="12" fill="#a9681f">接近（低仰角）：正频偏最大</text>
  <text x="380" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#0a5561">过顶（高仰角）：频偏过零</text>
  <text x="700" y="252" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="12" fill="#a9681f">远离：负频偏</text>
  <text x="380" y="336" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#8a99a8">低仰角（接近） → 高仰角（过顶） → 低仰角（远离）</text>
</svg>
