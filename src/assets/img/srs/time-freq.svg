<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="SRS time frequency">
  <rect width="960" height="480" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">SRS time-frequency sketch</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Symbols near slot end + comb in frequency</text>

  <!-- time axis slot -->
  <rect x="60" y="110" width="880" height="70" rx="8" fill="#d9e8ef"/>
  <text x="70" y="140" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">1 slot (14 symbols)</text>
  <rect x="80" y="150" width="520" height="18" fill="#9bb8c4"/>
  <text x="300" y="163" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0b1c28">data / other UL</text>
  <rect x="620" y="150" width="280" height="18" fill="#0f7a8a"/>
  <text x="760" y="163" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#fff">SRS symbol(s)</text>
  <text x="760" y="195" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">startPosition / nrofSymbols / repetition</text>

  <!-- comb grid -->
  <text x="60" y="250" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0b1c28">Comb example (comb-4)</text>
  <g font-family="Segoe UI, sans-serif" font-size="11">
    <!-- 16 subcarriers sketch -->
    <rect x="60" y="270" width="40" height="28" fill="#0f7a8a"/><text x="80" y="288" text-anchor="middle" fill="#fff">S</text>
    <rect x="105" y="270" width="40" height="28" fill="#d9e8ef"/><text x="125" y="288" text-anchor="middle" fill="#1f3a4d">-</text>
    <rect x="150" y="270" width="40" height="28" fill="#d9e8ef"/><text x="170" y="288" text-anchor="middle" fill="#1f3a4d">-</text>
    <rect x="195" y="270" width="40" height="28" fill="#d9e8ef"/><text x="215" y="288" text-anchor="middle" fill="#1f3a4d">-</text>
    <rect x="240" y="270" width="40" height="28" fill="#0f7a8a"/><text x="260" y="288" text-anchor="middle" fill="#fff">S</text>
    <rect x="285" y="270" width="40" height="28" fill="#d9e8ef"/><text x="305" y="288" text-anchor="middle" fill="#1f3a4d">-</text>
    <rect x="330" y="270" width="40" height="28" fill="#d9e8ef"/><text x="350" y="288" text-anchor="middle" fill="#1f3a4d">-</text>
    <rect x="375" y="270" width="40" height="28" fill="#d9e8ef"/><text x="395" y="288" text-anchor="middle" fill="#1f3a4d">-</text>
    <rect x="420" y="270" width="40" height="28" fill="#0f7a8a"/><text x="440" y="288" text-anchor="middle" fill="#fff">S</text>
    <rect x="465" y="270" width="40" height="28" fill="#d9e8ef"/><text x="485" y="288" text-anchor="middle" fill="#1f3a4d">-</text>
    <rect x="510" y="270" width="40" height="28" fill="#d9e8ef"/><text x="530" y="288" text-anchor="middle" fill="#1f3a4d">-</text>
    <rect x="555" y="270" width="40" height="28" fill="#d9e8ef"/><text x="575" y="288" text-anchor="middle" fill="#1f3a4d">-</text>
  </g>
  <text x="60" y="330" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">transmissionComb = 4, combOffset chooses which "teeth"</text>
  <text x="60" y="355" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Multiple UEs can share same symbol via different combOffset / cyclicShift</text>

  <rect x="60" y="385" width="840" height="60" rx="10" fill="#1f3a4d"/>
  <text x="80" y="420" font-family="Segoe UI, sans-serif" font-size="14" fill="#e7f3f7">Bandwidth: freqDomainShift + c-SRS / B-SRS / b-hop  --&gt; which RBs are sounded (+ hopping)</text>
</svg>
