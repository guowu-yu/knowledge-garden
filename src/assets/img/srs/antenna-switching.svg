<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="SRS antenna switching">
  <rect width="960" height="460" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Antenna switching (example 1T4R)</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">UE has 4 Rx antennas but only 1 Tx chain --&gt; sound them across multiple SRS occasions</text>

  <rect x="40" y="100" width="140" height="280" rx="12" fill="#1f3a4d"/>
  <text x="110" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">UE ants</text>
  <text x="110" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">Ant0</text>
  <text x="110" y="225" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">Ant1</text>
  <text x="110" y="265" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">Ant2</text>
  <text x="110" y="305" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">Ant3</text>

  <rect x="220" y="110" width="160" height="60" rx="10" fill="#0f7a8a"/>
  <text x="300" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">SRS occ. 1: Ant0</text>
  <rect x="220" y="185" width="160" height="60" rx="10" fill="#0f7a8a"/>
  <text x="300" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">SRS occ. 2: Ant1</text>
  <rect x="220" y="260" width="160" height="60" rx="10" fill="#0f7a8a"/>
  <text x="300" y="295" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">SRS occ. 3: Ant2</text>
  <rect x="220" y="335" width="160" height="60" rx="10" fill="#0f7a8a"/>
  <text x="300" y="370" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">SRS occ. 4: Ant3</text>

  <path d="M400 140 H470" stroke="#c9852c" stroke-width="3"/>
  <path d="M400 215 H470" stroke="#c9852c" stroke-width="3"/>
  <path d="M400 290 H470" stroke="#c9852c" stroke-width="3"/>
  <path d="M400 365 H470" stroke="#c9852c" stroke-width="3"/>

  <rect x="480" y="130" width="420" height="250" rx="14" fill="#c9852c"/>
  <text x="690" y="175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">gNB builds full channel</text>
  <text x="510" y="220" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">H from all 4 Rx antennas</text>
  <text x="510" y="255" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">(via TDD reciprocity)</text>
  <text x="510" y="290" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">better DL precoding / beam</text>
  <text x="510" y="325" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">without UE reporting PMI</text>

  <text x="40" y="430" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Needs guard/switching time; UE capability reports supported switching options.</text>
</svg>
