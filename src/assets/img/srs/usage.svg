<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="SRS usage types">
  <rect width="960" height="440" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">SRS usage (resource set)</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">usage field tells why this SRS set exists</text>

  <rect x="40" y="100" width="210" height="260" rx="14" fill="#0f7a8a"/>
  <text x="145" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fff">beamManagement</text>
  <text x="55" y="185" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">UL beam sweep</text>
  <text x="55" y="215" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">often wideband</text>
  <text x="55" y="245" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">few ports</text>

  <rect x="270" y="100" width="210" height="260" rx="14" fill="#c9852c"/>
  <text x="375" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fff">codebook</text>
  <text x="285" y="185" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">UL MIMO codebook</text>
  <text x="285" y="215" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">gNB picks TPMI</text>
  <text x="285" y="245" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">ports = Tx layers feel</text>

  <rect x="500" y="100" width="210" height="260" rx="14" fill="#1f3a4d"/>
  <text x="605" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fff">nonCodebook</text>
  <text x="515" y="185" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">UE precodes SRS</text>
  <text x="515" y="215" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">gNB selects SRI</text>
  <text x="515" y="245" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">PUSCH follows</text>

  <rect x="730" y="100" width="190" height="260" rx="14" fill="#0a5561"/>
  <text x="825" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">antennaSwitching</text>
  <text x="745" y="185" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">sound more Rx</text>
  <text x="745" y="215" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">antennas over time</text>
  <text x="745" y="245" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">TDD reciprocity</text>

  <text x="40" y="410" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Same waveform family; different scheduling / port / association rules.</text>
</svg>
