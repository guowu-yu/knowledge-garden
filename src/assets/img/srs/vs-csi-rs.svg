<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="SRS vs CSI-RS">
  <rect width="960" height="400" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">SRS vs CSI-RS</text>

  <rect x="40" y="80" width="420" height="260" rx="14" fill="#0f7a8a"/>
  <text x="250" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#fff">SRS (UL)</text>
  <text x="70" y="165" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Transmitter: UE</text>
  <text x="70" y="195" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Receiver: gNB</text>
  <text x="70" y="225" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Goal: UL sounding / reciprocity</text>
  <text x="70" y="255" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Report: usually none (gNB uses locally)</text>
  <text x="70" y="285" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Config: srs-Config + DCI trigger</text>

  <rect x="500" y="80" width="420" height="260" rx="14" fill="#c9852c"/>
  <text x="710" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#fff">CSI-RS (DL)</text>
  <text x="530" y="165" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Transmitter: gNB</text>
  <text x="530" y="195" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Receiver: UE</text>
  <text x="530" y="225" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Goal: DL CSI / beam / TRS</text>
  <text x="530" y="255" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Report: UCI (CQI/PMI/RI/...)</text>
  <text x="530" y="285" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Config: csi-MeasConfig</text>

  <text x="40" y="375" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">TDD often pairs them: SRS for UL CSI + reciprocity DL; CSI-RS for explicit DL CSI.</text>
</svg>
