<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="CORESET vs Search Space">
  <rect width="960" height="420" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">CORESET vs Search Space</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Where PDCCH lives  vs  When / how UE looks for it</text>

  <rect x="40" y="100" width="400" height="220" rx="14" fill="#0f7a8a"/>
  <text x="240" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#fff">CORESET</text>
  <text x="240" y="175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#e7f3f7">Control Resource Set</text>
  <text x="70" y="215" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">- Frequency: which RBs</text>
  <text x="70" y="245" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">- Time: 1 / 2 / 3 OFDM symbols</text>
  <text x="70" y="275" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">- REG / CCE mapping, TCI...</text>

  <rect x="520" y="100" width="400" height="220" rx="14" fill="#c9852c"/>
  <text x="720" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#fff">Search Space</text>
  <text x="720" y="175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Monitoring occasions</text>
  <text x="550" y="215" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">- Which CORESET to use</text>
  <text x="550" y="245" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">- Which slots / symbols</text>
  <text x="550" y="275" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">- Candidates, DCI formats...</text>

  <path d="M450 210 H510" stroke="#1f3a4d" stroke-width="3" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f3a4d"/>
    </marker>
  </defs>
  <text x="480" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">binds to</text>

  <text x="40" y="370" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">One-liner: CORESET = stage; Search Space = showtimes + ticket types (candidates / RNTI / DCI)</text>
</svg>
