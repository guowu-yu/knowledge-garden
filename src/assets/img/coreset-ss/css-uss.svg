<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="CSS vs USS">
  <rect width="960" height="400" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Common vs UE-specific Search Space</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Same CORESET can host different Search Spaces; purpose differs by RNTI / use</text>

  <rect x="40" y="110" width="420" height="230" rx="14" fill="#0f7a8a"/>
  <text x="250" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#fff">CSS (common)</text>
  <text x="70" y="200" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Type0  : SIB1 (SI-RNTI)</text>
  <text x="70" y="230" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Type0A : other SI</text>
  <text x="70" y="260" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Type1  : RAR (RA-RNTI / MsgB)</text>
  <text x="70" y="290" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Type2  : Paging (P-RNTI)</text>
  <text x="70" y="320" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Type3  : other common (e.g. INT/SFI...)</text>

  <rect x="500" y="110" width="420" height="230" rx="14" fill="#c9852c"/>
  <text x="710" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#fff">USS (UE-specific)</text>
  <text x="530" y="210" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Configured per UE (RRC)</text>
  <text x="530" y="245" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Typically C-RNTI / CS-RNTI...</text>
  <text x="530" y="280" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">DL/UL scheduling DCI for that UE</text>
  <text x="530" y="315" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Candidate set sized for that UE</text>
</svg>
