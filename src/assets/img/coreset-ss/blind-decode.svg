<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="PDCCH blind decode flow">
  <rect width="960" height="460" rx="18" fill="#f3f7f9"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Blind decoding intuition</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">UE does not know which candidate / aggregation holds its DCI until CRC matches RNTI</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="40" y="110" width="160" height="70" rx="10" fill="#0f7a8a"/>
    <text x="120" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MO arrives</text>

    <path d="M210 145 H250" stroke="#1f3a4d" stroke-width="3"/>
    <rect x="260" y="110" width="180" height="70" rx="10" fill="#1a8f9e"/>
    <text x="350" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Build candidates</text>
    <text x="350" y="165" text-anchor="middle" font-size="11" fill="#e7f3f7">AL x starting CCE</text>

    <path d="M450 145 H490" stroke="#1f3a4d" stroke-width="3"/>
    <rect x="500" y="110" width="180" height="70" rx="10" fill="#0a5561"/>
    <text x="590" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Decode + CRC</text>
    <text x="590" y="165" text-anchor="middle" font-size="11" fill="#e7f3f7">try DCI formats</text>

    <path d="M690 145 H730" stroke="#1f3a4d" stroke-width="3"/>
    <rect x="740" y="110" width="180" height="70" rx="10" fill="#c9852c"/>
    <text x="830" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">RNTI match?</text>
  </g>

  <rect x="40" y="230" width="880" height="180" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="270" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">Why "blind"</text>
  <text x="60" y="305" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">1) Network can place DCI on different AL / candidate without telling UE in advance</text>
  <text x="60" y="335" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">2) Search Space lists how many candidates per AL; UE tries until CRC+RNTI succeeds or exhausted</text>
  <text x="60" y="365" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">3) BD budget is limited (UE capability / slot) - over-configuring candidates costs power and complexity</text>
</svg>
