<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Type0-PDCCH CORESET0">
  <rect width="960" height="420" rx="18" fill="#f3f7f9"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Type0-PDCCH: CORESET#0 + SearchSpace#0</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Before RRC configures PDCCH, MIB indexes open the SIB1 door (TS 38.213)</text>

  <rect x="40" y="110" width="180" height="100" rx="12" fill="#0f7a8a"/>
  <text x="130" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">MIB</text>
  <text x="130" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7f3f7">pdcch-ConfigSIB1</text>

  <path d="M230 160 H290" stroke="#1f3a4d" stroke-width="3" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f3a4d"/>
    </marker>
  </defs>

  <rect x="300" y="100" width="260" height="120" rx="12" fill="#fff" stroke="#c9852c" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a5a14">Two 4-bit indexes</text>
  <text x="320" y="175" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">controlResourceSetZero</text>
  <text x="320" y="200" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">searchSpaceZero</text>

  <path d="M570 160 H630" stroke="#1f3a4d" stroke-width="3" marker-end="url(#a)"/>

  <rect x="640" y="90" width="280" height="140" rx="12" fill="#1f3a4d"/>
  <text x="780" y="135" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fff">Look up 38.213 tables</text>
  <text x="780" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">CORESET#0 RB / symbols / pattern</text>
  <text x="780" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">SS#0 monitoring occasions</text>

  <rect x="40" y="280" width="880" height="100" rx="12" fill="#fff" stroke="#0f7a8a" stroke-width="2"/>
  <text x="60" y="320" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a5561">Then UE monitors Type0-PDCCH with SI-RNTI (SIB1)</text>
  <text x="60" y="350" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">After SIB1 / RRC, more CORESET and Search Spaces can be configured (CSS + USS).</text>
</svg>
