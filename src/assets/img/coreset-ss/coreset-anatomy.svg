<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="CORESET anatomy">
  <rect width="960" height="520" rx="18" fill="#f3f7f9"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">CORESET anatomy (time-frequency)</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">RB set in frequency x duration in symbols = pool of REGs / CCEs</text>

  <!-- grid -->
  <rect x="80" y="110" width="560" height="280" rx="8" fill="#fff" stroke="#d0dde3"/>
  <text x="100" y="140" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">frequency (RB)</text>

  <!-- three symbol rows of coreset -->
  <g>
    <rect x="140" y="160" width="420" height="48" fill="#0f7a8a" opacity="0.9"/>
    <rect x="140" y="218" width="420" height="48" fill="#1a8f9e" opacity="0.9"/>
    <rect x="140" y="276" width="420" height="48" fill="#0a5561" opacity="0.9"/>
    <text x="350" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff" font-weight="700">symbol 0</text>
    <text x="350" y="248" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff" font-weight="700">symbol 1</text>
    <text x="350" y="306" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff" font-weight="700">symbol 2</text>
  </g>

  <!-- REG ticks -->
  <g stroke="#fff" stroke-width="1.5" opacity="0.7">
    <line x1="200" y1="160" x2="200" y2="324"/>
    <line x1="260" y1="160" x2="260" y2="324"/>
    <line x1="320" y1="160" x2="320" y2="324"/>
    <line x1="380" y1="160" x2="380" y2="324"/>
    <line x1="440" y1="160" x2="440" y2="324"/>
    <line x1="500" y1="160" x2="500" y2="324"/>
  </g>
  <text x="350" y="360" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">example: duration = 3 symbols, contiguous RBs in a BWP</text>

  <!-- side cards -->
  <rect x="680" y="120" width="240" height="90" rx="10" fill="#fff" stroke="#0f7a8a" stroke-width="2"/>
  <text x="800" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a5561">REG</text>
  <text x="800" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">1 RB x 1 symbol</text>

  <rect x="680" y="230" width="240" height="90" rx="10" fill="#fff" stroke="#c9852c" stroke-width="2"/>
  <text x="800" y="265" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a5a14">CCE</text>
  <text x="800" y="295" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">6 REGs (resource for PDCCH)</text>

  <rect x="680" y="340" width="240" height="90" rx="10" fill="#fff" stroke="#1f3a4d" stroke-width="2"/>
  <text x="800" y="375" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1f3a4d">Aggregation</text>
  <text x="800" y="405" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">L = 1/2/4/8/16 CCEs</text>

  <text x="40" y="470" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Also configured: cce-REG-MappingType (interleaved / non-interleaved), precoderGranularity, tci-StatesPDCCH...</text>
</svg>
