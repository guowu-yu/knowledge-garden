<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="UE cell search overview flow">
  <rect width="960" height="520" rx="18" fill="#eef5f7"/>
  <text x="40" y="42" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">UE power-on cell search (big picture)</text>
  <text x="40" y="70" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">From unknown RF world to a campable cell: sync first, then decode</text>

  <!-- flow boxes -->
  <g font-family="Segoe UI, sans-serif">
    <rect x="40" y="110" width="160" height="90" rx="12" fill="#0f7a8a"/>
    <text x="120" y="150" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">1. Power on</text>
    <text x="120" y="175" text-anchor="middle" font-size="12" fill="#e7f3f7">band / raster</text>

    <rect x="220" y="110" width="160" height="90" rx="12" fill="#1a8f9e"/>
    <text x="300" y="150" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">2. Find PSS</text>
    <text x="300" y="175" text-anchor="middle" font-size="12" fill="#e7f3f7">timing + NID2</text>

    <rect x="400" y="110" width="160" height="90" rx="12" fill="#0a5561"/>
    <text x="480" y="150" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">3. Detect SSS</text>
    <text x="480" y="175" text-anchor="middle" font-size="12" fill="#e7f3f7">NID1 + PCI</text>

    <rect x="580" y="110" width="160" height="90" rx="12" fill="#c9852c"/>
    <text x="660" y="150" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">4. Decode PBCH</text>
    <text x="660" y="175" text-anchor="middle" font-size="12" fill="#fff">MIB / SSB idx</text>

    <rect x="760" y="110" width="160" height="90" rx="12" fill="#8a5a14"/>
    <text x="840" y="150" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">5. Camp</text>
    <text x="840" y="175" text-anchor="middle" font-size="12" fill="#fff">SIB / attach</text>
  </g>

  <!-- arrows -->
  <g stroke="#1f3a4d" stroke-width="2" fill="#1f3a4d">
    <path d="M200 155 H216" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1f3a4d"/></marker>
  </defs>
  <path d="M200 155 H216 M380 155 H396 M560 155 H576 M740 155 H756" stroke="#1f3a4d" stroke-width="2"/>

  <rect x="40" y="240" width="880" height="230" rx="14" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="280" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0a5561">What "sync with gNB" really means</text>
  <text x="60" y="315" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">1) Frequency sync: lock to carrier / SSB SCS grid</text>
  <text x="60" y="345" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">2) Time sync: find OFDM symbol / slot / frame timing via SSB</text>
  <text x="60" y="375" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">3) Cell ID sync: know PCI = 3*NID1 + NID2</text>
  <text x="60" y="405" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">4) System info sync: read MIB, then SIB1 for access parameters</text>
  <text x="60" y="440" font-family="Segoe UI, sans-serif" font-size="13" fill="#8a5a14">Without 1-3, PBCH demod fails. Without MIB/SIB, UE cannot camp.</text>
</svg>
