<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="From cell search to camp">
  <rect width="960" height="520" rx="18" fill="#f3f7f9"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Search -&gt; SIB1 -&gt; camp / attach</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Cell search ends when UE can read system information and decide to camp</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="50" y="120" width="200" height="130" rx="12" fill="#0f7a8a"/>
    <text x="150" y="170" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">Cell search</text>
    <text x="150" y="200" text-anchor="middle" font-size="13" fill="#e7f3f7">PSS/SSS/PBCH</text>
    <text x="150" y="225" text-anchor="middle" font-size="13" fill="#e7f3f7">PCI + MIB</text>

    <rect x="280" y="120" width="200" height="130" rx="12" fill="#1a8f9e"/>
    <text x="380" y="170" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">CORESET#0</text>
    <text x="380" y="200" text-anchor="middle" font-size="13" fill="#e7f3f7">PDCCH for SIB1</text>
    <text x="380" y="225" text-anchor="middle" font-size="13" fill="#e7f3f7">from MIB config</text>

    <rect x="510" y="120" width="200" height="130" rx="12" fill="#c9852c"/>
    <text x="610" y="170" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">SIB1</text>
    <text x="610" y="200" text-anchor="middle" font-size="13" fill="#fff">PLMN / TAC</text>
    <text x="610" y="225" text-anchor="middle" font-size="13" fill="#fff">RACH / BWP</text>

    <rect x="740" y="120" width="180" height="130" rx="12" fill="#8a5a14"/>
    <text x="830" y="170" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">Camp</text>
    <text x="830" y="200" text-anchor="middle" font-size="13" fill="#fff">then RACH</text>
    <text x="830" y="225" text-anchor="middle" font-size="13" fill="#fff">/ registration</text>
  </g>

  <path d="M250 185 H276 M480 185 H506 M710 185 H736" stroke="#1f3a4d" stroke-width="2"/>

  <rect x="50" y="290" width="870" height="180" rx="14" fill="#fff" stroke="#d0dde3"/>
  <text x="70" y="330" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">Multi-SSB / multi-beam note</text>
  <text x="70" y="365" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">UE may detect several SSBs (different beams). It usually keeps the strongest</text>
  <text x="70" y="395" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">SSB measurement for camping and later uses that beam preference for access.</text>
  <text x="70" y="430" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">This links cell search to the SSB Cases topic (positions / Lmax / period).</text>
</svg>
