<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="RA-RNTI calculation">
  <rect width="960" height="520" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">RA-RNTI from the PRACH occasion</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">TS 38.321: same RO =&gt; same RA-RNTI =&gt; same Msg2 search key</text>

  <rect x="40" y="100" width="880" height="90" rx="12" fill="#1f3a4d"/>
  <text x="480" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">RA-RNTI = 1 + s_id + 14*t_id + 14*80*f_id + 14*80*8*ul_carrier_id</text>
  <text x="480" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7f3f7">four parameters uniquely encode the Msg1 RO (time / freq / SUL)</text>

  <g font-family="Segoe UI, sans-serif" font-size="13">
    <rect x="40" y="220" width="200" height="120" rx="10" fill="#0f7a8a"/>
    <text x="140" y="260" text-anchor="middle" fill="#fff" font-weight="700">s_id</text>
    <text x="140" y="290" text-anchor="middle" fill="#e7f3f7">first OFDM symbol</text>
    <text x="140" y="315" text-anchor="middle" fill="#e7f3f7">0 .. 13</text>

    <rect x="260" y="220" width="200" height="120" rx="10" fill="#1a8f9e"/>
    <text x="360" y="260" text-anchor="middle" fill="#fff" font-weight="700">t_id</text>
    <text x="360" y="290" text-anchor="middle" fill="#e7f3f7">first slot in SFN</text>
    <text x="360" y="315" text-anchor="middle" fill="#e7f3f7">0 .. 79</text>

    <rect x="480" y="220" width="200" height="120" rx="10" fill="#c9852c"/>
    <text x="580" y="260" text-anchor="middle" fill="#fff" font-weight="700">f_id</text>
    <text x="580" y="290" text-anchor="middle" fill="#fff">freq-domain RO idx</text>
    <text x="580" y="315" text-anchor="middle" fill="#fff">0 .. 7</text>

    <rect x="700" y="220" width="220" height="120" rx="10" fill="#8a5a14"/>
    <text x="810" y="260" text-anchor="middle" fill="#fff" font-weight="700">ul_carrier_id</text>
    <text x="810" y="290" text-anchor="middle" fill="#fff">0 = NUL</text>
    <text x="810" y="315" text-anchor="middle" fill="#fff">1 = SUL</text>
  </g>

  <rect x="40" y="370" width="880" height="110" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="410" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">Why it matters</text>
  <text x="60" y="440" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">UE and gNB both compute the same RA-RNTI from the RO used by Msg1, then meet on Type1-PDCCH.</text>
  <text x="60" y="465" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Preamble index is NOT in RA-RNTI; RAPID inside RAR payload disambiguates which preamble.</text>
</svg>
