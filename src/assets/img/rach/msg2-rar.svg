<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Msg2 RAR contents">
  <rect width="960" height="500" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Msg2 RAR: what UE must extract</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">PDCCH (RA-RNTI) schedules PDSCH carrying MAC RAR(s)</text>

  <rect x="40" y="110" width="880" height="70" rx="10" fill="#1f3a4d"/>
  <text x="480" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">Type1-PDCCH CSS  --  DCI with RA-RNTI  --  PDSCH = MAC PDU with RAR</text>

  <g font-family="Segoe UI, sans-serif" font-size="13">
    <rect x="40" y="210" width="200" height="110" rx="10" fill="#0f7a8a"/>
    <text x="140" y="255" text-anchor="middle" fill="#fff" font-weight="700">RAPID</text>
    <text x="140" y="285" text-anchor="middle" fill="#e7f3f7">matches Msg1 index?</text>

    <rect x="260" y="210" width="200" height="110" rx="10" fill="#1a8f9e"/>
    <text x="360" y="255" text-anchor="middle" fill="#fff" font-weight="700">TA command</text>
    <text x="360" y="285" text-anchor="middle" fill="#e7f3f7">align UL timing</text>

    <rect x="480" y="210" width="200" height="110" rx="10" fill="#c9852c"/>
    <text x="580" y="255" text-anchor="middle" fill="#fff" font-weight="700">UL grant</text>
    <text x="580" y="285" text-anchor="middle" fill="#fff">for Msg3 PUSCH</text>

    <rect x="700" y="210" width="220" height="110" rx="10" fill="#8a5a14"/>
    <text x="810" y="255" text-anchor="middle" fill="#fff" font-weight="700">Temporary C-RNTI</text>
    <text x="810" y="285" text-anchor="middle" fill="#fff">until CR success</text>
  </g>

  <rect x="40" y="360" width="880" height="100" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="60" y="405" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">Window</text>
  <text x="60" y="435" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">UE monitors ra-ResponseWindow after Msg1; no matching RAR = retry with power ramp / new RO.</text>
</svg>
