<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="From MIB to SIB1 to other SI">
  <rect width="960" height="520" rx="18" fill="#f3f7f9"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Acquisition chain after cell search</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">PBCH/MIB opens the door; SIB1 is the lobby; other SIBs are the rooms</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="50" y="120" width="190" height="110" rx="12" fill="#0f7a8a"/>
    <text x="145" y="165" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">1. MIB</text>
    <text x="145" y="195" text-anchor="middle" font-size="12" fill="#e7f3f7">pdcch-ConfigSIB1</text>
    <text x="145" y="215" text-anchor="middle" font-size="12" fill="#e7f3f7">CORESET#0</text>

    <rect x="280" y="120" width="190" height="110" rx="12" fill="#1a8f9e"/>
    <text x="375" y="165" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">2. PDCCH</text>
    <text x="375" y="195" text-anchor="middle" font-size="12" fill="#e7f3f7">DCI schedules</text>
    <text x="375" y="215" text-anchor="middle" font-size="12" fill="#e7f3f7">SIB1 PDSCH</text>

    <rect x="510" y="120" width="190" height="110" rx="12" fill="#c9852c"/>
    <text x="605" y="165" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">3. SIB1</text>
    <text x="605" y="195" text-anchor="middle" font-size="12" fill="#fff">si-SchedulingInfo</text>
    <text x="605" y="215" text-anchor="middle" font-size="12" fill="#fff">cellAccessRelated</text>

    <rect x="740" y="120" width="170" height="110" rx="12" fill="#8a5a14"/>
    <text x="825" y="165" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">4. Other SI</text>
    <text x="825" y="195" text-anchor="middle" font-size="12" fill="#fff">SI windows</text>
    <text x="825" y="215" text-anchor="middle" font-size="12" fill="#fff">SIB2+</text>
  </g>

  <path d="M240 175 H276 M470 175 H506 M700 175 H736" stroke="#1f3a4d" stroke-width="2"/>

  <rect x="50" y="280" width="860" height="190" rx="14" fill="#fff" stroke="#d0dde3"/>
  <text x="70" y="320" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">UE checklist</text>
  <text x="70" y="355" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">1) Decode MIB from SSB/PBCH</text>
  <text x="70" y="385" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">2) Configure CORESET#0 / Type0-PDCCH CSS and get SIB1</text>
  <text x="70" y="415" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">3) Read SI scheduling in SIB1, then receive needed SIBs in SI windows</text>
  <text x="70" y="445" font-family="Segoe UI, sans-serif" font-size="14" fill="#0a5561">4) Some SIBs may be on-demand (request) instead of always broadcast</text>
</svg>
