<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="680" fill="#eef5f8"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">通道幅相校准：把 N 个"不一样"的通道拉成一副天线</text>
  <text x="480" y="61" text-anchor="middle" font-size="12" fill="#556">校准不是"调好一次"，而是"一直保持"——温度、老化、互耦都会让误差重新长出来</text>

  <!-- error sources -->
  <rect x="30" y="82" width="900" height="134" rx="11" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.8"/>
  <text x="52" y="106" font-size="13" font-weight="bold" fill="#0f7a8a">① 误差从哪来（为什么必须校准）</text>
  <g font-size="10.4" fill="#333">
    <rect x="52" y="118" width="212" height="84" rx="8" fill="#e4f3f5" stroke="#0f7a8a"/>
    <text x="68" y="140" font-weight="bold" fill="#0f7a8a">制造公差（静态）</text>
    <text x="68" y="160" font-size="10">阵元位置误差 · 馈线长度不等</text>
    <text x="68" y="178" font-size="10">器件本身的插入相位离散</text>
    <text x="68" y="196" font-size="10" fill="#0f7a8a">可一次校准，长期稳定</text>

    <rect x="282" y="118" width="212" height="84" rx="8" fill="#e4f3f5" stroke="#0f7a8a"/>
    <text x="298" y="140" font-weight="bold" fill="#0f7a8a">器件非理想（可建模）</text>
    <text x="298" y="160" font-size="10">移相器步进误差 / PM-AM 效应</text>
    <text x="298" y="178" font-size="10">衰减器精度 · 放大器非线性</text>
    <text x="298" y="196" font-size="10" fill="#0f7a8a">查表或多项式补偿</text>

    <rect x="512" y="118" width="212" height="84" rx="8" fill="#e4f3f5" stroke="#0f7a8a"/>
    <text x="528" y="140" font-weight="bold" fill="#0f7a8a">互耦与罩体（随角度变）</text>
    <text x="528" y="160" font-size="10">相邻阵元耦合 → 等效阻抗漂移</text>
    <text x="528" y="178" font-size="10">天线罩 → 插损、波束偏移</text>
    <text x="528" y="196" font-size="10" fill="#0f7a8a">需按扫描角 / 频点分档校准</text>

    <rect x="742" y="118" width="168" height="84" rx="8" fill="#e4f3f5" stroke="#0f7a8a"/>
    <text x="758" y="140" font-weight="bold" fill="#0f7a8a">温漂与老化（时变）</text>
    <text x="758" y="160" font-size="10">相位随温度漂移</text>
    <text x="758" y="178" font-size="10">器件参数随时间退化</text>
    <text x="758" y="196" font-size="10" fill="#0f7a8a">需要在线自校准</text>
  </g>

  <!-- methods -->
  <rect x="30" y="230" width="900" height="212" rx="11" fill="#ffffff" stroke="#c96a1f" stroke-width="1.8"/>
  <text x="52" y="254" font-size="13" font-weight="bold" fill="#c96a1f">② 主要校准方法（按"要不要相位信息"和"串行还是并行"分类）</text>

  <g font-size="10.4" fill="#333">
    <rect x="52" y="266" width="424" height="78" rx="8" fill="#faf0e6" stroke="#c96a1f"/>
    <text x="68" y="288" font-weight="bold" fill="#c96a1f">REV 旋转矢量法（工程最常用 · 仅测幅度）</text>
    <text x="68" y="308" font-size="10">固定其余通道，把待测通道相位 0°→360° 旋转，测合成幅度曲线</text>
    <text x="68" y="326" font-size="10">由 REVmax / REVmin 与最大点相位反解该单元幅相；需 2N 次测量</text>
    <text x="68" y="340" font-size="10" fill="#8a3a6a">▸ 优点：只需功率计，不需要相干接收；已在天基 SAR 上在轨验证</text>

    <rect x="492" y="266" width="418" height="78" rx="8" fill="#faf0e6" stroke="#c96a1f"/>
    <text x="508" y="288" font-weight="bold" fill="#c96a1f">近场扫描法（精度最高 · 实验室主力）</text>
    <text x="508" y="308" font-size="10">探头距阵面 3~5λ，闭合面上采样电场，反演各单元幅相与有源方向图</text>
    <text x="508" y="326" font-size="10">再经 NF→FF 变换得到远场方向图</text>
    <text x="508" y="340" font-size="10" fill="#8a3a6a">▸ 缺点：探头要机械扫描，大阵耗时；不适合外场</text>

    <rect x="52" y="354" width="424" height="78" rx="8" fill="#f6ebf1" stroke="#8a3a6a"/>
    <text x="68" y="376" font-weight="bold" fill="#8a3a6a">并行 / 编码法（大阵提速的关键）</text>
    <text x="68" y="396" font-size="10">用 Hadamard / Walsh / PN 正交码同时调制多个通道相位</text>
    <text x="68" y="414" font-size="10">从合成信号里解出各通道激励，测量次数从 N 降到 log₂N 量级</text>
    <text x="68" y="428" font-size="10" fill="#8a3a6a">▸ TerraSAR-X / Sentinel-1 均采用此类在轨编码校准</text>

    <rect x="492" y="354" width="418" height="78" rx="8" fill="#edf4ea" stroke="#4a7a3a"/>
    <text x="508" y="376" font-weight="bold" fill="#4a7a3a">内建环回 / 耦合线自校准（在轨与在线）</text>
    <text x="508" y="396" font-size="10">阵列内部预制耦合线或定向耦合器，把发射信号耦合回接收通道</text>
    <text x="508" y="414" font-size="10">不依赖外部探头，可在轨周期性执行，补偿温漂</text>
    <text x="508" y="428" font-size="10" fill="#4a7a3a">▸ 代价：耦合线本身也占面积、引入误差，大阵布线困难</text>
  </g>

  <!-- flow -->
  <rect x="30" y="456" width="900" height="206" rx="11" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.8"/>
  <text x="52" y="480" font-size="13" font-weight="bold" fill="#0f7a8a">③ 一次完整校准的流水（地面研发阶段）</text>

  <g font-size="10">
    <rect x="52" y="498" width="128" height="56" rx="8" fill="#e4f3f5" stroke="#0f7a8a"/>
    <text x="116" y="521" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f7a8a">1. 架台与对齐</text>
    <text x="116" y="540" text-anchor="middle" font-size="9.3" fill="#556">探头 / 暗室 / 远场距离</text>

    <rect x="204" y="498" width="128" height="56" rx="8" fill="#e4f3f5" stroke="#0f7a8a"/>
    <text x="268" y="521" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f7a8a">2. 测通道响应</text>
    <text x="268" y="540" text-anchor="middle" font-size="9.3" fill="#556">REV / 扫描 / 编码</text>

    <rect x="356" y="498" width="128" height="56" rx="8" fill="#e4f3f5" stroke="#0f7a8a"/>
    <text x="420" y="521" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f7a8a">3. 解算幅相误差</text>
    <text x="420" y="540" text-anchor="middle" font-size="9.3" fill="#556">曲线拟合 / 矩阵求逆</text>

    <rect x="508" y="498" width="128" height="56" rx="8" fill="#faf0e6" stroke="#c96a1f"/>
    <text x="572" y="521" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c96a1f">4. 生成补偿表</text>
    <text x="572" y="540" text-anchor="middle" font-size="9.3" fill="#556">按频点 × 温度 × 角度</text>

    <rect x="660" y="498" width="128" height="56" rx="8" fill="#faf0e6" stroke="#c96a1f"/>
    <text x="724" y="521" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c96a1f">5. 写回波控</text>
    <text x="724" y="540" text-anchor="middle" font-size="9.3" fill="#556">叠加到正常配相量上</text>

    <rect x="812" y="498" width="98" height="56" rx="8" fill="#edf4ea" stroke="#4a7a3a"/>
    <text x="861" y="521" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">6. 复测验证</text>
    <text x="861" y="540" text-anchor="middle" font-size="9.3" fill="#556">比方向图</text>

    <path d="M 180 526 L 204 526" stroke="#0f7a8a" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M 332 526 L 356 526" stroke="#0f7a8a" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M 484 526 L 508 526" stroke="#0f7a8a" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M 636 526 L 660 526" stroke="#0f7a8a" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M 788 526 L 812 526" stroke="#0f7a8a" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M 861 554 L 861 584 L 116 584 L 116 554" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4 3"/>
    <text x="470" y="600" text-anchor="middle" font-size="10" fill="#4a7a3a">6 的复测结果不达标 → 回到 2 重新测量（迭代 2~3 轮是常态）</text>

    <text x="52" y="628" font-size="10.5" fill="#0f7a8a" font-weight="bold">验收判据：</text>
    <text x="126" y="628" font-size="10.5">校准后残余幅相误差应<b>小于移相器步进</b>（如 6 bit → 5.6°）；交叉极化隔离、指向误差（≤0.1 波束宽度）同步验收</text>
    <text x="52" y="650" font-size="10.5" fill="#556">工程坑：在常温校准后在高温工作——相位漂移可能吃掉全部校准成果。温补表必须与校准表同时交付</text>
  </g>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f7a8a"/>
    </marker>
  </defs>
</svg>
