<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="600" fill="#eef5f8"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">ITU 的天花板：EPFD 如何锁住 NGSO 星座（RR Article 22）</text>

  <!-- GSO arc -->
  <path d="M 80 180 Q 480 100 880 180" fill="none" stroke="#4a7a3a" stroke-width="3"/>
  <text x="480" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">GSO 弧（35786 km，既有 GEO 卫星的家）</text>
  <g font-size="12" fill="#4a7a3a">
    <circle cx="200" cy="158" r="9" fill="#4a7a3a"/>
    <circle cx="480" cy="128" r="9" fill="#4a7a3a"/>
    <circle cx="760" cy="158" r="9" fill="#4a7a3a"/>
  </g>

  <!-- Earth -->
  <circle cx="480" cy="490" r="130" fill="#cfe7ee" stroke="#0f7a8a" stroke-width="2.5"/>
  <text x="480" y="496" text-anchor="middle" font-size="14" fill="#0f7a8a" font-weight="bold">地球</text>

  <!-- NGSO sats -->
  <g font-size="11.5" fill="#c96a1f" font-weight="bold">
    <g transform="translate(260,330)"><rect x="-14" y="-10" width="28" height="20" rx="4" fill="#c96a1f"/><text x="0" y="-16" text-anchor="middle">NGSO-1</text></g>
    <g transform="translate(480,300)"><rect x="-14" y="-10" width="28" height="20" rx="4" fill="#c96a1f"/><text x="0" y="-16" text-anchor="middle">NGSO-2</text></g>
    <g transform="translate(700,330)"><rect x="-14" y="-10" width="28" height="20" rx="4" fill="#c96a1f"/><text x="0" y="-16" text-anchor="middle">NGSO-3</text></g>
  </g>

  <!-- interference to GSO -->
  <g stroke="#c0282d" stroke-width="1.8" stroke-dasharray="4 3" fill="none" opacity="0.75">
    <path d="M 268 318 L 210 168"/>
    <path d="M 482 288 L 484 140"/>
    <path d="M 692 318 L 750 168"/>
  </g>
  <text x="480" y="240" text-anchor="middle" font-size="12.5" fill="#c0282d" font-weight="bold">几百颗星的旁瓣在 GSO 弧上叠加 → EPFD 是"聚合量"</text>

  <!-- EPFD formula box -->
  <rect x="60" y="470" width="250" height="110" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.5"/>
  <text x="78" y="496" font-size="14" font-weight="bold" fill="#0f7a8a">EPFD 公式（S.1503）</text>
  <text x="78" y="520" font-size="12" font-family="Consolas,monospace" fill="#333">EPFD = 10lg Σ Pᵢ·Gᵗ(θ)·Gʳ(φ)</text>
  <text x="78" y="538" font-size="12" font-family="Consolas,monospace" fill="#333">　　　　/ (4πR²)　dBW/m²/MHz</text>
  <text x="78" y="560" font-size="11" fill="#555">发方增益(θ)×收方增益(φ) 都按方向算</text>

  <!-- limits box -->
  <rect x="330" y="470" width="280" height="110" rx="10" fill="#ffffff" stroke="#c0282d" stroke-width="1.5"/>
  <text x="348" y="496" font-size="14" font-weight="bold" fill="#c0282d">量级感（Article 22 硬限）</text>
  <g font-size="12" fill="#333" font-family="Consolas,monospace">
    <text x="348" y="520">Ku DL（10.7–12.7 GHz）:</text>
    <text x="348" y="538">−175 ~ −160 dBW/m²/40kHz</text>
    <text x="348" y="556">按时间百分比分段，99.7% 时间</text>
    <text x="348" y="573">内不得超 −165.3 dBW/m² 量级</text>
  </g>

  <!-- mitigation box -->
  <rect x="630" y="470" width="270" height="110" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="648" y="496" font-size="14" font-weight="bold" fill="#4a7a3a">运营商怎么活下来</text>
  <g font-size="12" fill="#333">
    <text x="648" y="520">▸ 波束转向避开 GSO 弧（−10~15 dB）</text>
    <text x="648" y="540">▸ 过弧时动态降功率（−5~10 dB）</text>
    <text x="648" y="560">▸ 频谱规划错开 + 天线旁瓣整形</text>
    <text x="648" y="580">▸ EPFD 是 NGSO 商用前最大的监管约束</text>
  </g>

  <text x="480" y="446" text-anchor="middle" font-size="13" fill="#333">关键理解：<tspan font-weight="bold" fill="#c0282d">EPFD 不是单星的 PFD，是全星座在 GSO 接收点的聚合等效功率通量密度</tspan>——星越多限得越紧。</text>
</svg>
