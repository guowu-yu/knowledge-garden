<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="频点扫描示意">
  <rect width="960" height="520" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#0b1c28">频点扫描：频段 → 同步栅格 → 尝试小区搜索</text>
  <text x="40" y="68" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="14" fill="#1f3a4d">不是每个 Hz 都扫；只扫允许放置 SSB 中心频点的位置</text>

  <rect x="40" y="100" width="880" height="50" rx="8" fill="#1f3a4d"/>
  <text x="60" y="130" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="14" fill="#fff">某个 NR 频段（示例）———— 连续频率范围 ————</text>

  <text x="40" y="185" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#0b1c28">信道栅格（很多 ARFCN）—— 点很密，用于描述信道</text>
  <g>
    <circle cx="60" cy="210" r="3" fill="#9bb8c4"/><circle cx="80" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="100" cy="210" r="3" fill="#9bb8c4"/><circle cx="120" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="140" cy="210" r="3" fill="#9bb8c4"/><circle cx="160" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="180" cy="210" r="3" fill="#9bb8c4"/><circle cx="200" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="220" cy="210" r="3" fill="#9bb8c4"/><circle cx="240" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="260" cy="210" r="3" fill="#9bb8c4"/><circle cx="280" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="300" cy="210" r="3" fill="#9bb8c4"/><circle cx="320" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="340" cy="210" r="3" fill="#9bb8c4"/><circle cx="360" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="380" cy="210" r="3" fill="#9bb8c4"/><circle cx="400" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="420" cy="210" r="3" fill="#9bb8c4"/><circle cx="440" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="460" cy="210" r="3" fill="#9bb8c4"/><circle cx="480" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="500" cy="210" r="3" fill="#9bb8c4"/><circle cx="520" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="540" cy="210" r="3" fill="#9bb8c4"/><circle cx="560" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="580" cy="210" r="3" fill="#9bb8c4"/><circle cx="600" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="620" cy="210" r="3" fill="#9bb8c4"/><circle cx="640" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="660" cy="210" r="3" fill="#9bb8c4"/><circle cx="680" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="700" cy="210" r="3" fill="#9bb8c4"/><circle cx="720" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="740" cy="210" r="3" fill="#9bb8c4"/><circle cx="760" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="780" cy="210" r="3" fill="#9bb8c4"/><circle cx="800" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="820" cy="210" r="3" fill="#9bb8c4"/><circle cx="840" cy="210" r="3" fill="#9bb8c4"/>
    <circle cx="860" cy="210" r="3" fill="#9bb8c4"/><circle cx="880" cy="210" r="3" fill="#9bb8c4"/>
  </g>

  <text x="40" y="260" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#0b1c28">同步栅格 / GSCN（点更少）—— 只有这些才是 SSB 中心频点候选</text>
  <g font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="11" fill="#1f3a4d">
    <circle cx="100" cy="295" r="8" fill="#0f7a8a"/><text x="100" y="320" text-anchor="middle">G1</text>
    <circle cx="250" cy="295" r="8" fill="#0f7a8a"/><text x="250" y="320" text-anchor="middle">G2</text>
    <circle cx="400" cy="295" r="8" fill="#c9852c"/><text x="400" y="320" text-anchor="middle">试这里</text>
    <circle cx="550" cy="295" r="8" fill="#0f7a8a"/><text x="550" y="320" text-anchor="middle">G4</text>
    <circle cx="700" cy="295" r="8" fill="#0f7a8a"/><text x="700" y="320" text-anchor="middle">G5</text>
    <circle cx="850" cy="295" r="8" fill="#0f7a8a"/><text x="850" y="320" text-anchor="middle">G6</text>
  </g>

  <rect x="40" y="350" width="880" height="130" rx="12" fill="#d9e8ef"/>
  <text x="60" y="385" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0b1c28">对每个橙色候选点</text>
  <text x="60" y="415" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="13" fill="#1f3a4d">1) 把射频调到该 SSB 中心附近　2) 尝试允许的 SSB 子载波间隔（SCS）　3) 做 PSS 检测（小区搜索）</text>
  <text x="60" y="445" font-family="Segoe UI, 'Microsoft YaHei', sans-serif" font-size="13" fill="#1f3a4d">命中 → 保留小区信息；未命中 → 换下一个 GSCN。有历史/已存小区时，优先跳到更可能的 GSCN。</text>
</svg>
