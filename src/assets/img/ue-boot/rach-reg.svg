<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="RACH and registration">
  <rect width="960" height="420" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Steps 5-6: Random access and registration</text>

  <rect x="40" y="90" width="430" height="250" rx="14" fill="#0f7a8a"/>
  <text x="255" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">5 Random access</text>
  <text x="60" y="165" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Trigger: MO / registration...</text>
  <text x="60" y="195" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Msg1-4 (or 2-step)</text>
  <text x="60" y="225" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Get TA + temporary ID</text>
  <text x="60" y="255" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">RRC Setup / Setup Complete</text>
  <text x="60" y="285" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Enter RRC_CONNECTED</text>

  <rect x="490" y="90" width="430" height="250" rx="14" fill="#c9852c"/>
  <text x="705" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">6 Registration (NAS)</text>
  <text x="510" y="165" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Registration Request</text>
  <text x="510" y="195" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">AMF selection / auth / SMC</text>
  <text x="510" y="225" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Registration Accept</text>
  <text x="510" y="255" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">RM-REGISTERED</text>
  <text x="510" y="285" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Then PDU session / data</text>

  <text x="40" y="385" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">RACH opens the AS pipe; Registration attaches the UE to 5GC control plane.</text>
</svg>
