<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="透明转发与再生转发架构对比">
  <rect width="900" height="420" rx="18" fill="#eef5f8"/>
  <text x="24" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">透明转发（bent-pipe）vs 再生转发（regenerative）</text>
  <rect x="0" y="52" width="900" height="130" fill="#e2eef4"/>
  <text x="20" y="74" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">太空</text>
  <rect x="0" y="356" width="900" height="64" fill="#dfeae4"/>
  <text x="20" y="386" font-family="Segoe UI, sans-serif" font-size="12" fill="#7a8b99">地面</text>
  <defs>
    <marker id="arT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0a5561"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9852c"/>
    </marker>
    <marker id="arD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a4b5c"/>
    </marker>
  </defs>

  <!-- 左半：透明转发 -->
  <text x="225" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">透明转发（Rel-17）</text>
  <g>
    <rect x="140" y="88" width="170" height="56" rx="10" fill="#0f7a8a"/>
    <text x="225" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f4fafc">NTN payload</text>
    <text x="225" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cfeaf0">放大 + 变频（AF）</text>
  </g>
  <g>
    <rect x="60" y="290" width="90" height="50" rx="10" fill="#ffffff" stroke="#c9852c" stroke-width="1.6"/>
    <text x="105" y="319" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0b1c28">UE</text>
  </g>
  <g>
    <rect x="300" y="290" width="110" height="50" rx="10" fill="#3a4b5c"/>
    <text x="355" y="312" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">gNB + 5GC</text>
    <text x="355" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#c8d6e0">留在地面</text>
  </g>
  <line x1="118" y1="288" x2="180" y2="146" stroke="#c9852c" stroke-width="2" marker-end="url(#arO)"/>
  <text x="52" y="220" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#a9681f">Service link</text>
  <text x="52" y="236" font-family="Segoe UI, sans-serif" font-size="10" fill="#a9681f">NR 波形</text>
  <line x1="285" y1="146" x2="340" y2="288" stroke="#0a5561" stroke-width="2" marker-end="url(#arT)"/>
  <text x="292" y="220" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a5561">Feeder link</text>
  <text x="292" y="236" font-family="Segoe UI, sans-serif" font-size="10" fill="#0a5561">仍是 NR 波形</text>
  <text x="225" y="400" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1f3a4d">空口时序横跨两条链路</text>

  <!-- 分隔线 -->
  <line x1="450" y1="60" x2="450" y2="340" stroke="#8a99a8" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- 右半：再生转发 -->
  <text x="675" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">再生转发（Rel-19）</text>
  <g>
    <rect x="560" y="86" width="230" height="62" rx="10" fill="#0f7a8a"/>
    <text x="675" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f4fafc">NTN payload + gNB 上星</text>
    <text x="675" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cfeaf0">解调 / 译码 / 再编码 / 调度</text>
  </g>
  <g>
    <rect x="520" y="290" width="90" height="50" rx="10" fill="#ffffff" stroke="#c9852c" stroke-width="1.6"/>
    <text x="565" y="319" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0b1c28">UE</text>
  </g>
  <g>
    <rect x="730" y="290" width="110" height="50" rx="10" fill="#ffffff" stroke="#3a4b5c" stroke-width="1.6"/>
    <text x="785" y="312" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0b1c28">5GC</text>
    <text x="785" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1f3a4d">核心网在地面</text>
  </g>
  <line x1="578" y1="288" x2="610" y2="150" stroke="#c9852c" stroke-width="2" marker-end="url(#arO)"/>
  <text x="500" y="220" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#a9681f">Service link</text>
  <text x="500" y="236" font-family="Segoe UI, sans-serif" font-size="10" fill="#a9681f">NR 波形（唯一空口）</text>
  <line x1="755" y1="150" x2="780" y2="288" stroke="#3a4b5c" stroke-width="2" marker-end="url(#arD)"/>
  <text x="760" y="220" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3a4b5c">Feeder link</text>
  <text x="760" y="236" font-family="Segoe UI, sans-serif" font-size="10" fill="#3a4b5c">NG / F1 传输</text>
  <text x="675" y="400" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1f3a4d">空口时序只包含服务链路</text>
</svg>
