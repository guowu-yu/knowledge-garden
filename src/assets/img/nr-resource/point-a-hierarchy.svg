<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Point A and RB hierarchy">
  <rect width="960" height="560" rx="18" fill="#f3f7f9"/>
  <text x="40" y="48" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Point A and RB Hierarchy</text>
  <text x="40" y="76" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Point A anchors CRB grid; CRB / BWP-PRB / VRB are different numbering views</text>

  <rect x="80" y="130" width="800" height="54" rx="10" fill="#d9e8ef" stroke="#0f7a8a"/>
  <text x="480" y="163" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#0a5561">Carrier frequency (schematic)</text>

  <line x1="160" y1="120" x2="160" y2="220" stroke="#c9852c" stroke-width="3"/>
  <circle cx="160" cy="120" r="8" fill="#c9852c"/>
  <text x="160" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a5a14">Point A</text>

  <rect x="300" y="138" width="90" height="38" rx="6" fill="#0f7a8a"/>
  <text x="345" y="163" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">SSB</text>
  <path d="M300 210 L160 210" stroke="#8a5a14" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="230" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a5a14">offsetToPointA...</text>

  <rect x="80" y="260" width="800" height="70" rx="10" fill="#fff" stroke="#0f7a8a" stroke-width="2"/>
  <text x="100" y="290" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a5561">CRB (common RB)</text>
  <text x="100" y="312" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Numbered relative to Point A</text>
  <g font-family="Segoe UI, sans-serif" font-size="11" fill="#0a5561">
    <rect x="420" y="275" width="40" height="40" fill="#eaf4f7" stroke="#0f7a8a"/><text x="440" y="300" text-anchor="middle">0</text>
    <rect x="460" y="275" width="40" height="40" fill="#eaf4f7" stroke="#0f7a8a"/><text x="480" y="300" text-anchor="middle">1</text>
    <rect x="500" y="275" width="40" height="40" fill="#eaf4f7" stroke="#0f7a8a"/><text x="520" y="300" text-anchor="middle">2</text>
    <rect x="540" y="275" width="40" height="40" fill="#eaf4f7" stroke="#0f7a8a"/><text x="560" y="300" text-anchor="middle">3</text>
    <rect x="580" y="275" width="40" height="40" fill="#eaf4f7" stroke="#0f7a8a"/><text x="600" y="300" text-anchor="middle">4</text>
  </g>

  <rect x="80" y="360" width="520" height="70" rx="10" fill="#fff" stroke="#c9852c" stroke-width="2"/>
  <text x="100" y="390" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a5a14">PRB inside BWP</text>
  <text x="100" y="412" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">UE active contiguous RBs; PRB often from 0</text>
  <g font-family="Segoe UI, sans-serif" font-size="11" fill="#8a5a14">
    <rect x="300" y="375" width="40" height="40" fill="#fff4e6" stroke="#c9852c"/><text x="320" y="400" text-anchor="middle">0</text>
    <rect x="340" y="375" width="40" height="40" fill="#fff4e6" stroke="#c9852c"/><text x="360" y="400" text-anchor="middle">1</text>
    <rect x="380" y="375" width="40" height="40" fill="#fff4e6" stroke="#c9852c"/><text x="400" y="400" text-anchor="middle">2</text>
    <rect x="420" y="375" width="40" height="40" fill="#fff4e6" stroke="#c9852c"/><text x="440" y="400" text-anchor="middle">3</text>
  </g>

  <rect x="620" y="360" width="260" height="70" rx="10" fill="#fff" stroke="#1f3a4d" stroke-width="2"/>
  <text x="750" y="390" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b1c28">VRB to PRB</text>
  <text x="750" y="412" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">virtual index maps to physical</text>

  <text x="480" y="480" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Shared spectrum may also use interlaced RBs</text>
  <text x="480" y="508" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#0a5561">Point A = ruler origin; CRB = common ticks; PRB = BWP-local ticks</text>
</svg>
