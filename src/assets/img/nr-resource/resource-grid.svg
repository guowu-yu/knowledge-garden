<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Resource grid RE and RB">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6f8"/>
      <stop offset="100%" stop-color="#f5f7f8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="18" fill="url(#bg2)"/>
  <text x="40" y="48" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Resource Grid / RE / RB</text>
  <text x="40" y="76" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Defined by numerology mu and carrier: subcarrier k x OFDM symbol l; also port p</text>

  <line x1="120" y1="460" x2="860" y2="460" stroke="#0a5561" stroke-width="2"/>
  <line x1="120" y1="460" x2="120" y2="120" stroke="#0a5561" stroke-width="2"/>
  <text x="490" y="500" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#0a5561">OFDM symbol l --&gt;</text>
  <text x="48" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#0a5561" transform="rotate(-90 48 300)">subcarrier k --&gt;</text>

  <rect x="200" y="220" width="36" height="22" fill="#c9852c" stroke="#8a5a14" stroke-width="1.5"/>

  <g stroke="#9bb8c2" stroke-width="1">
    <path d="M164 140 V448 M200 140 V448 M236 140 V448 M272 140 V448 M308 140 V448 M344 140 V448 M380 140 V448 M416 140 V448 M452 140 V448 M488 140 V448 M524 140 V448 M560 140 V448 M596 140 V448 M632 140 V448 M668 140 V448"/>
    <path d="M164 140 H668 M164 162 H668 M164 184 H668 M164 206 H668 M164 228 H668 M164 250 H668 M164 272 H668 M164 294 H668 M164 316 H668 M164 338 H668 M164 360 H668 M164 382 H668 M164 404 H668"/>
  </g>
  <rect x="164" y="140" width="504" height="264" fill="rgba(15,122,138,0.06)" stroke="#0f7a8a" stroke-width="2.5"/>
  <text x="416" y="430" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a5561">1 RB = 12 contiguous subcarriers</text>

  <rect x="700" y="160" width="220" height="200" rx="12" fill="#fff" stroke="#d0dde3"/>
  <text x="810" y="195" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c28">Legend</text>
  <rect x="730" y="220" width="28" height="18" fill="#c9852c" stroke="#8a5a14"/>
  <text x="770" y="234" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">RE (k, l)</text>
  <text x="770" y="258" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">+ port p, mu</text>
  <rect x="730" y="290" width="28" height="18" fill="rgba(15,122,138,0.15)" stroke="#0f7a8a"/>
  <text x="770" y="304" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Resource grid</text>
  <text x="730" y="340" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">SCS = 15 x 2^mu kHz</text>
</svg>
