<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Antenna port and QCL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf4f7"/>
      <stop offset="100%" stop-color="#f7f1e8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0a5561"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="18" fill="url(#bg)"/>
  <text x="40" y="48" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Antenna Port vs QCL</text>
  <text x="40" y="78" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Same port: channel inferable; QCL: large-scale parameters inferable</text>

  <rect x="60" y="120" width="200" height="320" rx="14" fill="#fff" stroke="#0f7a8a" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0a5561">Physical Array</text>
  <circle cx="110" cy="210" r="18" fill="#0f7a8a"/>
  <circle cx="160" cy="210" r="18" fill="#0f7a8a"/>
  <circle cx="210" cy="210" r="18" fill="#0f7a8a"/>
  <circle cx="110" cy="280" r="18" fill="#0f7a8a"/>
  <circle cx="160" cy="280" r="18" fill="#0f7a8a"/>
  <circle cx="210" cy="280" r="18" fill="#0f7a8a"/>
  <circle cx="110" cy="350" r="18" fill="#0f7a8a"/>
  <circle cx="160" cy="350" r="18" fill="#0f7a8a"/>
  <circle cx="210" cy="350" r="18" fill="#0f7a8a"/>
  <text x="160" y="410" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">Mapping / Precoding</text>

  <path d="M270 280 H330" stroke="#0a5561" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="340" y="150" width="220" height="260" rx="14" fill="#fff" stroke="#c9852c" stroke-width="2"/>
  <text x="450" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#8a5a14">Antenna Ports</text>
  <rect x="370" y="210" width="160" height="48" rx="10" fill="#fff4e6" stroke="#c9852c"/>
  <text x="450" y="240" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#0b1c28">Port p0 (DMRS)</text>
  <rect x="370" y="280" width="160" height="48" rx="10" fill="#fff4e6" stroke="#c9852c"/>
  <text x="450" y="310" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#0b1c28">Port p1 (CSI-RS)</text>
  <text x="450" y="370" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1f3a4d">Same-port channel reuse</text>

  <path d="M570 280 H630" stroke="#0a5561" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="640" y="150" width="260" height="260" rx="14" fill="#fff" stroke="#0f7a8a" stroke-width="2"/>
  <text x="770" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0a5561">QCL Relation</text>
  <text x="770" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#0b1c28">If p0 and p1 are QCL</text>
  <text x="770" y="260" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">infer large-scale:</text>
  <text x="770" y="295" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">delay / Doppler spread</text>
  <text x="770" y="320" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">avg gain / avg delay</text>
  <text x="770" y="345" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">spatial Rx (Type D)</text>
  <text x="770" y="385" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#0a5561">beam &amp; tracking aid</text>
</svg>
