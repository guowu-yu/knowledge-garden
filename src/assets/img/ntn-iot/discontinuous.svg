<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="600" fill="#eef5f8"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">间断覆盖：与"看不见星星的日子"共处</text>

  <!-- satellite passes timeline -->
  <line x1="60" y1="130" x2="900" y2="130" stroke="#999" stroke-width="2"/>
  <text x="60" y="112" font-size="13" fill="#555">时间 →</text>
  <!-- coverage windows -->
  <rect x="120" y="118" width="90" height="24" rx="5" fill="#0f7a8a" opacity="0.75"/>
  <rect x="330" y="118" width="90" height="24" rx="5" fill="#0f7a8a" opacity="0.75"/>
  <rect x="560" y="118" width="90" height="24" rx="5" fill="#0f7a8a" opacity="0.75"/>
  <rect x="790" y="118" width="90" height="24" rx="5" fill="#0f7a8a" opacity="0.75"/>
  <g font-size="11.5" fill="#0f7a8a" font-weight="bold">
    <text x="165" y="160" text-anchor="middle">过境 1</text>
    <text x="375" y="160" text-anchor="middle">过境 2</text>
    <text x="605" y="160" text-anchor="middle">过境 3</text>
    <text x="835" y="160" text-anchor="middle">过境 4</text>
  </g>
  <text x="640" y="140" font-size="12" fill="#555">稀疏 LEO 星座：一次可见几分钟，间隔几十分钟到数小时</text>

  <!-- PSM/eDRX sleep bands -->
  <rect x="210" y="200" width="120" height="70" rx="8" fill="#4a7a3a" opacity="0.2"/>
  <rect x="420" y="200" width="140" height="70" rx="8" fill="#4a7a3a" opacity="0.2"/>
  <rect x="650" y="200" width="140" height="70" rx="8" fill="#4a7a3a" opacity="0.2"/>
  <g font-size="12.5" fill="#4a7a3a" font-weight="bold">
    <text x="270" y="238" text-anchor="middle">PSM 深睡</text>
    <text x="490" y="238" text-anchor="middle">eDRX 长周期</text>
    <text x="720" y="238" text-anchor="middle">PSM 深睡</text>
  </g>
  <g font-size="12.5" fill="#333">
    <text x="120" y="220" font-weight="bold" fill="#0f7a8a">醒 → 接入 → 发数据</text>
    <text x="330" y="220" font-weight="bold" fill="#0f7a8a">醒 → 听寻呼</text>
    <text x="560" y="220" font-weight="bold" fill="#0f7a8a">醒 → 接入</text>
    <text x="790" y="220" font-weight="bold" fill="#0f7a8a">醒 → 听寻呼</text>
  </g>
  <text x="480" y="300" text-anchor="middle" font-size="13" fill="#333">IoT-NTN 的独特之处：<tspan font-weight="bold" fill="#0f7a8a">断覆盖是常态不是故障</tspan>——协议的任务是让终端"算得准什么时候有星星"</text>

  <!-- mechanism boxes -->
  <rect x="40" y="330" width="430" height="240" rx="12" fill="#ffffff" stroke="#0f7a8a" stroke-width="2"/>
  <rect x="40" y="330" width="430" height="40" rx="12" fill="#0f7a8a"/>
  <text x="255" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">预测覆盖的三个信息源</text>
  <g font-size="13" fill="#333">
    <text x="58" y="396">▸ <tspan font-weight="bold">服务星星历</tspan>（SIB31）：算当前卫星何时离开</text>
    <text x="58" y="420">▸ <tspan font-weight="bold">邻星星历</tspan>：系统信息直接广播下一颗星</text>
    <text x="58" y="444">　的轨道参数——"下一班车时刻表"</text>
    <text x="58" y="472">▸ <tspan font-weight="bold">t-Service</tspan>：服务窗口明确的截止时刻，</text>
    <text x="58" y="496">　在此之前完成接入；窗口外不搜网</text>
    <text x="58" y="528" fill="#0f7a8a" font-weight="bold">效果：无覆盖期不再盲扫（电池杀手），</text>
    <text x="58" y="552" fill="#0f7a8a" font-weight="bold">深度休眠直到推演出的下一个窗口。</text>
  </g>

  <rect x="490" y="330" width="430" height="240" rx="12" fill="#ffffff" stroke="#c96a1f" stroke-width="2"/>
  <rect x="490" y="330" width="430" height="40" rx="12" fill="#c96a1f"/>
  <text x="705" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">节电机制的尺度感</text>
  <g font-size="13" fill="#333">
    <text x="508" y="396">▸ eDRX 寻呼周期扩展到 <tspan font-weight="bold" font-family="Consolas,monospace">≈3 小时</tspan>量级</text>
    <text x="508" y="420">　（地面 NB-IoT 上限只有约 44 分钟档）</text>
    <text x="508" y="452">▸ PSM 深度休眠配合间断覆盖：醒来即接入，</text>
    <text x="508" y="476">　误差预算按"过境分钟"计算</text>
    <text x="508" y="508">▸ Rel-18 补充：预测性节电（按覆盖图提前</text>
    <text x="508" y="532">　进休眠）、跟踪区优化、减少假醒</text>
    <text x="508" y="560" fill="#c96a1f" font-weight="bold">十年电池 × 稀疏星座 = 可行的卫星 IoT 账本</text>
  </g>
</svg>
