<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="DCI vs UCI overview">
  <rect width="960" height="420" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">DCI vs UCI</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">Downlink control orders vs uplink control feedback</text>

  <rect x="40" y="110" width="400" height="230" rx="14" fill="#0f7a8a"/>
  <text x="240" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#fff">DCI</text>
  <text x="240" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">Downlink Control Information</text>
  <text x="70" y="230" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">gNB --&gt; UE</text>
  <text x="70" y="260" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Carried on PDCCH</text>
  <text x="70" y="290" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">Schedule DL/UL, indicate...</text>

  <rect x="520" y="110" width="400" height="230" rx="14" fill="#c9852c"/>
  <text x="720" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#fff">UCI</text>
  <text x="720" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">Uplink Control Information</text>
  <text x="550" y="230" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">UE --&gt; gNB</text>
  <text x="550" y="260" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">On PUCCH and/or PUSCH</text>
  <text x="550" y="290" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">HARQ-ACK / SR / CSI</text>

  <text x="40" y="385" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">One-liner: DCI tells the UE what to do; UCI tells the gNB how it went / what is needed.</text>
</svg>
