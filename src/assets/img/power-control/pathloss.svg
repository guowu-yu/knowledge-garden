<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Pathloss reference">
  <rect width="960" height="400" rx="18" fill="#eef5f7"/>
  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0b1c28">Pathloss reference signals</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f3a4d">UL open-loop needs a DL RS to estimate PL</text>

  <rect x="80" y="130" width="240" height="140" rx="12" fill="#0f7a8a"/>
  <text x="200" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">SSB</text>
  <text x="200" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e7f3f7">common / early access</text>

  <rect x="360" y="130" width="240" height="140" rx="12" fill="#c9852c"/>
  <text x="480" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">CSI-RS</text>
  <text x="480" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff">connected / beam-aware</text>

  <rect x="640" y="130" width="240" height="140" rx="12" fill="#1f3a4d"/>
  <text x="760" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">PL = refPower - RSRP</text>
  <text x="760" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7f3f7">filtered / configured</text>

  <text x="40" y="340" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f3a4d">pathlossReferenceRS in RRC ties PUSCH/PUCCH/SRS open-loop to a chosen SSB or CSI-RS.</text>
</svg>
