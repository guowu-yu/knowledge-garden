<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#eef5f8"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a8a">REV 解算流水：从功率曲线到补偿相位</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#556">一次完整的工程实现路径——每步都有可编程的落点</text>

  <!-- pipeline -->
  <g font-family="Consolas,monospace" font-size="10">
    <rect x="30" y="80" width="150" height="66" rx="8" fill="#f7fbfc" stroke="#0f7a8a"/>
    <text x="105" y="104" text-anchor="middle" fill="#0f7a8a">① 配置测试态</text>
    <text x="105" y="122" text-anchor="middle" fill="#667">其余单元固定</text>
    <text x="105" y="138" text-anchor="middle" fill="#667">待测单元扫相位</text>

    <rect x="196" y="80" width="150" height="66" rx="8" fill="#f7fbfc" stroke="#0f7a8a"/>
    <text x="271" y="104" text-anchor="middle" fill="#0f7a8a">② 采集功率</text>
    <text x="271" y="122" text-anchor="middle" fill="#667">远场探头 / 环回</text>
    <text x="271" y="138" text-anchor="middle" fill="#667">P(φ) 序列</text>

    <rect x="362" y="80" width="150" height="66" rx="8" fill="#f0f7ee" stroke="#4a7a3a"/>
    <text x="437" y="104" text-anchor="middle" fill="#4a7a3a">③ 正弦拟合</text>
    <text x="437" y="122" text-anchor="middle" fill="#667">或三态解方程</text>
    <text x="437" y="138" text-anchor="middle" fill="#667">得 E_m、E_r、φ_max</text>

    <rect x="528" y="80" width="150" height="66" rx="8" fill="#fdf4ea" stroke="#c96a1f"/>
    <text x="603" y="104" text-anchor="middle" fill="#c96a1f">④ 解二义性</text>
    <text x="603" y="122" text-anchor="middle" fill="#667">多轮/分组</text>
    <text x="603" y="138" text-anchor="middle" fill="#667">剔除伪解</text>

    <rect x="694" y="80" width="242" height="66" rx="8" fill="#fbf3f7" stroke="#8a3a6a"/>
    <text x="815" y="104" text-anchor="middle" fill="#8a3a6a">⑤ 生成补偿 + 写回</text>
    <text x="815" y="122" text-anchor="middle" fill="#667">Δφ_n 与 Δa_n 存入补偿表</text>
    <text x="815" y="138" text-anchor="middle" fill="#667">写回波控，复测验收</text>
  </g>
  <g stroke="#0f7a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <line x1="180" y1="113" x2="194" y2="113"/>
    <line x1="346" y1="113" x2="360" y2="113"/>
    <line x1="512" y1="113" x2="526" y2="113"/>
    <line x1="678" y1="113" x2="692" y2="113"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L6,3.5 L0,7 z" fill="#0f7a8a"/>
    </marker>
  </defs>

  <!-- pseudo code -->
  <rect x="30" y="164" width="520" height="340" rx="10" fill="#ffffff" stroke="#0f7a8a" stroke-width="1.5"/>
  <text x="290" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f7a8a">参考实现（Python / NumPy 骨架）</text>
  <text x="46" y="214" font-family="Consolas,monospace" font-size="10" fill="#333">import numpy as np</text>
  <text x="46" y="234" font-family="Consolas,monospace" font-size="10" fill="#333">P = measure_power_cube()      # [N, 3] 三态功率 (0, 90, 180)</text>
  <text x="46" y="254" font-family="Consolas,monospace" font-size="10" fill="#333">phi_err = np.zeros(N); amp_err = np.zeros(N)</text>
  <text x="46" y="274" font-family="Consolas,monospace" font-size="10" fill="#333">for n in range(N):</text>
  <text x="46" y="294" font-family="Consolas,monospace" font-size="10" fill="#4a7a3a">    p0, p90, p180 = P[n]</text>
  <text x="46" y="314" font-family="Consolas,monospace" font-size="10" fill="#4a7a3a">    # 三态联立：|E_r + E_n e^{jΔ}|² 分别在 0/90/180°</text>
  <text x="46" y="334" font-family="Consolas,monospace" font-size="10" fill="#333">    Er2, En2 = solve_three_state(p0, p90, p180)</text>
  <text x="46" y="354" font-family="Consolas,monospace" font-size="10" fill="#333">    phi_err[n] = np.arctan2(...)      # 相对参考单元</text>
  <text x="46" y="374" font-family="Consolas,monospace" font-size="10" fill="#333">    amp_err[n] = np.sqrt(En2) / E_ref</text>
  <text x="46" y="396" font-family="Consolas,monospace" font-size="10" fill="#8a3a6a"># 消除二义性：换初始相位分布再跑一轮，交叉验证符号</text>
  <text x="46" y="416" font-family="Consolas,monospace" font-size="10" fill="#8a3a6a">phi_err = resolve_ambiguity(phi_err, second_round)</text>
  <text x="46" y="438" font-family="Consolas,monospace" font-size="10" fill="#c96a1f"># 补偿表：写回时施加 -phi_err 与 1/amp_err</text>
  <text x="46" y="458" font-family="Consolas,monospace" font-size="10" fill="#c96a1f">write_backwave_control(-phi_err, 1.0/amp_err)</text>
  <text x="46" y="480" font-family="Consolas,monospace" font-size="10" fill="#667">assert np.std(phi_err) &lt; phase_shifter_lsb   # 验收</text>

  <!-- checklist -->
  <rect x="566" y="164" width="370" height="340" rx="10" fill="#ffffff" stroke="#c96a1f" stroke-width="1.5"/>
  <text x="751" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c96a1f">工程实现清单</text>
  <text x="582" y="216" font-size="10.5" fill="#333">□ 参考单元选定（且它自身的误差也要回收）</text>
  <text x="582" y="240" font-size="10.5" fill="#333">□ 每轮测量的"其余单元固定态"写入日志</text>
  <text x="582" y="264" font-size="10.5" fill="#333">□ 用远场 / 中场 / 环回哪种通道？带宽与频点</text>
  <text x="582" y="288" font-size="10.5" fill="#333">□ 相位步进 = 移相器 LSB 的整数倍（避免量化引入额外误差）</text>
  <text x="582" y="312" font-size="10.5" fill="#333">□ 温漂：同一温度点内完成一轮，否则曲线被漂移污染</text>
  <text x="582" y="336" font-size="10.5" fill="#333">□ 反射/多径：探头方位与暗室吸波状况</text>
  <text x="582" y="360" font-size="10.5" fill="#333">□ 噪声底评估：单单元贡献 vs 噪声，决定 M 或分组</text>
  <text x="582" y="384" font-size="10.5" fill="#8a3a6a">□ 二义性消除：多轮不同初始分布的交叉验证</text>
  <text x="582" y="408" font-size="10.5" fill="#8a3a6a">□ 结果一致性：与增益/副瓣复测互为验证</text>
  <text x="582" y="432" font-size="10.5" fill="#4a7a3a">□ 残余误差统计：是否压到移相器步进以内</text>
  <text x="582" y="456" font-size="10.5" fill="#4a7a3a">□ 时间预算：N 与 M 决定总时长，需与产线节拍对齐</text>
  <text x="582" y="482" font-size="10.5" fill="#667">核心心法：REV 的价值不在"能测"，而在"只测幅度也能测准"。</text>
</svg>
